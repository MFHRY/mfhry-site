<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>合成 IS-7 · mfhry.store</title>
<meta name="description" content="合并小坦克，一路合成到 IS-7 重坦。">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #111; }
  .back {
    position: fixed; left: 10px; top: 50%; transform: translateY(-50%);
    z-index: 10; width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; text-decoration: none;
    background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.22);
    color: #fff; font: 16px/1 -apple-system, "PingFang SC", sans-serif;
    opacity: .65; transition: opacity .15s, background .15s;
  }
  .back:hover { opacity: 1; background: rgba(0,0,0,.7); }
  .loader {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, #1a2420, #0b0e11 65%);
    color: #eaecef; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    transition: opacity .4s ease;
  }
  .loader.hide { opacity: 0; pointer-events: none; }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(127,209,176,.22); border-top-color: #7fd1b0;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { margin: 2px 0 0; font-weight: 700; }
  .loader small { color: #8b939c; }
  .loader .alt {
    margin-top: 6px; color: #9fe8c8; text-decoration: none; font-size: 12px;
    border-bottom: 1px solid rgba(127,209,176,.4); padding-bottom: 2px;
  }
  .loader .alt:hover { color: #d8fff0; }
  .fallback {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    font: 12px/1.6 -apple-system, "PingFang SC", sans-serif; color: #bbb;
  }
  .fallback a { color: #9fd8c2; }
</style>
</head>
<body>
  <iframe
    id="frame"
    src="https://4m9yrexxycww0.doubao.link/app/app_17g878sy5yx"
    allow="fullscreen; autoplay; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
    loading="eager"
    title="合成 IS-7">
  </iframe>

  <a class="back" href="/games/" title="返回小游戏列表">←</a>

  <div class="loader" id="loader">
    <div class="spin"></div>
    <p>正在加载合成 IS-7…</p>
    <small id="slow">首次打开可能需要几秒</small>
    <a class="alt" id="alt" href="https://4m9yrexxycww0.doubao.link/app/app_17g878sy5yx" target="_blank" rel="noreferrer">在新窗口打开 ↗</a>
  </div>

  <noscript>
    <div class="fallback">这个游戏需要联网加载。<a href="https://4m9yrexxycww0.doubao.link/app/app_17g878sy5yx" target="_blank" rel="noreferrer">在新窗口打开</a></div>
  </noscript>

  <script>
    (function () {
      var frame = document.getElementById('frame');
      var loader = document.getElementById('loader');
      var slow = document.getElementById('slow');
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        loader.classList.add('hide');
        setTimeout(function () { loader.remove(); }, 450);
      }
      frame.addEventListener('load', hide);
      setTimeout(function () {
        if (done) return;
        slow.textContent = '加载有点慢，可点下面在新窗口打开';
        loader.style.cursor = 'pointer';
      }, 10000);
      // 外站偶发拦截时，至少让用户能一键离开加载层
      loader.addEventListener('dblclick', hide);
    })();
  </script>
  <script src="/errlog.js"></script>
</body>
</html>
