<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
  :root{
    --bg:#0b0e11; --accent:#ffb454; --panel:#14181d; --text:#e8f0ec;
    --muted:#8a9a92; --cellEmpty:#1a2129; --boardBg:#10141a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:14px 12px 12px; overflow:hidden; user-select:none;
  }
  h1{color:var(--accent); font-size:22px; letter-spacing:6px; text-indent:6px; margin:2px 0 6px; font-weight:700;}
  .hint{font-size:12px; color:var(--muted); margin-bottom:12px; text-align:center; line-height:1.5;}
  .status{display:flex; align-items:center; gap:8px; font-size:13px; color:#cfe0d8; margin-bottom:12px; flex-wrap:wrap; justify-content:center;}
  .status .pill{background:var(--panel); padding:5px 12px; border-radius:8px; white-space:nowrap;}
  .status .pill b{color:var(--accent); font-variant-numeric:tabular-nums; font-weight:700;}
  #boardWrap{flex:1; width:100%; display:flex; justify-content:center; align-items:center;}
  #board{
    display:grid; grid-template-columns:repeat(4,var(--cell));
    grid-auto-rows:var(--cell); gap:8px; padding:8px; border-radius:12px;
    background:var(--boardBg); border:1px solid #1d242c; touch-action:none;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .cell{
    display:flex; align-items:center; justify-content:center; border-radius:8px;
    background:var(--cellEmpty); font-weight:800; color:var(--text);
  }
  .cell.t2{background:#2b333d; color:#cfd8dd; font-size:calc(var(--cell)*.42);}
  .cell.t4{background:#37424d; color:#dde5ea; font-size:calc(var(--cell)*.42);}
  .cell.t8{background:#b06a34; color:#fff; font-size:calc(var(--cell)*.38);}
  .cell.t16{background:#c97936; color:#fff; font-size:calc(var(--cell)*.34);}
  .cell.t32{background:#d9873c; color:#fff; font-size:calc(var(--cell)*.34);}
  .cell.t64{background:#e69a42; color:#fff; font-size:calc(var(--cell)*.30);}
  .cell.t128{background:#f0ae4e; color:#241a0a; font-size:calc(var(--cell)*.28);}
  .cell.t256{background:#f6bd5e; color:#241a0a; font-size:calc(var(--cell)*.26);}
  .cell.t512{background:#f8c86e; color:#241a0a; font-size:calc(var(--cell)*.26);}
  .cell.t1024{background:#fbd47e; color:#241a0a; font-size:calc(var(--cell)*.24);}
  .cell.t2048{
    background:var(--accent); color:#241a0a; font-size:calc(var(--cell)*.22);
    box-shadow:0 0 14px rgba(255,180,84,.55);
  }
  @keyframes pop{0%{transform:scale(0);}60%{transform:scale(1.14);}100%{transform:scale(1);}}
  .cell.pop{animation:pop .18s ease-out;}
  @keyframes bump{0%{transform:scale(1);}50%{transform:scale(1.18);}100%{transform:scale(1);}}
  .cell.bump{animation:bump .16s ease-out;}
  .overlay{position:fixed; inset:0; background:rgba(5,8,10,.72); display:flex; align-items:center; justify-content:center; z-index:10; backdrop-filter:blur(3px);}
  .overlay.hidden{display:none;}
  .overlay-box{background:#12171c; border:1px solid #26303a; border-radius:16px; padding:26px 30px; text-align:center; max-width:86%;}
  .overlay-box h2{color:var(--accent); font-size:20px; margin-bottom:10px;}
  .overlay-box p{color:var(--muted); font-size:14px; margin-bottom:18px;}
  .overlay-box button{background:var(--accent); color:#241a0a; font-size:15px; font-weight:700; border:none; border-radius:10px; padding:10px 22px; cursor:pointer;}
  .overlay-box button:active{transform:scale(.96);}
  .overlay-box .cont{display:inline-block; margin-left:12px; background:var(--panel); color:var(--text); border:1px solid #26303a; font-size:14px; font-weight:600; border-radius:10px; padding:10px 16px; cursor:pointer;}
  .overlay-box .cont.hidden{display:none;}
</style>
</head>
<body>
<h1>2048</h1>
<p class="hint">方向键 / WASD / 触屏滑动合并相同数字 · 凑到 2048 获胜 · R 键重开</p>
<div class="status">
  <span class="pill">得分 <b id="scoreLabel">0</b></span>
  <span class="pill">最佳 <b id="bestLabel">0</b></span>
</div>
<div id="boardWrap">
  <div id="board"></div>
</div>
<div id="overlay" class="overlay hidden">
  <div class="overlay-box">
    <h2 id="overlayTitle"></h2>
    <p id="overlayText"></p>
    <button id="overlayBtn"></button>
    <button class="cont hidden" id="overlayContinue">继续挑战</button>
  </div>
</div>
<script src="/games/kit.js"></script>
<script>
(function () {
  'use strict';

  // ---- DOM ----
  const boardEl = document.getElementById('board');
  const wrapEl = document.getElementById('boardWrap');
  const scoreLabel = document.getElementById('scoreLabel');
  const bestLabel = document.getElementById('bestLabel');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const overlayContinue = document.getElementById('overlayContinue');

  // ---- kit 音效 / 成绩 ----
  const kit = window.mfKit || null;
  function sfx(n) {
    if (kit && typeof kit.sfx === 'function') { try { kit.sfx(n); } catch (e) {} }
  }
  function refreshBest() {
    let b = 0;
    if (kit && typeof kit.getBest === 'function') { try { b = kit.getBest('g2048') || 0; } catch (e) {} }
    bestLabel.textContent = b;
  }
  function reportScore() {
    if (typeof window.mfhryScore === 'function') { try { window.mfhryScore('g2048', score); } catch (e) {} }
    refreshBest();
  }

  // ---- 状态 ----
  let grid = new Array(16).fill(0);
  let score = 0;
  let won = false;        // 已达成 2048（且未重开）
  let over = false;       // 无路可走
  let newIdx = -1;        // 新生成格子（弹入动画）
  let mergedIndices = new Set(); // 本次合并的格子（放大动画）

  // ---- 合并一行（line 按移动方向从边缘到远端排列）----
  function mergeLine(line) {
    const nums = line.filter(function (v) { return v !== 0; });
    const out = [];
    const merged = [false, false, false, false];
    let gained = 0;
    for (let i = 0; i < nums.length; i++) {
      if (i + 1 < nums.length && nums[i] === nums[i + 1]) {
        const v = nums[i] * 2;
        out.push(v);
        gained += v;
        merged[out.length - 1] = true;
        i++;
      } else {
        out.push(nums[i]);
      }
    }
    while (out.length < 4) out.push(0);
    const moved = out.some(function (v, i) { return v !== line[i]; });
    return { line: out, gained: gained, moved: moved, merged: merged };
  }

  // 每个方向的 4 条线，每条线是 4 个格子下标（从移动边缘向外）
  function linesFor(dir) {
    const lines = [];
    for (let i = 0; i < 4; i++) {
      const line = [];
      for (let j = 0; j < 4; j++) {
        let idx;
        if (dir === 'left') idx = i * 4 + j;
        else if (dir === 'right') idx = i * 4 + (3 - j);
        else if (dir === 'up') idx = j * 4 + i;
        else idx = (3 - j) * 4 + i;
        line.push(idx);
      }
      lines.push(line);
    }
    return lines;
  }

  function spawnTile() {
    const empty = [];
    for (let i = 0; i < 16; i++) { if (grid[i] === 0) empty.push(i); }
    if (!empty.length) return;
    const idx = empty[Math.floor(Math.random() * empty.length)];
    grid[idx] = Math.random() < 0.9 ? 2 : 4;
    newIdx = idx;
  }

  function canMove() {
    if (grid.some(function (v) { return v === 0; })) return true;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const v = grid[r * 4 + c];
        if (c < 3 && grid[r * 4 + c + 1] === v) return true;
        if (r < 3 && grid[(r + 1) * 4 + c] === v) return true;
      }
    }
    return false;
  }

  // ---- 渲染 ----
  function cellSize() {
    const availW = Math.max(160, wrapEl.clientWidth - 12);
    const availH = Math.max(200, window.innerHeight - 210);
    let s = Math.floor(Math.min(availW / 4, availH / 4, 92));
    s = Math.max(48, Math.min(s, 92));
    return s;
  }
  function render() {
    const cell = cellSize();
    boardEl.style.setProperty('--cell', cell + 'px');
    for (let i = 0; i < 16; i++) {
      const el = cells[i];
      const v = grid[i];
      let cls = v === 0 ? 'cell' : 'cell t' + v;
      if (v > 0 && i === newIdx) cls += ' pop';
      if (mergedIndices.has(i)) cls += ' bump';
      el.className = cls;
      el.textContent = v === 0 ? '' : v;
    }
    newIdx = -1;
    mergedIndices = new Set();
  }

  // ---- 覆盖层 ----
  function hideOverlay() { overlay.classList.add('hidden'); }
  function showOverlay(title, text, btnText, canContinue) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlayBtn.textContent = btnText;
    overlayBtn.onclick = restartGame;
    overlayContinue.classList.toggle('hidden', !canContinue);
    overlayContinue.onclick = hideOverlay;
    overlay.classList.remove('hidden');
  }

  // ---- 胜负判定 ----
  function checkWin() {
    if (won) return;
    if (grid.indexOf(2048) !== -1) {
      won = true;
      sfx('win');
      showOverlay('🎉 达成 2048！', '得分 ' + score, '再玩一次', true);
    }
  }
  function checkLose() {
    if (over || won) return;
    if (!canMove()) {
      over = true;
      showOverlay('游戏结束', '得分 ' + score, '再玩一次', false);
    }
  }

  // ---- 移动 ----
  function move(dir) {
    if (over) return;
    const lines = linesFor(dir);
    let changed = false;
    let gained = 0;
    const next = grid.slice();
    const mergeSet = new Set();
    for (let li = 0; li < 4; li++) {
      const line = lines[li];
      const vals = line.map(function (i) { return next[i]; });
      const r = mergeLine(vals);
      if (r.gained) gained += r.gained;
      if (r.moved) changed = true;
      line.forEach(function (idx, k) {
        next[idx] = r.line[k];
        if (r.merged[k]) mergeSet.add(idx);
      });
    }
    if (!changed) { sfx('hit'); return; }
    grid = next;
    mergedIndices = mergeSet;
    if (gained > 0) {
      score += gained;
      sfx('pop');
    }
    spawnTile();
    updateStatus();
    reportScore();
    render();
    checkWin();
    checkLose();
  }

  // ---- 重开（HUD / R 键 / 覆盖层按钮调用）----
  function restartGame() {
    grid = new Array(16).fill(0);
    score = 0;
    won = false;
    over = false;
    newIdx = -1;
    mergedIndices = new Set();
    spawnTile();
    spawnTile();
    hideOverlay();
    updateStatus();
    reportScore();
    render();
  }

  function updateStatus() { scoreLabel.textContent = score; }

  // ---- 键盘（方向键 / WASD；R 键由 kit.js 接管）----
  const keyMap = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right'
  };
  document.addEventListener('keydown', function (e) {
    const dir = keyMap[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  });

  // ---- 触屏滑动 ----
  let tStart = null;
  boardEl.addEventListener('touchstart', function (e) {
    tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  boardEl.addEventListener('touchend', function (e) {
    if (!tStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - tStart.x, dy = t.clientY - tStart.y;
    tStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });
  boardEl.addEventListener('touchcancel', function () { tStart = null; }, { passive: true });

  // ---- 构建 4×4 格子 ----
  const cells = [];
  (function buildCells() {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 16; i++) {
      const d = document.createElement('div');
      d.className = 'cell';
      cells.push(d);
      frag.appendChild(d);
    }
    boardEl.appendChild(frag);
  })();

  // ---- 窗口变化重排 ----
  window.addEventListener('resize', render);
  window.addEventListener('orientationchange', function () { setTimeout(render, 200); });

  // ---- 暴露给 kit.js（HUD ⟲ 与 R 键调用）----
  window.mfRestart = restartGame;

  // ---- 启动 ----
  restartGame();
})();
</script>
</body>
</html>
