<!DOCTYPE html>
<html lang="zh-CN" data-theme="day"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f4e9">
  <meta name="author" content="Frank">
  <title>鹈鹕的休息日 ·制作人：mfhry</title>
  <style>
    :root {
      color-scheme: light;
      --paper:#f8f4e9; --ink:#263e3c; --muted:#7a8579; --line:#dcded0;
      --sky:#f8f4e9; --sun:#f2c76b; --sun-halo:#f4e6b9; --cloud:#fffdf6;
      --hill:#b9cbbb; --hill-back:#d9dfcb; --sea:#a6c9c0; --sea-deep:#8bb6ad;
      --foam:#dce8d7; --sand:#ebdfbc; --road:#dfd3b4; --road-line:#f8f0d9;
      --grass:#8caa87; --grass-light:#b4bd88; --bird:#fffdf3; --bird-shade:#e1e8d9;
      --bird-line:#c5d4c7; --beak:#eeb364; --pouch:#efc789; --beak-edge:#b77b42;
      --leg:#dc9954; --leg-far:#b98048; --bike:#da7756; --bike-light:#efad7b;
      --teal:#427e76; --teal-dark:#2d655e; --metal:#9baaa0; --basket:#d4af76;
      --shadow:#66775e; --panel:rgba(248,244,233,.88);
    }
    [data-theme="sunset"] {
      --paper:#f6e6d9; --ink:#4e454c; --muted:#977d7a; --line:#dfc8ba;
      --sky:#f6e6d9; --sun:#e69164; --sun-halo:#f0c7a5; --cloud:#f9eee2;
      --hill:#aea9aa; --hill-back:#d5bdb6; --sea:#a8b9b5; --sea-deep:#8ea6a3;
      --foam:#e5dcd0; --sand:#e5c7a5; --road:#d8b798; --road-line:#f4dbc2;
      --grass:#9b9f80; --grass-light:#c5b68a; --bird:#fff5e8; --bird-shade:#e4d8cf;
      --bird-line:#d0c7bf; --beak:#e8a25e; --pouch:#ecc190;
      --teal:#638783; --teal-dark:#436b69; --panel:rgba(246,230,217,.9);
    }
    [data-theme="night"] {
      color-scheme:dark;
      --paper:#162932; --text:#e0e8dd; --ink:#263f47; --muted:#91aaa9; --line:#38535d;
      --sky:#162932; --sun:#e8dcaf; --sun-halo:#6c8a8a; --cloud:#39535e;
      --hill:#3d6269; --hill-back:#2a4956; --sea:#2b505e; --sea-deep:#244653;
      --foam:#698b8c; --sand:#81958b; --road:#607e7d; --road-line:#a0b6a6;
      --grass:#486d70; --grass-light:#829982; --bird:#e9eddf; --bird-shade:#c1d2ca;
      --bird-line:#9ab8b0; --beak:#d9aa72; --pouch:#dfc38f;
      --leg:#c99a64; --leg-far:#a47f53; --bike:#cf8969; --bike-light:#e3b783;
      --teal:#a0c0b5; --teal-dark:#386f74; --metal:#94adab; --shadow:#10252c;
      --panel:#1c333d; --control-bg:#e2d1b1; --control-fg:#213943;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--text,var(--ink)); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; transition:background .9s,color .9s; }
    button,input { font:inherit; }
    button { color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:3px solid var(--teal); outline-offset:5px; }
    .page { max-width:1800px; margin:auto; min-height:100svh; display:flex; flex-direction:column; overflow:hidden; }
    .topbar { padding:28px 5.6% 18px; display:flex; align-items:center; justify-content:space-between; gap:20px; position:relative; z-index:2; }
    .brand { display:flex; gap:12px; align-items:center; }
    .brand-emblem { width:43px; height:43px; }
    .brand-name { font-size:13px; font-weight:750; letter-spacing:2.4px; line-height:1.5; }
    .brand-sub { display:block; font-size:9px; font-weight:500; letter-spacing:2.5px; opacity:.6; }
    .top-right { display:flex; align-items:center; gap:25px; }
    .weather { font-size:11px; letter-spacing:1.7px; display:flex; align-items:center; gap:9px; }
    .weather-dot { width:6px; height:6px; background:var(--teal); border-radius:50%; }
    .time-switch { display:flex; gap:3px; padding:4px; border:1px solid var(--line); border-radius:30px; background:var(--panel); transition:border-color .9s,background .9s; }
    .theme-button { border:0; border-radius:24px; min-height:34px; padding:8px 11px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:10px; letter-spacing:.35px; background:transparent; transition:background .35s,color .35s,transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .35s; }
    .theme-button svg { width:16px; height:16px; flex-shrink:0; transition:transform .4s cubic-bezier(.2,.8,.2,1); }
    .theme-button[aria-pressed="true"] { background:var(--control-bg,var(--ink)); color:var(--control-fg,var(--paper)); }
    .stage { position:relative; flex:1; height:calc(100svh - 190px); min-height:575px; max-height:940px; overflow:hidden; }
    .scene { position:absolute; inset:0; width:100%; height:100%; display:block; contain:layout paint; }
    .stage::after { content:""; position:absolute; inset:0; pointer-events:none; background-image:var(--grain-texture); background-repeat:repeat; opacity:.065; mix-blend-mode:multiply; }
    .scene [fill],.scene [stroke] { transition:fill .7s,stroke .7s; }
    #moon,#stars,.lighthouse-beam { opacity:0; transition:opacity 1.1s; }
    #sun { opacity:1; transition:opacity 1.1s; }
    [data-theme="night"] #sun { opacity:0; }
    [data-theme="night"] #moon,[data-theme="night"] #stars { opacity:1; }
    [data-theme="night"] .lighthouse-beam { opacity:.15; }
    .intro { position:absolute; z-index:1; top:7%; left:7.1%; pointer-events:none; }
    .eyebrow { font-size:10px; letter-spacing:3px; font-weight:650; margin:0 0 22px; color:var(--teal); }
    h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(43px,4.8vw,76px); line-height:1.08; letter-spacing:-2.6px; font-weight:400; margin:0; }
    .intro p:last-child { font-size:12px; letter-spacing:1.5px; margin-top:23px; color:var(--muted); line-height:1.9; }
    .bottom { position:relative; z-index:3; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:23px 5.6% 27px; gap:24px; background:var(--paper); }
    .caption { font-size:10px; color:var(--muted); letter-spacing:1.2px; line-height:1.8; }
    .caption strong { font-size:11px; color:var(--text,var(--ink)); font-weight:600; letter-spacing:1.8px; }
    .controls { display:flex; align-items:center; gap:24px; }
    .play-button { display:flex; align-items:center; justify-content:center; gap:8px; background:var(--control-bg,var(--ink)); color:var(--control-fg,var(--paper)); border:0; border-radius:30px; min-width:145px; padding:12px 19px; font-size:12px; letter-spacing:.5px; transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,background .4s; }
    .play-button svg { width:14px; height:14px; flex-shrink:0; transition:transform .4s cubic-bezier(.2,.8,.2,1); }
    .speed-control { display:grid; grid-template-columns:auto minmax(210px,300px) 43px; align-items:center; gap:5px 13px; font-size:11px; }
    .drive-status { grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:5px 12px; color:var(--muted); font-size:9px; letter-spacing:.65px; font-variant-numeric:tabular-nums; }
    .drive-status .gear { color:var(--teal); }
    .speed-control label { color:var(--muted); letter-spacing:1px; cursor:pointer; transition:color .3s; }
    .speed-control output { font-variant-numeric:tabular-nums; font-size:11px; }
    input[type="range"] { appearance:none; -webkit-appearance:none; height:24px; width:100%; min-width:0; cursor:pointer; background:transparent; margin:0; accent-color:var(--teal); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
    input[type="range"]::-webkit-slider-runnable-track { background:var(--line); height:3px; border-radius:3px; }
    input[type="range"]::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; margin-top:-4px; width:11px; height:11px; background:var(--teal); border:2px solid var(--paper); border-radius:50%; box-shadow:0 0 0 1px var(--teal); transition:transform .3s,box-shadow .3s; }
    input[type="range"]::-moz-range-track { background:var(--line); height:3px; border-radius:3px; }
    input[type="range"]::-moz-range-thumb { width:9px; height:9px; background:var(--teal); border:2px solid var(--paper); border-radius:50%; transition:transform .3s,box-shadow .3s; }
    .credit { display:flex; justify-self:end; align-items:center; gap:10px; font-size:10px; letter-spacing:1.2px; white-space:nowrap; color:var(--muted); }
    .signature { display:block; width:96px; height:38px; overflow:visible; color:var(--text,var(--ink)); transform:rotate(-5deg); }
    button:active { transform:scale(.97); }
    @media(hover:hover) {
      .theme-button:hover { background:var(--sun-halo); transform:translateY(-1px) scale(1.06); box-shadow:0 4px 16px #263e3c09; }
      .theme-button:hover svg { transform:rotate(15deg) scale(1.12); }
      .theme-button[aria-pressed="true"]:hover { background:var(--control-bg,var(--ink)); }
      .play-button:hover { transform:translateY(-2px) scale(1.025); box-shadow:0 6px 18px #263e3c15; }
      .play-button:hover svg { transform:scale(1.14); }
      .speed-control:hover label { color:var(--teal); }
      input[type="range"]:hover { transform:scaleX(1.035); }
      input[type="range"]:hover::-webkit-slider-thumb { transform:scale(1.22); box-shadow:0 0 0 1px var(--teal),0 0 0 5px #427e7610; }
      input[type="range"]:hover::-moz-range-thumb { transform:scale(1.22); box-shadow:0 0 0 5px #427e7610; }
    }
    input[type="range"]:active::-webkit-slider-thumb { transform:scale(1.3); }
    input[type="range"]:active::-moz-range-thumb { transform:scale(1.3); }
    .theme-button:active,.play-button:active { transform:scale(.97); }
    @media(prefers-reduced-motion:reduce) { button,.theme-button svg,.play-button svg,input[type="range"] { transition:none; } }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
    @media(min-width:1600px) { .intro { top:10%; } }
    @media(max-width:1180px) { .bottom { grid-template-columns:1fr 1fr; gap:16px; } .controls { grid-column:1/-1; grid-row:1; justify-self:center; } .caption { grid-column:1; grid-row:2; } .credit { grid-column:2; grid-row:2; } .speed-control { grid-template-columns:auto minmax(240px,340px) 43px; } }
    @media(max-width:1000px) { .weather { display:none; } .intro { top:3%; } h1 { font-size:51px; } .stage { min-height:570px; } .caption strong { font-size:10px; letter-spacing:1px; } .controls { gap:18px; } .signature { width:81px; } }
    @media(max-width:680px) {
      .topbar { padding:23px 7% 10px; } .brand-name { font-size:11px; letter-spacing:1.8px; } .brand-sub { font-size:8px; } .brand-emblem { width:36px; height:36px; }
      .topbar { gap:12px; flex-wrap:wrap; } .top-right { margin-left:auto; } .theme-button { padding:7px 9px; font-size:9px; } .theme-button svg { width:14px; height:14px; }
      .stage { height:calc(100svh - 220px); min-height:580px; max-height:740px; flex:none; }
      .intro { top:32px; left:8%; } .eyebrow { font-size:9px; letter-spacing:2.2px; margin-bottom:15px; }
      h1 { font-size:50px; line-height:1.05; letter-spacing:-1.8px; }
      .intro p:last-child { font-size:11px; letter-spacing:.7px; margin-top:14px; }
      .bottom { padding:21px 7% 26px; gap:21px 12px; }
      .controls { width:100%; display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; } .speed-control { grid-template-columns:auto minmax(75px,1fr) 36px; gap:5px 8px; }
      .drive-status { justify-content:flex-start; gap:4px 8px; font-size:8px; letter-spacing:.15px; } .caption { font-size:8px; letter-spacing:.6px; } .caption strong { font-size:8px; letter-spacing:.6px; } .credit { font-size:8px; letter-spacing:.6px; gap:7px; } .signature { width:77px; height:31px; }
      .page { min-height:100svh; } .play-button { min-width:132px; padding:12px 15px; font-size:11px; }
    }
    @media(max-width:370px) { h1 { font-size:43px; } .speed-control label { display:none; } .speed-control { grid-template-columns:minmax(70px,1fr) 35px; } .controls { gap:10px; } .play-button { min-width:114px; } }

    /* The VPN destination is an alternate view inside this same document. */
    .page[hidden],.vpn-view[hidden] { display:none !important; }
    .controls { flex-wrap:wrap; justify-content:center; }
    .vpn-button { display:flex; align-items:center; justify-content:center; gap:9px; min-height:43px; padding:9px 17px; border:1px solid #263e3c18; border-radius:28px; background:var(--bike); color:#263e3c; box-shadow:0 3px 12px #263e3c09; transition:transform .35s,box-shadow .35s,background .35s; }
    .vpn-button svg { width:19px; height:19px; flex-shrink:0; transition:transform .35s; }
    .vpn-button-copy { display:grid; gap:3px; text-align:left; }
    .vpn-button-copy strong { font-size:12px; font-weight:650; letter-spacing:.3px; line-height:1; }
    .vpn-button-copy small { font-size:8px; letter-spacing:1.5px; line-height:1; }
    body.vpn-open { background:#fff; color:#263e3c; color-scheme:light; transition:none; }
    .vpn-view { position:relative; display:grid; place-items:center; min-height:100vh; min-height:100svh; padding:90px 24px; background:#fff; color:#263e3c; }
    .vpn-back { position:absolute; top:28px; left:5.6%; display:flex; align-items:center; gap:8px; padding:11px 18px; border:1px solid #dcded0; border-radius:28px; background:#fff; color:#263e3c; font-size:12px; letter-spacing:.5px; transition:transform .35s,background .35s,box-shadow .35s; }
    .vpn-back svg { width:16px; height:16px; transition:transform .35s; }
    .vpn-address-wrap { min-width:0; width:max-content; max-width:100%; overflow-x:auto; padding:16px 4px; }
    .vpn-address { display:block; width:max-content; white-space:nowrap; color:#427e76; font-size:clamp(12px,1.05vw,17px); line-height:1.8; text-decoration-thickness:1px; text-underline-offset:5px; transition:color .3s; }
    .vpn-address:focus-visible,.vpn-back:focus-visible { outline:3px solid #427e76; outline-offset:5px; }
    @media(hover:hover) {
      .vpn-button:hover { transform:translateY(-2px) scale(1.025); background:var(--bike-light); box-shadow:0 6px 18px #263e3c15; }
      .vpn-button:hover svg { transform:scale(1.12) rotate(-5deg); }
      .vpn-back:hover { transform:translateY(-1px) scale(1.025); background:#f8f4e9; box-shadow:0 5px 16px #263e3c0b; }
      .vpn-back:hover svg { transform:translateX(-2px); }
      .vpn-address:hover { color:#263e3c; }
    }
    .vpn-button:active,.vpn-back:active { transform:scale(.97); }
    @media(max-width:680px) {
      .controls { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
      .vpn-button,.controls .play-button { min-width:0; width:100%; }
      .speed-control { grid-column:1/-1; grid-template-columns:auto minmax(0,1fr) 43px; }
      .vpn-back { top:23px; left:7%; }
    }
    @media(prefers-reduced-motion:reduce) { .vpn-button,.vpn-button svg,.vpn-back,.vpn-back svg,.vpn-address { transition:none; } }
  </style>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    /* 原页面自带的 VPN 推广按钮 / 购买区，本站不展示（节点保留，脚本依赖） */
    .vpn-button, #vpnView { display: none !important; }
    .signature-text {
      display: block;
      font: 700 21px/1 "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: 1.5px;
      color: var(--ink);
      transform: rotate(-4deg);
      text-transform: lowercase;
    }
    @media (max-width: 1000px) { .signature-text { font-size: 18px; } }
    @media (max-width: 620px) { .signature-text { font-size: 15px; letter-spacing: 1px; } }
  </style>
</head>
<body>
<div class="page" id="rideView">
  <header class="topbar">
    <div class="brand" aria-label="鹈鹕自行车俱乐部">
      <svg class="brand-emblem" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.2"></circle>
        <path d="M10 29c6-1 8-5 10-12 1-5 6-6 9-3l8 3-10 2c-1 5 2 10-3 13-5 3-10 1-14-3Z" fill="currentColor"></path>
        <path d="m25 15 12 2-10 3" fill="var(--paper)"></path><circle cx="25.7" cy="14.8" r=".9" fill="var(--paper)"></circle>
        <path d="m20 33-1 5m6-6 2 6m-12 0h7m2 0h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
      </svg>
      <div class="brand-name">鹈鹕<span class="brand-sub">自行车俱乐部——至今成立</span></div>
    </div>
    <div class="top-right">
      <span class="weather"><span class="weather-dot"></span><span id="weatherText">今天是骑行的好日子</span></span>
      <div class="time-switch" role="group" aria-label="一天中的时间">
        <button class="theme-button" type="button" data-time="day" aria-label="白昼" title="Daylight" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" stroke-linecap="round"></path></svg><span>一天</span>
        </button>
        <button class="theme-button" type="button" data-time="sunset" aria-label="日落" title="Sunset" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 16h18M6 16a6 6 0 0 1 12 0M12 4v3M4 9l2 2m12 0 2-2M5 20h14"></path></svg><span>日落</span>
        </button>
        <button class="theme-button" type="button" data-time="night" aria-label="晚安" title="Night" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.3 14.2A8.5 8.5 0 0 1 9.8 3.7a8.5 8.5 0 1 0 10.5 10.5Z"></path><path d="M18 3v4m-2-2h4"></path></svg><span>晚安</span>
        </button>
      </div>

      <p class="eyebrow">鹈鹕休息日</p>
      <h1>好日子。<br _istranslated="1">轻松的骑行。</h1>
      <p>无处可去。只有大海和微风。</p>

    <svg id="landscape" class="scene" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMax meet" role="img" aria-labelledby="sceneTitle sceneDescription">
      <title id="sceneTitle">The Pelican's Day Off</title>
      <desc id="sceneDescription">A white pelican rides a four-bar full-suspension mountain bike along the coast. Three front chainrings and a twelve-speed cassette shift smoothly with cadence and riding speed. The sailboat cruises left at a constant world speed, plus the same camera parallax as the distant coast. Clouds and birds have their own motion and depth; the sun stays fixed. The rider stops pedaling, shifts its weight, then lowers one foot to the ground. To start again, it positions the other pedal for a push, lifts its supporting foot and settles into the saddle. The scarf follows the airflow and gravity. The pelican watches your pointer. Made by Frank.</desc>

        const x = m.a*gaze.clientX+m.c*gaze.clientY+m.e;
        const y = m.b*gaze.clientX+m.d*gaze.clientY+m.f;
        const dx = x-758-riderPose.bodyX, dy = y-275-sceneBob-riderPose.bodyY, distance = Math.hypot(dx,dy);
        const strength = 1-Math.exp(-distance/145);
        targetX = dx/(distance || 1)*3.8*strength;
        targetY = dy/(distance || 1)*4.4*strength;
      }
    }
    const blend = 1-Math.exp(-elapsed*40);
    gaze.x += (targetX-gaze.x)*blend;
    gaze.y += (targetY-gaze.y)*blend;
    gaze.moving = Math.abs(targetX-gaze.x)+Math.abs(targetY-gaze.y)>.008;
    if (!gaze.moving) { gaze.x = targetX; gaze.y = targetY; }
    pupilTransform.setTranslate(gaze.x,gaze.y);
  }
  document.addEventListener('pointermove',event => {
    gaze.clientX = event.clientX;
    gaze.clientY = event.clientY;
    gaze.tracked = true;
    gaze.moving = true;
    schedule();
  },{passive:true});
  function restGaze() { gaze.tracked = false; gaze.moving = true; schedule(); }
  document.addEventListener('pointerout',event => { if (!event.relatedTarget) restGaze(); },{passive:true});
  window.addEventListener('blur',restGaze);
  window.addEventListener('scroll',invalidateCoordinateSpace,{passive:true,capture:true});
  window.addEventListener('resize',invalidateCoordinateSpace,{passive:true});

  // One uncapped, display-synchronized loop; no 60 Hz interval or fixed step.
  function tick(stamp) {
    frameId = null;
    if (document.hidden || vpnViewOpen) { lastFrame = null; return; }
    const ambientElapsed = lastFrame===null ? 0 : Math.max(0,(stamp-lastFrame)/1000);
    const elapsed = Math.min(ambientElapsed,.1);
    lastFrame = stamp;
    ambientTime += ambientElapsed;
    const previousTime = time;
    const sample = sampleClock(stamp);
    const commandRate = sample.rate;
    if (sample.finished) {
      clockStart = stamp;
      clockRate = commandRate;
      ramp = null;
      updatePlayback();
    }
    updateDrivetrain(elapsed,stamp,commandRate);
    const poseChanged = updateRiderPose(elapsed);
    if (time!==previousTime || sceneDirty || poseChanged || riderPose.scarfLift>.0001) {
      renderScene(time);
      sceneDirty = false;
    }
    renderAmbient(ambientTime);
    updateBlur(currentRate);
    updateGaze(elapsed);
    // Natural background motion continues even when the bicycle is parked.
    schedule();
  }
  function schedule() {
    if (!document.hidden && !vpnViewOpen && frameId===null) frameId = requestAnimationFrame(tick);
  }

  const rideView=byId('rideView'), vpnView=byId('vpnView'), vpnButton=byId('vpnButton');
  let vpnOpenedAt=null, rideScroll={x:0,y:0};
  function showVpnView() {
    if (vpnViewOpen) return;
    vpnViewOpen=true;
    vpnOpenedAt=performance.now();
    rideScroll={x:window.scrollX,y:window.scrollY};
    if (frameId!==null) cancelAnimationFrame(frameId);
    frameId=null; lastFrame=null;
    rideView.hidden=true; vpnView.hidden=false;
    document.body.classList.add('vpn-open');
    vpnButton.setAttribute('aria-expanded','true');
    window.scrollTo(0,0);
    byId('vpnBack').focus({preventScroll:true});
  }
  function restoreRideView() {
    if (!vpnViewOpen) return;
    const suspendedFor=performance.now()-vpnOpenedAt;
    clockStart+=suspendedFor;
    drive.lastShiftAt+=suspendedFor/1000;
    if (drive.shift) drive.shift.start+=suspendedFor/1000;
    vpnViewOpen=false; vpnOpenedAt=null; lastFrame=null;
    vpnView.hidden=true; rideView.hidden=false;
    document.body.classList.remove('vpn-open');
    vpnButton.setAttribute('aria-expanded','false');
    sceneDirty=true;
    invalidateCoordinateSpace();
    window.scrollTo(rideScroll.x,rideScroll.y);
    vpnButton.focus({preventScroll:true});
  }
  vpnButton.addEventListener('click',showVpnView);
  byId('vpnBack').addEventListener('click',restoreRideView);
  document.addEventListener('keydown',event=>{ if (vpnViewOpen && event.key==='Escape') restoreRideView(); });

  const themes = {
    day:{color:'#f8f4e9',message:'A GOOD DAY FOR A LITTLE RIDE'},
    sunset:{color:'#f6e6d9',message:'GOLDEN HOUR. ONE MORE MILE.'},
    night:{color:'#162932',message:'MOONLIGHT AND AN OPEN ROAD.'}
  };
  function setTheme(name) {
    if (!themes[name]) return;
    document.documentElement.dataset.theme = name;
    timeButtons.forEach(button => set(button,'aria-pressed',String(button.dataset.time===name)));
    byId('weatherText').textContent = themes[name].message;
    document.querySelector('meta[name="theme-color"]').content = themes[name].color;
    motion.sun.setTranslate(0,name==='sunset' ? 65 : 0);
  }
  timeButtons.forEach(button => button.addEventListener('click',() => setTheme(button.dataset.time)));
  playButton.addEventListener('click',togglePlayback);
  speedInput.addEventListener('input',() => {
    speed = Number(speedInput.value);
    byId('speedValue').textContent = speed.toFixed(2)+'×';
    speedInput.setAttribute('aria-valuetext',speed.toFixed(2)+' times normal riding speed, automatic front and rear gear selection');
    if (playing) {
      const delay=drive.indexing ? Math.max(0,drive.indexing.duration-drive.indexing.elapsed)+.1 : 0;
      changeRate(speed,1800,delay*1000);
    }
  });
  document.addEventListener('keydown',event => {
    if (vpnViewOpen) return;
    if (event.code==='Space' && !event.repeat && !['INPUT','BUTTON','TEXTAREA','SELECT','A'].includes(document.activeElement.tagName)) {
      event.preventDefault(); togglePlayback();
    }
  });
  document.addEventListener('visibilitychange',() => {
    if (vpnViewOpen) return;
    if (document.hidden) {
      hiddenAt = performance.now();
      if (frameId!==null) cancelAnimationFrame(frameId);
      frameId = null;
      lastFrame = null;
    } else {
      if (hiddenAt!==null) {
        const hiddenDuration = performance.now()-hiddenAt;
        clockStart += hiddenDuration;
        if (drive.shift) drive.shift.start += hiddenDuration/1000;
        drive.lastShiftAt += hiddenDuration/1000;
      }
      hiddenAt = null;
      invalidateCoordinateSpace();
    }
  });
  const smallScreen = window.matchMedia('(max-width:680px)');
  function fitScene() {
    set(landscape,'viewBox',smallScreen.matches ? '330 80 780 740' : '0 0 1440 820');
    invalidateCoordinateSpace();
  }
  smallScreen.addEventListener('change',fitScene);
  if ('ResizeObserver' in window) new ResizeObserver(invalidateCoordinateSpace).observe(stage);
  fitScene();
  setTheme('day');
  updateDrivetrain(0,performance.now(),currentRate);
  renderScene(0);
  renderAmbient(0);
  updateBlur(currentRate);
  updatePlayback();
  schedule();
})();

</script>
