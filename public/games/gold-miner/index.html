<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>黄金矿工</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(circle at 50% 35%,#2b2015,#0a0705 70%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  }
  canvas{
    width:min(100vw,133.333vh);
    height:auto;
    display:block;
    border-radius:12px;
    box-shadow:0 0 50px rgba(255,180,60,.2),0 24px 70px rgba(0,0,0,.85);
    touch-action:none;
    cursor:pointer;
  }
</style>
</head>
<body>
<a href="/games/" title="返回小游戏列表" style="position:fixed;left:10px;bottom:10px;z-index:99999;display:flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#ffe8b0;text-decoration:none;font:14px/1 -apple-system,PingFang SC,sans-serif;opacity:.75">← 返回</a>

<canvas id="game" width="800" height="600"></canvas>
<script src="/games/score.js"></script>
<script>
(function () {
  'use strict';

  /* ==================== 基础 ==================== */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  /* ==================== 常量 ==================== */
  const PIVOT       = { x: W / 2, y: 130 };
  const GROUND_Y    = 100;
  const MIN_LEN     = 40;
  const MAX_LEN     = 560;
  const MAX_ANGLE   = 74 * Math.PI / 180;
  const SWING_SPEED = 0.028;
  const SHOOT_SPEED = 11;
  const BASE_RETRACT = 11;

  /* ==================== 物品类型 ==================== */
  const TYPES = {
    goldS:   { value: 50,  r: 12, kind: 'gold',    retract: 8.5, spark: '#ffd24a' },
    goldM:   { value: 100, r: 18, kind: 'gold',    retract: 6.2, spark: '#ffd24a' },
    goldL:   { value: 250, r: 26, kind: 'gold',    retract: 4.2, spark: '#ffd24a' },
    rockS:   { value: 10,  r: 14, kind: 'rock',    retract: 4.8, spark: '#cfcfcf' },
    rockL:   { value: 20,  r: 24, kind: 'rock',    retract: 2.8, spark: '#cfcfcf' },
    diamond: { value: 600, r: 11, kind: 'diamond', retract: 7.5, spark: '#7ff0ff' },
    skull:   { value: 30,  r: 15, kind: 'skull',   retract: 6.0, spark: '#ffe9c9' }
  };

  /* ==================== 游戏状态 ==================== */
  let state      = 'swinging';
  let angle      = 0;
  let angleDir   = 1;
  let hookLen    = MIN_LEN;
  let grabbed    = null;
  let items      = [];
  let floaters   = [];
  let particles  = [];
  let shake      = 0;
  let scorePulse = 0;
  let shownProg  = 0;
  let displayScore = 0;
  let swingCooldown = 0;
  let tGlobal    = 0;

  let score      = 0;
  let target     = 500;
  let level      = 1;
  let timeLeft   = 60;

  let gamePhase  = 'playing';
  let phaseTimer = 0;
  let finishing  = false;
  let paused     = false;
  let muted      = false;

  let best = 0;
  try { best = +(localStorage.getItem('goldminer_best') || 0) || 0; } catch (e) { best = 0; }

  /* ==================== 音效 ==================== */
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (!audioCtx || muted) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.045, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  /* ==================== 工具 ==================== */
  function hookPos() {
    return {
      x: PIVOT.x + Math.sin(angle) * hookLen,
      y: PIVOT.y + Math.cos(angle) * hookLen
    };
  }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function makeShape(r, n) {
    if (!n) return null;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a  = (i / n) * Math.PI * 2;
      const rr = r * (0.80 + Math.random() * 0.32);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return pts;
  }

  /* ==================== 背景预渲染 ==================== */
  let bgCanvas = null;
  function buildBackground() {
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = W;
    bgCanvas.height = H;
    const g = bgCanvas.getContext('2d');

    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0,    '#3a2716');
    grad.addColorStop(0.28, '#5a3d22');
    grad.addColorStop(1,    '#7c5731');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    for (let i = 0; i < 1200; i++) {
      const x = Math.random() * W;
      const y = 130 + Math.random() * (H - 130);
      const r = Math.random() * 2.6 + 0.4;
      g.fillStyle = Math.random() > 0.45
        ? 'rgba(255,215,150,' + (Math.random() * 0.10 + 0.02) + ')'
        : 'rgba(25,15,5,'    + (Math.random() * 0.16 + 0.04) + ')';
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }

    g.strokeStyle = 'rgba(0,0,0,0.10)';
    g.lineWidth = 2;
    for (let i = 0; i < 26; i++) {
      const y = 150 + i * 18;
      g.beginPath();
      g.moveTo(0, y);
      g.bezierCurveTo(W * 0.3, y - 12, W * 0.7, y + 14, W, y - 4);
      g.stroke();
    }

    g.fillStyle = '#221810';
    g.fillRect(0, 0, W, 100);
    for (let i = 0; i < 60; i++) {
      g.fillStyle = 'rgba(255,255,255,' + Math.random() * 0.04 + ')';
      g.beginPath();
      g.arc(Math.random() * W, Math.random() * 100, Math.random() * 8 + 1, 0, Math.PI * 2);
      g.fill();
    }

    const pg = g.createLinearGradient(0, 100, 0, 130);
    pg.addColorStop(0,    '#6b4d2c');
    pg.addColorStop(0.25, '#4a3420');
    pg.addColorStop(1,    '#2e2013');
    g.fillStyle = pg;
    g.fillRect(0, 100, W, 30);
    g.fillStyle = 'rgba(255,220,160,0.18)';
    g.fillRect(0, 100, W, 3);

    for (let i = 0; i < 40; i++) {
      g.fillStyle = 'rgba(30,20,10,0.6)';
      g.beginPath();
      g.arc(Math.random() * W, 128 + Math.random() * 8, Math.random() * 4 + 1, 0, Math.PI * 2);
      g.fill();
    }
  }

  /* ==================== 物品精灵绘制 ==================== */
  function paintItem(g, type, r, shape) {
    const t = TYPES[type];

    if (t.kind === 'gold') {
      const grad = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.25);
      grad.addColorStop(0,    '#fff8bc');
      grad.addColorStop(0.45, '#f5c518');
      grad.addColorStop(1,    '#8a5e08');
      g.fillStyle = grad;
      g.beginPath();
      shape.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(90,60,10,0.85)';
      g.lineWidth = 1.6;
      g.stroke();

      g.fillStyle = 'rgba(255,255,255,0.55)';
      g.beginPath();
      g.ellipse(-r * 0.32, -r * 0.38, r * 0.26, r * 0.13, -0.7, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = 'rgba(120,70,0,0.30)';
      g.beginPath();
      g.ellipse(r * 0.3, r * 0.35, r * 0.28, r * 0.15, -0.5, 0, Math.PI * 2);
      g.fill();

    } else if (t.kind === 'rock') {
      const grad = g.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.2);
      grad.addColorStop(0,   '#a2a2a2');
      grad.addColorStop(0.6, '#6e6e6e');
      grad.addColorStop(1,   '#383838');
      g.fillStyle = grad;
      g.beginPath();
      shape.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(20,20,20,0.75)';
      g.lineWidth = 1.6;
      g.stroke();

      g.strokeStyle = 'rgba(30,30,30,0.55)';
      g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(-r * 0.4, -r * 0.2);
      g.lineTo(-r * 0.05, r * 0.1);
      g.lineTo(r * 0.25, -r * 0.05);
      g.stroke();

    } else if (t.kind === 'diamond') {
      g.shadowColor = '#5fe8ff';
      g.shadowBlur = 14;
      g.beginPath();
      g.moveTo(0, -r * 1.32);
      g.lineTo(r * 0.95, -r * 0.16);
      g.lineTo(0, r * 1.28);
      g.lineTo(-r * 0.95, -r * 0.16);
      g.closePath();
      const grad = g.createLinearGradient(-r, -r, r, r);
      grad.addColorStop(0,   '#e8ffff');
      grad.addColorStop(0.4, '#5fe8ff');
      grad.addColorStop(1,   '#0a7fa8');
      g.fillStyle = grad;
      g.fill();
      g.shadowBlur = 0;
      g.strokeStyle = 'rgba(255,255,255,0.85)';
      g.lineWidth = 1.3;
      g.stroke();

      g.strokeStyle = 'rgba(255,255,255,0.5)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(0, -r * 1.32); g.lineTo(0, r * 1.28);
      g.moveTo(-r * 0.95, -r * 0.16); g.lineTo(r * 0.95, -r * 0.16);
      g.stroke();

    } else if (t.kind === 'skull') {
      g.fillStyle = '#ece2cc';
      g.strokeStyle = 'rgba(80,70,50,0.8)';
      g.lineWidth = 1.4;
      g.beginPath();
      g.arc(0, -r * 0.12, r * 0.78, 0, Math.PI * 2);
      g.fill(); g.stroke();
      roundRect(g, -r * 0.46, r * 0.34, r * 0.92, r * 0.44, r * 0.16);
      g.fill(); g.stroke();

      g.fillStyle = '#2a2a2a';
      g.beginPath(); g.arc(-r * 0.32, -r * 0.16, r * 0.20, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc( r * 0.32, -r * 0.16, r * 0.20, 0, Math.PI * 2); g.fill();
      g.beginPath();
      g.moveTo(0, r * 0.02);
      g.lineTo(-r * 0.12, r * 0.28);
      g.lineTo(r * 0.12, r * 0.28);
      g.closePath();
      g.fill();

      g.strokeStyle = 'rgba(90,80,60,0.7)';
      g.lineWidth = 1;
      for (let i = -1; i <= 1; i++) {
        g.beginPath();
        g.moveTo(i * r * 0.22, r * 0.36);
        g.lineTo(i * r * 0.22, r * 0.72);
        g.stroke();
      }
    }
  }

  function createItem(type, x, y) {
    const t = TYPES[type];
    const needShape = (t.kind === 'gold' || t.kind === 'rock');
    const shape = makeShape(t.r, needShape ? (8 + Math.floor(Math.random() * 3)) : 0);

    const pad  = 14;
    const size = Math.ceil(t.r * 2.9) + pad * 2;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    g.translate(size / 2, size / 2);
    paintItem(g, type, t.r, shape);

    return {
      type, x, y,
      r: t.r,
      value: t.value,
      retract: t.retract,
      kind: t.kind,
      sprite: c,
      size: size,
      phase: Math.random() * Math.PI * 2,
      bobSpeed: 1.4 + Math.random() * 1.0,
      swaySpeed: 0.7 + Math.random() * 0.6,
      sparklePhase: Math.random() * Math.PI * 2,
      sparkleTimer: 1 + Math.random() * 2,
      rot: 0,
      rotVel: 0,
      trailTimer: 0
    };
  }

  /* ==================== 关卡 ==================== */
  function levelConfig(lv) {
    return {
      goldS:   4,
      goldM:   3 + Math.min(lv, 3),
      goldL:   1 + Math.min(lv, 3),
      rockS:   3,
      rockL:   1 + Math.min(lv, 3),
      diamond: lv >= 2 ? 1 : 0,
      skull:   1 + Math.floor(lv / 2)
    };
  }

  function resetLevel(lv) {
    level = lv;
    const cfg = levelConfig(lv);

    const list = [];
    for (const key in cfg) {
      for (let i = 0; i < cfg[key]; i++) list.push(key);
    }
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    }

    items = [];
    for (let idx = 0; idx < list.length; idx++) {
      const type = list[idx];
      const t = TYPES[type];
      let placed = false;

      for (let attempt = 0; attempt < 500; attempt++) {
        const relax = attempt > 260;
        const x = 50 + Math.random() * (W - 100);
        const y = 230 + Math.random() * (H - 300);
        const d = Math.hypot(x - PIVOT.x, y - PIVOT.y);

        if (d > MAX_LEN - t.r - 20) continue;
        if (d < 150) continue;

        let overlap = false;
        for (let k = 0; k < items.length; k++) {
          const it = items[k];
          if (Math.hypot(it.x - x, it.y - y) < it.r + t.r + (relax ? 6 : 14)) { overlap = true; break; }
        }
        if (!overlap) { items.push(createItem(type, x, y)); placed = true; break; }
      }

      if (!placed) {
        outer:
        for (let gy = 240; gy < H - 40; gy += 26) {
          for (let gx = 60; gx < W - 60; gx += 26) {
            const d = Math.hypot(gx - PIVOT.x, gy - PIVOT.y);
            if (d > MAX_LEN - t.r - 10 || d < 150) continue;
            let ok = true;
            for (let k = 0; k < items.length; k++) {
              const it = items[k];
              if (Math.hypot(it.x - gx, it.y - gy) < it.r + t.r + 4) { ok = false; break; }
            }
            if (ok) { items.push(createItem(type, gx, gy)); placed = true; break outer; }
          }
        }
      }
    }

    let totalValue = 0;
    for (let i = 0; i < items.length; i++) totalValue += items[i].value;
    target = Math.max(300, Math.round(totalValue * 0.40 / 50) * 50);

    score        = 0;
    displayScore = 0;
    timeLeft     = Math.max(40, 60 - (lv - 1) * 3);
    state        = 'swinging';
    angle        = 0;
    angleDir     = 1;
    hookLen      = MIN_LEN;
    grabbed      = null;
    floaters     = [];
    particles    = [];
    shake        = 0;
    scorePulse   = 0;
    shownProg    = 0;
    swingCooldown = 0;
    gamePhase    = 'playing';
    phaseTimer   = 0;
    finishing    = false;
    paused       = false;
  }

  /* ==================== 交互 ==================== */
  function shoot() {
    initAudio();
    if (paused) return;
    if (gamePhase === 'gameover') { resetLevel(1); return; }
    if (gamePhase !== 'playing') return;
    if (finishing) return;
    if (state === 'swinging' && swingCooldown <= 0) {
      state = 'shooting';
      beep(300, 0.08, 'square', 0.04);
    }
  }

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
      e.preventDefault();
      shoot();
    }
    if (e.code === 'KeyR') {
      initAudio();
      if (gamePhase === 'gameover') resetLevel(1);
    }
    if (e.code === 'KeyP') {
      if (gamePhase === 'playing') { paused = !paused; initAudio(); }
    }
    if (e.code === 'KeyM') {
      muted = !muted;
      initAudio();
    }
  });

  canvas.addEventListener('mousedown', function (e) { e.preventDefault(); shoot(); });
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); shoot(); }, { passive: false });

  /* ==================== 粒子 ==================== */
  function spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = speed * (0.3 + Math.random() * 0.9);
      const life = 0.45 + Math.random() * 0.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 40,
        life, maxLife: life,
        r: 1.5 + Math.random() * 2.5,
        color,
        star: false,
        rot: 0
      });
    }
  }
  function spawnStar(x, y, color) {
    const a = Math.random() * Math.PI * 2;
    const v = 15 + Math.random() * 35;
    particles.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 15,
      life: 0.55, maxLife: 0.55,
      r: 1.8 + Math.random() * 1.5,
      color,
      star: true,
      rot: Math.random() * Math.PI
    });
  }
  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.star ? 200 : 700) * dt;
      p.vx *= 0.98;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;

      if (p.star) {
        const s = p.r * (1 + (1 - alpha) * 1.8);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(p.x - s, p.y);
        ctx.lineTo(p.x + s, p.y);
        ctx.moveTo(p.x, p.y - s);
        ctx.lineTo(p.x, p.y + s);
        ctx.stroke();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ==================== 逻辑 ==================== */
  function collect(it) {
    score += it.value;
    scorePulse = 1;
    const color = it.kind === 'rock'
      ? '#c8c8c8'
      : (it.kind === 'diamond' ? '#7ff0ff' : (it.kind === 'skull' ? '#ffe0e0' : '#ffd24a'));

    floaters.push({ x: PIVOT.x, y: PIVOT.y - 46, text: '+' + it.value, color: color, life: 1 });
    spawnParticles(PIVOT.x, PIVOT.y - 30, TYPES[it.type].spark, 12, 130);
    if (it.kind === 'diamond') {
      for (let i = 0; i < 6; i++) {
        spawnStar(PIVOT.x + (Math.random() - 0.5) * 40, PIVOT.y - 30 + (Math.random() - 0.5) * 30, '#aaf6ff');
      }
    }
    beep(it.kind === 'diamond' ? 980 : (it.kind === 'rock' ? 220 : 680), 0.12, 'sine', 0.05);
  }

  function endLevel() {
    if (score >= target) {
      gamePhase = 'levelclear';
      phaseTimer = 2.2;
      beep(660, 0.14, 'sine', 0.055);
      setTimeout(function () { beep(880, 0.18, 'sine', 0.055); }, 140);
      setTimeout(function () { beep(1180, 0.24, 'sine', 0.055); }, 300);
    } else {
      gamePhase = 'gameover';
      if (window.mfhryScore) mfhryScore('gold-miner', Math.round(score));
      if (score > best) {
        best = score;
        try { localStorage.setItem('goldminer_best', String(best)); } catch (e) {}
      }
      beep(200, 0.35, 'sawtooth', 0.055);
      setTimeout(function () { beep(130, 0.55, 'sawtooth', 0.055); }, 260);
    }
  }

  function updateItems(dt) {
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.kind === 'diamond') {
        it.sparkleTimer -= dt;
        if (it.sparkleTimer <= 0) {
          it.sparkleTimer = 1.2 + Math.random() * 1.8;
          spawnStar(it.x + (Math.random() - 0.5) * it.r * 2.2,
                    it.y + (Math.random() - 0.5) * it.r * 2.2, '#baf8ff');
        }
      }
    }
  }

  function updateHook(dt) {
    const f = Math.min(dt * 60, 2.5);

    if (state === 'swinging') {
      if (swingCooldown > 0) {
        swingCooldown -= dt;
      } else {
        angle += SWING_SPEED * angleDir * f;
        if (angle > MAX_ANGLE)       { angle = MAX_ANGLE;  angleDir = -1; }
        else if (angle < -MAX_ANGLE) { angle = -MAX_ANGLE; angleDir =  1; }
      }

    } else if (state === 'shooting') {
      hookLen += SHOOT_SPEED * f;
      if (hookLen >= MAX_LEN) {
        hookLen = MAX_LEN;
        state = 'retracting';
        const p = hookPos();
        spawnParticles(p.x, p.y, '#cfb891', 5, 70);
      }

      const p = hookPos();
      if (p.x < -60 || p.x > W + 60 || p.y > H + 60) state = 'retracting';

      if (!grabbed && state === 'shooting') {
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          if (Math.hypot(it.x - p.x, it.y - p.y) < it.r + 10) {
            grabbed = it;
            items.splice(i, 1);
            state = 'retracting';
            shake = 2.5 + it.r * 0.14;
            spawnParticles(p.x, p.y, TYPES[it.type].spark, 9, 150);
            // 抓取时给予初始自旋
            grabbed.rotVel = (Math.random() > 0.5 ? 1 : -1) * (0.8 + Math.random() * 0.8);
            grabbed.rot = 0;
            beep(it.kind === 'rock' ? 170 : (it.kind === 'diamond' ? 880 : 520), 0.09, 'square', 0.04);
            break;
          }
        }
      }

    } else if (state === 'retracting') {
      const sp = grabbed ? grabbed.retract : BASE_RETRACT;
      hookLen -= sp * f;
      if (hookLen <= MIN_LEN) {
        hookLen = MIN_LEN;
        if (grabbed) { collect(grabbed); grabbed = null; }
        state = 'swinging';
        swingCooldown = 0.14;
      }
    }

    // 被抓物品跟随 + 旋转 + 拖尾
    if (grabbed) {
      const p = hookPos();
      grabbed.x = p.x;
      grabbed.y = p.y;
      grabbed.rot += grabbed.rotVel * dt;

      if (grabbed.value >= 100 && state === 'retracting') {
        grabbed.trailTimer -= dt;
        if (grabbed.trailTimer <= 0) {
          grabbed.trailTimer = 0.028;
          particles.push({
            x: p.x + (Math.random() - 0.5) * grabbed.r * 1.5,
            y: p.y + (Math.random() - 0.5) * grabbed.r * 1.5,
            vx: (Math.random() - 0.5) * 20,
            vy: -10 + Math.random() * 20,
            life: 0.35, maxLife: 0.35,
            r: 1 + Math.random() * 1.8,
            color: TYPES[grabbed.type].spark,
            star: false,
            rot: 0
          });
        }
      }
    }
  }

  function update(dt) {
    if (paused) return;
    tGlobal += dt;

    updateParticles(dt);
    shake *= Math.pow(0.0015, dt);
    if (shake < 0.15) shake = 0;
    if (scorePulse > 0) scorePulse = Math.max(0, scorePulse - dt * 3.5);

    // 分数滚动
    const dScore = score - displayScore;
    if (Math.abs(dScore) < 0.5) displayScore = score;
    else displayScore += dScore * Math.min(1, dt * 10);

    if (gamePhase === 'levelclear') {
      phaseTimer -= dt;
      if (phaseTimer <= 0) resetLevel(level + 1);
      return;
    }
    if (gamePhase === 'gameover') return;

    if (!finishing) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        finishing = true;
        beep(180, 0.3, 'sawtooth', 0.05);
      }
    }

    if (finishing && state === 'shooting') state = 'retracting';

    updateItems(dt);
    updateHook(dt);

    for (let i = 0; i < floaters.length; i++) {
      floaters[i].y -= 46 * dt;
      floaters[i].life -= dt * 1.05;
    }
    floaters = floaters.filter(function (fl) { return fl.life > 0; });

    if (!finishing && items.length === 0 && !grabbed && state === 'swinging') {
      finishing = true;
    }

    if (finishing && state === 'swinging' && !grabbed && swingCooldown <= 0) endLevel();

    const targetProg = Math.max(0, Math.min(1, score / target));
    shownProg += (targetProg - shownProg) * Math.min(1, dt * 8);
  }

  /* ==================== 渲染 ==================== */
  function drawBackground() {
    ctx.drawImage(bgCanvas, 0, 0);
  }

  function drawItems() {
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const bob = Math.sin(tGlobal * it.bobSpeed + it.phase) * 2;
      const rot = Math.sin(tGlobal * it.swaySpeed + it.phase) * 0.07;

      // 地面阴影
      ctx.fillStyle = 'rgba(0,0,0,0.26)';
      ctx.beginPath();
      ctx.ellipse(it.x, it.y + it.r * 0.82, it.r * 0.85, it.r * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(it.x, it.y + bob);
      ctx.rotate(rot);

      // 金块微光
      if (it.kind === 'gold') {
        const spark = Math.sin(tGlobal * 2 + it.sparklePhase);
        if (spark > 0.55) {
          const intensity = (spark - 0.55) / 0.45;
          ctx.shadowColor = 'rgba(255,240,150,' + (intensity * 0.9) + ')';
          ctx.shadowBlur = 12 * intensity;
        }
      }

      ctx.drawImage(it.sprite, -it.size / 2, -it.size / 2);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  function drawGrabbed() {
    if (!grabbed) return;
    const p = hookPos();

    // 被抓物品的阴影(投射到钩子上方一点)
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(p.x + 6, p.y + 6, grabbed.r * 0.9, grabbed.r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-angle + grabbed.rot);
    const s = grabbed.size;
    const yOff = grabbed.r * 0.8 + 4;

    if (grabbed.kind === 'gold') {
      ctx.shadowColor = 'rgba(255,220,100,0.5)';
      ctx.shadowBlur = 10;
    } else if (grabbed.kind === 'diamond') {
      ctx.shadowColor = 'rgba(120,240,255,0.7)';
      ctx.shadowBlur = 14;
    }

    ctx.drawImage(grabbed.sprite, -s / 2, yOff - s / 2);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function drawRopeAndHook() {
    const p = hookPos();

    // 绳索
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#3b2b18';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(PIVOT.x, PIVOT.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    ctx.strokeStyle = '#cdb891';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(PIVOT.x, PIVOT.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    // 绳结纹理
    ctx.strokeStyle = 'rgba(90,70,40,0.55)';
    ctx.lineWidth = 1.5;
    const segs = Math.floor(hookLen / 14);
    for (let i = 1; i < segs; i++) {
      const t = i / segs;
      const x = PIVOT.x + (p.x - PIVOT.x) * t;
      const y = PIVOT.y + (p.y - PIVOT.y) * t;
      ctx.beginPath();
      ctx.moveTo(x - 3, y - 2);
      ctx.lineTo(x + 3, y + 2);
      ctx.stroke();
    }

    // 钩子（更锐利的双爪）
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-angle);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 双爪 - 暗部
    ctx.strokeStyle = '#4d5866';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(-13, -12);
    ctx.quadraticCurveTo(-14, 4, -3, 9);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(13, -12);
    ctx.quadraticCurveTo(14, 4, 3, 9);
    ctx.stroke();

    // 双爪 - 高光
    ctx.strokeStyle = '#dfe6ee';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-13, -12);
    ctx.quadraticCurveTo(-14, 4, -3, 9);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(13, -12);
    ctx.quadraticCurveTo(14, 4, 3, 9);
    ctx.stroke();

    // 连接关节
    ctx.fillStyle = '#8794a3';
    ctx.beginPath();
    ctx.arc(0, -11, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2f3a45';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 横杆
    ctx.strokeStyle = '#9aa7b5';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-14, -12);
    ctx.lineTo(14, -12);
    ctx.stroke();
    ctx.strokeStyle = '#e6edf5';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-14, -12);
    ctx.lineTo(14, -12);
    ctx.stroke();

    ctx.restore();

    // 滑轮与支架
    ctx.fillStyle = '#46586e';
    ctx.beginPath();
    ctx.moveTo(PIVOT.x - 15, PIVOT.y - 13);
    ctx.lineTo(PIVOT.x + 15, PIVOT.y - 13);
    ctx.lineTo(PIVOT.x + 9,  PIVOT.y + 2);
    ctx.lineTo(PIVOT.x - 9,  PIVOT.y + 2);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(PIVOT.x, PIVOT.y, 11, 0, Math.PI * 2);
    const sg = ctx.createRadialGradient(PIVOT.x - 4, PIVOT.y - 4, 2, PIVOT.x, PIVOT.y, 12);
    sg.addColorStop(0,   '#b9c6d4');
    sg.addColorStop(0.6, '#6d7d8f');
    sg.addColorStop(1,   '#3c4956');
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.strokeStyle = '#222c36';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(PIVOT.x, PIVOT.y);
    ctx.rotate(angle);
    ctx.strokeStyle = '#2f3a45';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(i * Math.PI / 2) * 8, Math.sin(i * Math.PI / 2) * 8);
      ctx.stroke();
    }
    ctx.restore();

    ctx.beginPath();
    ctx.arc(PIVOT.x, PIVOT.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#1c242c';
    ctx.fill();
  }

  let blinkTimer = 2.5;
  let blinkPhase = 0;

  function drawMiner(dt) {
    blinkTimer -= dt;
    if (blinkPhase > 0) blinkPhase -= dt;
    if (blinkTimer <= 0) { blinkTimer = 2.4 + Math.random() * 2.2; blinkPhase = 0.13; }

    const x = PIVOT.x;
    const gy = GROUND_Y;
    const bob = Math.sin(tGlobal * 2.2) * 1.2;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(x, gy + 3, 28, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2f4468';
    ctx.fillRect(x - 14, gy - 26, 11, 26);
    ctx.fillRect(x + 3,  gy - 26, 11, 26);

    ctx.fillStyle = '#1b1b1b';
    ctx.fillRect(x - 17, gy - 8, 16, 8);
    ctx.fillRect(x + 1,  gy - 8, 16, 8);

    const bodyGrad = ctx.createLinearGradient(x - 18, 0, x + 18, 0);
    bodyGrad.addColorStop(0,   '#2f5a8f');
    bodyGrad.addColorStop(0.5, '#4d8bcd');
    bodyGrad.addColorStop(1,   '#2f5a8f');
    ctx.fillStyle = bodyGrad;
    roundRect(ctx, x - 18, gy - 58 + bob, 36, 36, 8);
    ctx.fill();

    ctx.strokeStyle = '#1f3a5c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 12, gy - 56 + bob);
    ctx.lineTo(x - 6,  gy - 24 + bob);
    ctx.moveTo(x + 12, gy - 56 + bob);
    ctx.lineTo(x + 6,  gy - 24 + bob);
    ctx.stroke();

    ctx.strokeStyle = '#f0c090';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    const armSwing = Math.sin(tGlobal * 2.2) * 2;
    ctx.beginPath();
    ctx.moveTo(x - 16, gy - 52 + bob);
    ctx.lineTo(x - 25, gy - 30 + armSwing);
    ctx.moveTo(x + 16, gy - 52 + bob);
    ctx.lineTo(x + 25, gy - 30 - armSwing);
    ctx.stroke();

    ctx.fillStyle = '#f5cba7';
    ctx.beginPath();
    ctx.arc(x, gy - 70 + bob, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#e9e9e9';
    ctx.beginPath();
    ctx.ellipse(x, gy - 62 + bob, 9.5, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#222';
    if (blinkPhase > 0) {
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 7, gy - 74 + bob);
      ctx.lineTo(x - 3, gy - 74 + bob);
      ctx.moveTo(x + 3, gy - 74 + bob);
      ctx.lineTo(x + 7, gy - 74 + bob);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(x - 5, gy - 74 + bob, 2, 0, Math.PI * 2);
      ctx.arc(x + 5, gy - 74 + bob, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#ffb703';
    ctx.beginPath();
    ctx.arc(x, gy - 75 + bob, 15, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x - 16, gy - 77 + bob, 32, 4);

    const pulse = 0.82 + Math.sin(tGlobal * 3) * 0.18;
    ctx.fillStyle = '#fff9b8';
    ctx.shadowColor = '#ffee55';
    ctx.shadowBlur = 16 * pulse;
    ctx.beginPath();
    ctx.arc(x, gy - 87 + bob, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawFloaters() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    for (let i = 0; i < floaters.length; i++) {
      const f = floaters[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.75)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawUI() {
    const grad = ctx.createLinearGradient(0, 0, 0, 60);
    grad.addColorStop(0, 'rgba(0,0,0,0.62)');
    grad.addColorStop(1, 'rgba(0,0,0,0.30)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, 60);

    ctx.textBaseline = 'middle';

    // 关卡
    ctx.textAlign = 'left';
    ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('第 ' + level + ' 关', 22, 25);

    // 分数（滚动 + 弹跳）
    ctx.textAlign = 'center';
    const fs = 22 + scorePulse * 7;
    ctx.font = 'bold ' + fs.toFixed(1) + 'px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = scorePulse > 0.1 ? '#ffe98a' : '#ffffff';
    ctx.fillText('得分  ' + Math.round(displayScore) + ' / ' + target, W / 2, 25);

    // 时间（最后10秒脉冲）
    if (timeLeft <= 10 && !finishing) {
      const urgency = 1 - timeLeft / 10;
      const pulse = Math.sin(tGlobal * 14) * 0.5 + 0.5;
      const scale = 1 + pulse * 0.10 * urgency;

      ctx.save();
      ctx.translate(W - 22, 25);
      ctx.scale(scale, scale);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ff5252';
      ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
      ctx.fillText('时间  ' + Math.ceil(timeLeft) + 's', 0, 0);
      ctx.restore();
    } else {
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
      ctx.fillText('时间  ' + Math.ceil(timeLeft) + 's', W - 22, 25);
    }

    // 进度条
    const barX = 22, barY = 44, barW = W - 44, barH = 8;
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    roundRect(ctx, barX, barY, barW, barH, 4);
    ctx.fill();

    if (shownProg > 0.005) {
      const pg = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      if (shownProg >= 0.999) { pg.addColorStop(0, '#7dff8a'); pg.addColorStop(1, '#2ecc71'); }
      else                    { pg.addColorStop(0, '#ffd24a'); pg.addColorStop(1, '#ff9c1a'); }
      ctx.fillStyle = pg;
      roundRect(ctx, barX, barY, Math.max(6, barW * shownProg), barH, 4);
      ctx.fill();
    }

    if (finishing && gamePhase === 'playing') {
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#ff8f5e';
      ctx.fillText('时间到！', W / 2, 92);
    }

    if (gamePhase === 'playing' && !finishing && state === 'swinging' && score === 0 && timeLeft > 56) {
      ctx.textAlign = 'center';
      ctx.globalAlpha = 0.75;
      ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('按空格 / 点击屏幕 放下钩子', W / 2, H - 34);
      ctx.globalAlpha = 1;
    }

    if (muted) {
      ctx.textAlign = 'right';
      ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('静音中 (M)', W - 22, 78);
    }
  }

  function drawOverlay() {
    if (paused && gamePhase === 'playing') {
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 54px "Microsoft YaHei", sans-serif';
      ctx.fillText('暂  停', W / 2, H / 2 - 24);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
      ctx.fillText('按 P 键继续', W / 2, H / 2 + 46);
      return;
    }

    if (gamePhase === 'playing') return;

    ctx.fillStyle = 'rgba(0,0,0,0.68)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (gamePhase === 'levelclear') {
      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 62px "Microsoft YaHei", sans-serif';
      ctx.fillText('过  关 !', W / 2, H / 2 - 78);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
      ctx.fillText('本关得分  ' + Math.round(displayScore) + '  /  目标  ' + target, W / 2, H / 2 + 2);

      ctx.fillStyle = '#9fe8ff';
      ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
      ctx.fillText('正在进入第 ' + (level + 1) + ' 关 …', W / 2, H / 2 + 68);
    } else {
      ctx.fillStyle = '#ff6b6b';
      ctx.font = 'bold 62px "Microsoft YaHei", sans-serif';
      ctx.fillText('游戏结束', W / 2, H / 2 - 92);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
      ctx.fillText('得分  ' + Math.round(displayScore) + '  /  目标  ' + target, W / 2, H / 2 - 16);

      if (score >= best && score > 0) {
        ctx.fillStyle = '#7dff8a';
        ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
        ctx.fillText('★ 新纪录  ' + best + ' ★', W / 2, H / 2 + 34);
      } else {
        ctx.fillStyle = '#b8c4d0';
        ctx.font = 'bold 22px "Microsoft YaHei", sans-serif';
        ctx.fillText('最高分  ' + best, W / 2, H / 2 + 34);
      }

      ctx.fillStyle = '#ffd24a';
      ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
      ctx.fillText('点击 / 空格 / R 键  重新开始', W / 2, H / 2 + 100);
    }
  }

  function render(dt) {
    drawBackground();

    ctx.save();
    if (shake > 0.15) {
      ctx.translate(
        (Math.random() - 0.5) * shake,
        (Math.random() - 0.5) * shake
      );
    }
    drawParticles();
    drawItems();
    drawRopeAndHook();
    drawGrabbed();
    drawMiner(dt);
    drawFloaters();
    ctx.restore();

    drawUI();
    drawOverlay();
  }

  /* ==================== 主循环 ==================== */
  let lastT = performance.now();
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.06);
    lastT = t;
    update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }

  /* ==================== 启动 ==================== */
  buildBackground();
  resetLevel(1);
  requestAnimationFrame(loop);

})();
</script>

<script src="/errlog.js"></script>
