<script>
'use strict';
/* =========================================================================
   CS 1.6 椋庢牸缃戦〉 FPS 鈥斺€?灏勭嚎鎶曞皠锛坮aycasting锛夋覆鏌?
   璐村浘鏉ユ簮锛氫紭鍏?WAD3锛堢敤鎴疯嚜宸辨彁渚涚殑 cstrike.wad / halflife.wad + palette.lmp锛夛紝
            娌℃湁鏃剁敤鍐呯疆绋嬪簭鍖栬创鍥撅紙鍘熷鍍忕礌鑷粯锛屼笉渚濊禆浠讳綍澶栭儴璧勬簮锛?
   ========================================================================= */

// ---------------------------------------------------------------- 甯搁噺
const W = 480, H = 270;                 // 鍐呴儴娓叉煋鍒嗚鲸鐜囷紙鏀惧ぇ鍒板睆骞曪紝淇濇寔鍍忕礌鎰燂級
const FOV = Math.PI / 3;                // 60掳
const TEX = 64;                         // 璐村浘杈归暱
const MAP_W = 28, MAP_H = 24;

// 澧欎綋绫诲瀷 鈫?璐村浘绱㈠紩锛?..5锛夛紝0 = 绌哄湴
// 1 娌欏 2 鏈ㄧ 3 閾侀棬 4 绾㈢爾 5 姘存偿
const MAP = (() => {
  const w = MAP_W, h = MAP_H;
  const m = new Uint8Array(w * h).fill(1);
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < w && y < h) m[y * w + x] = v; };
  // 澶栧洿娓呯┖锛屽仛鎴愪竴涓皝闂満鍦?
  for (let x = 1; x < w - 1; x++) for (let y = 1; y < h - 1; y++) set(x, y, 0);
  // 鍐呴儴缁撴瀯锛氫竴涓弻灞傞暱閫氶亾 + 鑻ュ共鎺╀綋锛坉ust2 涓棬鐨勫懗閬擄級
  for (let y = 4; y <= 19; y++) { set(10, y, 4); set(17, y, 4); }
  for (let x = 10; x <= 17; x++) { set(x, 4, 3); }
  set(13, 4, 0); set(14, 4, 0);            // 涓棬
  // 鏈ㄧ鎺╀綋
  const box = (x, y) => { set(x, y, 2); };
  box(5, 7); box(6, 7); box(5, 8); box(6, 8);
  box(21, 14); box(22, 14); box(21, 15);
  box(13, 11); box(14, 11);
  box(4, 16); box(5, 16);
  box(23, 6); box(24, 6);
  // 杈硅灏忔埧闂?
  for (let x = 2; x <= 7; x++) { set(x, 3, 5); }
  for (let y = 3; y <= 6; y++) { set(8, y, 5); }
  set(4, 3, 0);
  return m;
})();

// ---------------------------------------------------------------- 璐村浘
const textures = [];        // 姣忛」 { canvas, ctx, data, w, h }
let usingWad = false;

function mkTexCanvas() {
  const c = document.createElement('canvas');
  c.width = TEX; c.height = TEX;
  return { canvas: c, ctx: c.getContext('2d') };
}

// ------- 绋嬪簭鍖栬创鍥撅紙鏃犲閮ㄨ祫婧愶紱妯′豢 dust 鐨勬矙澧?鏈ㄧ/閾佺毊鑹茶皟锛?-------
function rndSeed(s) { return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }

function genSandWall(seed, base) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  const img = ctx.createImageData(TEX, TEX);
  const d = img.data;
  for (let y = 0; y < TEX; y++) {
    for (let x = 0; x < TEX; x++) {
      const i = (y * TEX + x) * 4;
      // 鐮栧潡鎺掑垪锛? 琛?脳 2 鍒楋紝閿欑紳
      const row = (y / 16) | 0;
      const off = row % 2 ? 16 : 0;
      const bx = ((x + off) % 32), by = y % 16;
      const mortar = (bx < 2) || (by < 2);
      let n = (r() - 0.5) * 22;
      const shade = 1 - (y / TEX) * 0.18;         // 椤堕儴寰寒
      let v = mortar ? base * 0.62 : base * shade;
      v += n;
      // 姘存偿缂濈殑娌欑矑
      if (!mortar && r() > 0.93) v += 16;
      d[i] = v * 1.02; d[i + 1] = v * 0.88; d[i + 2] = v * 0.66; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // 鐮栫紳鍔犳繁
  ctx.strokeStyle = 'rgba(40,30,18,.55)';
  ctx.lineWidth = 1;
  for (let y = 0; y < TEX; y += 16) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(TEX, y + .5); ctx.stroke(); }
  for (let y = 0; y < TEX; y += 16) {
    const off = ((y / 16) | 0) % 2 ? 16 : 0;
    for (let x = 0; x < TEX; x += 32) { ctx.beginPath(); ctx.moveTo((x + off) + .5, y); ctx.lineTo((x + off) + .5, y + 16); ctx.stroke(); }
  }
  return canvas;
}

function genCrate(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  // 鏈ㄧ锛氬妗?+ 鏂滄拺 + 鏈ㄧ汗
  ctx.fillStyle = '#8a6a3f'; ctx.fillRect(0, 0, TEX, TEX);
  const img = ctx.getImageData(0, 0, TEX, TEX), d = img.data;
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const i = (y * TEX + x) * 4;
    const grain = Math.sin((x * 0.6 + Math.sin(y * 0.35) * 2.4)) * 10 + (r() - .5) * 14;
    d[i] += grain; d[i + 1] += grain * .8; d[i + 2] += grain * .5;
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = 'rgba(58,40,20,.9)'; ctx.lineWidth = 3; ctx.strokeRect(1.5, 1.5, TEX - 3, TEX - 3);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(TEX - 4, TEX - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(TEX - 4, 4); ctx.lineTo(4, TEX - 4); ctx.stroke();
  ctx.strokeStyle = 'rgba(30,20,10,.6)'; ctx.lineWidth = 1; ctx.strokeRect(5.5, 5.5, TEX - 11, TEX - 11);
  return canvas;
}

function genMetalDoor(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  const g = ctx.createLinearGradient(0, 0, TEX, 0);
  g.addColorStop(0, '#3f4a52'); g.addColorStop(.5, '#59656d'); g.addColorStop(1, '#3a444b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, TEX, TEX);
  const img = ctx.getImageData(0, 0, TEX, TEX), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
  // 閾嗛拤涓庢í绛?
  ctx.fillStyle = 'rgba(20,26,30,.75)';
  for (let x = 8; x < TEX; x += 16) for (let y = 8; y < TEX; y += 16) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(220,235,240,.10)'; ctx.fillRect(0, 14, TEX, 2); ctx.fillRect(0, 46, TEX, 2);
  ctx.strokeStyle = 'rgba(15,20,24,.85)'; ctx.lineWidth = 2; ctx.strokeRect(1.5, 1.5, TEX - 3, TEX - 3);
  return canvas;
}

function genBrickRed(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  ctx.fillStyle = '#5c2f26'; ctx.fillRect(0, 0, TEX, TEX);
  for (let y = 0; y < TEX; y += 8) {
    const off = ((y / 8) | 0) % 2 ? 8 : 0;
    for (let x = -16; x < TEX; x += 16) {
      const v = 70 + r() * 40;
      ctx.fillStyle = `rgb(${v + 32},${v * .55},${v * .42})`;
      ctx.fillRect(x + off + 1, y + 1, 14, 6);
    }
  }
  const img = ctx.getImageData(0, 0, TEX, TEX), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function genConcrete(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  const img = ctx.createImageData(TEX, TEX), d = img.data;
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const i = (y * TEX + x) * 4;
    const v = 96 + (r() - .5) * 26 + Math.sin(x * .12) * 4 + Math.sin(y * .1) * 3;
    d[i] = v; d[i + 1] = v; d[i + 2] = v * .97; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = 'rgba(40,44,48,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 32.5); ctx.lineTo(TEX, 32.5); ctx.stroke();
  return canvas;
}

function buildProceduralTextures() {
  textures.length = 0;
  textures[1] = { canvas: genSandWall(7, 176) };
  textures[2] = { canvas: genCrate(11) };
  textures[3] = { canvas: genMetalDoor(3) };
  textures[4] = { canvas: genBrickRed(5) };
  textures[5] = { canvas: genConcrete(19) };
  // 棰勫彇 1px 瀹界殑鍒楀垏鐗囦笉鏂逛究锛屾敼涓虹洿鎺ユ寜鍒?drawImage 婧愮煩褰紙瑙?render锛?
}
buildProceduralTextures();

// ---------------------------------------------------------------- WAD3 瑙ｆ瀽
// 缁撴瀯锛氬ご 'WAD3' + int32 numlumps + int32 infotableofs
// lump 鐩綍椤?32 瀛楄妭锛歩nt32 filepos, int32 disksize, int32 size, byte type, byte compression, 2 pad, char name[16]
// type 0x43 = miptex锛堣创鍥撅級锛歝har name[16], uint32 width, height, uint32 offsets[4], 鐒跺悗鍚?mip 鐨?8bit 绱㈠紩鍍忕礌
function parseWad(buf, palette) {
  if (buf instanceof ArrayBuffer) buf = new Uint8Array(buf);
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const fourcc = String.fromCharCode(buf[0], buf[1], buf[2], buf[3]);
  if (fourcc !== 'WAD3' && fourcc !== 'WAD2') throw new Error('涓嶆槸 WAD 鏂囦欢');
  const numlumps = dv.getInt32(4, true);
  const infotableofs = dv.getInt32(8, true);
  const out = new Map();
  for (let i = 0; i < numlumps; i++) {
    const off = infotableofs + i * 32;
    const filepos = dv.getInt32(off, true);
    const size = dv.getInt32(off + 8, true);
    const type = dv.getUint8(off + 12);
    let name = '';
    for (let k = 0; k < 16; k++) { const ch = dv.getUint8(off + 16 + k); if (!ch) break; name += String.fromCharCode(ch); }
    if (type !== 0x43) continue;                    // 鍙璐村浘
    try {
      const lv = new DataView(buf.buffer, buf.byteOffset + filepos, size);
      const w = lv.getUint32(16, true), h = lv.getUint32(20, true);
      const mipOff = lv.getUint32(24, true);
      if (w <= 0 || h <= 0 || w > 512 || h > 512) continue;
      const px = new Uint8Array(buf.buffer, buf.byteOffset + filepos + mipOff, w * h);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d');
      const img = cx.createImageData(w, h), d = img.data;
      for (let p = 0; p < w * h; p++) {
        const idx = px[p];
        const pi = idx * 3;
        d[p * 4] = palette[pi]; d[p * 4 + 1] = palette[pi + 1]; d[p * 4 + 2] = palette[pi + 2];
        d[p * 4 + 3] = idx === 255 ? 0 : 255;       // miptex 绾﹀畾 255 = 閫忔槑
      }
      cx.putImageData(img, 0, 0);
      out.set(name.toLowerCase(), c);
    } catch (e) { /* 璺宠繃鍧?lump */ }
  }
  return out;
}

// 鎶?WAD 閲岀殑璐村浘鏇挎崲杩?1..5 妲戒綅锛堟寜 dust 甯歌璐村浘鍚嶆寫锛屾寫涓嶅埌灏辩敤鍓嶅嚑寮狅級
function applyWad(wadMap) {
  const want = ['crete4_wall02', 'cwall', 'sandwall', 'wall', 'crate', 'cncr', 'door'];
  const pick = (names) => {
    for (const n of names) {
      for (const k of wadMap.keys()) if (k.includes(n)) return wadMap.get(k);
    }
    return null;
  };
  const list = [pick(['cw']), pick(['crete']), pick(['crate', 'wood']), pick(['door', 'met']), pick(['brick'])];
  let hit = 0;
  for (let i = 0; i < 5; i++) {
    if (list[i]) { textures[i + 1] = { canvas: list[i] }; hit++; }
  }
  if (!hit) {                                // 鍚嶅瓧瀵逛笉涓婏細鎸変綋绉彇鍓?5 寮?
    let n = 0;
    for (const c of wadMap.values()) {
      if (n >= 5) break;
      if (c.width >= 32) { textures[n + 1] = { canvas: c }; n++; }
    }
    hit = n;
  }
  return hit;
}

// ---------------------------------------------------------------- 娓告垙鐘舵€?
const state = {
  x: 4.5, y: 20.5, a: -Math.PI / 2,        // 鐜╁浣嶇疆/鏈濆悜
  hp: 100, armor: 100,
  weapon: 1, ammo: [0, 20, 30, 5], mag: [0, 20, 30, 5], reserve: [0, 60, 90, 15],
  kills: 0, waves: 0, dead: false, won: false,
  lastShot: 0, reloading: 0, recoil: 0, kick: 0, hitMark: 0,
  bots: [], time: 0, msg: '', msgT: 0,
};
const WEAPONS = {
  1: { name: 'Glock', dmg: 24, rate: 0.16, spread: 0.02, auto: true, reload: 1.4, pellets: 1 },
  2: { name: 'AK-47', dmg: 36, rate: 0.1, spread: 0.035, auto: true, reload: 2.3, pellets: 1 },
  3: { name: 'AWP', dmg: 115, rate: 0.7, spread: 0.004, auto: false, reload: 3.2, pellets: 1 },
};

// 纰版挒
function solid(x, y) {
  const gx = x | 0, gy = y | 0;
  if (gx < 0 || gy < 0 || gx >= MAP_W || gy >= MAP_H) return true;
  return MAP[gy * MAP_W + gx] !== 0;
}
function blocked(x, y, r) {
  return solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
}

// ---------------------------------------------------------------- 鏈哄櫒浜?
function spawnWave() {
  state.waves++;
  const n = Math.min(6, 2 + state.waves);
  state.bots = [];
  const spots = [[22, 4], [24, 20], [13, 6], [3, 18], [19, 21], [7, 12]];
  for (let i = 0; i < n; i++) {
    const [sx, sy] = spots[i % spots.length];
    state.bots.push({
      x: sx + (Math.random() - .5), y: sy + (Math.random() - .5),
      hp: 100, alive: true, cd: 1 + Math.random(), speed: 1.1 + Math.random() * .5,
      hitFlash: 0, anim: Math.random() * 6,
    });
  }
  say(`绗?${state.waves} 娉?路 ${n} 涓晫浜篳);
}

function say(t) { state.msg = t; state.msgT = 2.2; }

// ---------------------------------------------------------------- 杈撳叆
const keys = Object.create(null);
let pointerLocked = false;

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
    const w = +e.code.slice(-1);
    if (state.reserve[w] > 0 || state.mag[w] > 0) { state.weapon = w; state.reloading = 0; }
  }
  if (e.code === 'KeyR') startReload();
  if (e.code === 'Escape') pointerLocked = false;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

const view = document.getElementById('view');
view.width = W; view.height = H;
const ctx = view.getContext('2d');
ctx.imageSmoothingEnabled = false;

view.addEventListener('click', () => {
  if (!pointerLocked) { view.requestPointerLock?.(); return; }
  fire();
});
view.addEventListener('contextmenu', (e) => { e.preventDefault(); fire(true); });
view.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  state.a += (e.movementX || 0) * 0.0028;
});
document.addEventListener('pointerlockchange', () => { pointerLocked = document.pointerLockElement === view; });

function startReload() {
  const w = state.weapon, def = WEAPONS[w];
  if (state.reloading > 0 || state.mag[w] >= def.mag) return;
  if (state.reserve[w] <= 0) { say('娌℃湁澶囧脊'); return; }
  state.reloading = def.reload;
}
WEAPONS[1].mag = 20; WEAPONS[2].mag = 30; WEAPONS[3].mag = 5;

// ---------------------------------------------------------------- 寮€鐏?
function fire(single) {
  const now = performance.now() / 1000;
  const w = state.weapon, def = WEAPONS[w];
  if (state.dead || state.reloading > 0) return;
  if (now - state.lastShot < def.rate) return;
  if (state.mag[w] <= 0) { startReload(); return; }
  state.lastShot = now;
  state.mag[w]--;
  state.kick = 1; state.recoil = Math.min(1, state.recoil + 0.35);
  if (window.__mfKit?.sfx) window.__mfKit.sfx.shoot?.(w);

  // 灏勭嚎锛氭部瑙嗙嚎鎵紝鍛戒腑鏈€杩戞晫浜?
  const spread = def.spread * (1 + state.recoil * 0.8);
  const ang = state.a + (Math.random() - .5) * spread;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let best = null, bestT = 1e9;
  for (const b of state.bots) {
    if (!b.alive) continue;
    const vx = b.x - state.x, vy = b.y - state.y;
    const t = vx * dx + vy * dy;                    // 鎶曞奖璺濈
    if (t <= 0 || t > 26) continue;
    const perp = Math.abs(vx * dy - vy * dx);       // 鍨傜洿鍋忕Щ
    if (perp > 0.42) continue;                      // 鍛戒腑鍗婂緞
    if (t < bestT) {
      // 澧欓伄鎸℃鏌?
      let blockedByWall = false;
      for (let s = 0.3; s < t; s += 0.25) {
        if (solid(state.x + dx * s, state.y + dy * s)) { blockedByWall = true; break; }
      }
      if (!blockedByWall) { best = b; bestT = t; }
    }
  }
  if (best) {
    best.hp -= def.dmg * (1 + Math.random() * .2);
    best.hitFlash = 0.18;
    state.hitMark = 0.18;
    if (window.__mfKit?.sfx) window.__mfKit.sfx.hit?.();
    if (best.hp <= 0) {
      best.alive = false;
      state.kills++;
      if (window.__mfKit?.sfx) window.__mfKit.sfx.score?.();
      if (state.bots.every(x => !x.alive)) { state.won = true; }
    }
    // 杞诲井鍥炴帹
    state.x -= dx * 0.02; state.y -= dy * 0.02;
  }
}

// ---------------------------------------------------------------- 娓叉煋
const zBuf = new Float32Array(W);
const FLOOR_H = H * 0.5;

function castColumn(camX, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let mx = state.x | 0, my = state.y | 0;
  const ddx = Math.abs(1 / dx || 1e9), ddy = Math.abs(1 / dy || 1e9);
  let sx, sy, sdx, sdy;
  if (dx < 0) { sx = -1; sdx = (state.x - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - state.x) * ddx; }
  if (dy < 0) { sy = -1; sdy = (state.y - my) * ddy; } else { sy = 1; sdy = (my + 1 - state.y) * ddy; }
  let side = 0;
  for (let i = 0; i < 64; i++) {
    if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
    if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return null;
    const t = MAP[my * MAP_W + mx];
    if (t) {
      const dist = side === 0 ? (sdx - ddx) : (sdy - ddy);
      let wallX = side === 0 ? state.y + dist * dy : state.x + dist * dx;
      wallX -= Math.floor(wallX);
      return { t, dist, wallX, side };
    }
  }
  return null;
}

function render() {
  // 澶╃┖ & 鍦伴潰锛坉ust锛氭殩鑹茶皟锛?
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#7d8ea0'); sky.addColorStop(1, '#c8b995');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.55);
  const grd = ctx.createLinearGradient(0, H * 0.55, 0, H);
  grd.addColorStop(0, '#8a7551'); grd.addColorStop(1, '#4a3c28');
  ctx.fillStyle = grd; ctx.fillRect(0, H * 0.55, W, H * 0.45);

  const FOV_V = FOV;
  for (let col = 0; col < W; col++) {
    const camX = (2 * col / W) - 1;
    const ang = state.a + Math.atan(camX * Math.tan(FOV_V / 2));
    const hit = castColumn(camX, ang);
    if (!hit) { zBuf[col] = 1e9; continue; }
    // 閫忚淇
    const perp = hit.dist * Math.cos(ang - state.a);
    zBuf[col] = perp;
    const lineH = Math.min(H * 3, (H / perp));
    const y0 = H / 2 - lineH / 2 + (state.kick * 4);
    const tex = textures[hit.t] || textures[1];
    if (!tex) continue;
    const tw = tex.canvas.width;
    let tx = Math.floor(hit.wallX * tw) % tw;
    if (hit.side === 1) tx = tw - 1 - tx;
    // 鏄庢殫锛氫晶闈㈠澹佽皟鏆楋紝杩滃鍙樻殫锛堢畝鏄撻浘锛?
    const shade = Math.min(1, 1 / (1 + perp * 0.16)) * (hit.side === 1 ? 0.78 : 1);
    ctx.globalAlpha = 1;
    ctx.drawImage(tex.canvas, tx, 0, 1, tex.canvas.height, col, y0, 1, lineH);
    if (shade < 0.999) {
      ctx.fillStyle = `rgba(0,0,0,${(1 - shade) * 0.82})`;
      ctx.fillRect(col, y0, 1, lineH);
    }
  }
  renderBots();
  renderViewmodel();
  renderHUD();
}

function renderBots() {
  const list = state.bots.filter(b => b.alive)
    .map(b => ({ b, d: Math.hypot(b.x - state.x, b.y - state.y) }))
    .sort((p, q) => q.d - p.d);
  for (const { b, d } of list) {
    const vx = b.x - state.x, vy = b.y - state.y;
    const rel = Math.atan2(vy, vx) - state.a;
    let ang = rel;
    while (ang > Math.PI) ang -= Math.PI * 2;
    while (ang < -Math.PI) ang += Math.PI * 2;
    if (Math.abs(ang) > FOV / 2 + 0.35) continue;
    const screenX = (0.5 + Math.tan(ang) / (2 * Math.tan(FOV / 2))) * W;
    const size = (H / Math.max(0.6, d)) * 0.62;
    const bottom = H / 2 + size * 0.42 + state.kick * 4;
    const top = bottom - size * 1.15;
    // 閫愬垪娣卞害娴嬭瘯
    const x0 = Math.floor(screenX - size * 0.30), x1 = Math.ceil(screenX + size * 0.30);
    const colW = Math.max(1, Math.round((x1 - x0) / 1));
    for (let px = x0; px <= x1; px++) {
      if (px < 0 || px >= W) continue;
      if (zBuf[px] < d - 0.2) continue;
      drawBotSlice(px, top, bottom, size, b, x0, x1);
    }
  }
}

function drawBotSlice(px, top, bottom, size, b, x0, x1) {
  const t = (px - x0) / Math.max(1, (x1 - x0));
  const bodyW = size * 0.5;
  // 鍛戒腑鍙嶉锛氭暣浣撴硾绾?
  const flash = b.hitFlash > 0;
  const cx = x0 + (x1 - x0) * 0.5;
  const dxAbs = Math.abs(px - cx) / (bodyW / 2);
  if (dxAbs > 1) return;
  const hh = bottom - top;
  const legTop = top + hh * 0.62;
  const headR = size * 0.10;
  const headY = top + headR * 1.2;
  // 澶?
  if (Math.abs(px - cx) < headR * 1.6) {
    ctx.fillStyle = flash ? '#e08a7a' : '#d9b99a';
    ctx.fillRect(px, headY - headR, 1, headR * 2);
    // 澶村甫/甯藉瓙
    ctx.fillStyle = flash ? '#c86a58' : '#3f4a52';
    ctx.fillRect(px, headY - headR, 1, headR * 0.8);
  }
  ctx.fillStyle = flash ? '#a8584a' : '#4f5d52';
  ctx.fillRect(px, top + hh * 0.26, 1, legTop - (top + hh * 0.26));
  // 鑵?
  ctx.fillStyle = flash ? '#8a4a3e' : '#38413c';
  ctx.fillRect(px, legTop, 1, bottom - legTop);
}

function renderViewmodel() {
  const kick = state.kick * 10 + state.recoil * 6;
  const cx = W * 0.72, cy = H - 8 + kick;
  ctx.save();
  ctx.translate(cx, cy);
  const w = state.weapon;
  if (w === 1) {                       // Glock 杞粨
    ctx.fillStyle = '#2b2f33'; ctx.fillRect(-26, -38, 30, 30);
    ctx.fillStyle = '#22262a'; ctx.fillRect(-14, -10, 18, 26);
    ctx.fillStyle = '#3a4148'; ctx.fillRect(-26, -40, 30, 5);
  } else if (w === 2) {                // AK 杞粨
    ctx.fillStyle = '#4a2f1c'; ctx.fillRect(-52, -12, 26, 16);      // 鏈ㄦ墭
    ctx.fillStyle = '#25292d'; ctx.fillRect(-30, -22, 62, 18);      // 鏈哄專
    ctx.fillStyle = '#2e3439'; ctx.fillRect(14, -19, 44, 7);        // 鏋
    ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-6, -6, 14, 26);        // 寮瑰專
    ctx.fillStyle = '#1b1f22'; ctx.fillRect(24, -26, 8, 12);        // 鍑嗘槦
  } else {                             // AWP
    ctx.fillStyle = '#20262b'; ctx.fillRect(-46, -16, 96, 14);
    ctx.fillStyle = '#2b3640'; ctx.fillRect(-34, -24, 44, 10);      // 闀?
    ctx.fillStyle = '#5a3f24'; ctx.fillRect(-58, -10, 18, 22);
    ctx.fillStyle = '#171c20'; ctx.fillRect(40, -22, 10, 8);
  }
  ctx.restore();
  // 鏋彛闂厜
  if (state.kick > 0.55) {
    const mx = cx + (w === 2 ? 58 : w === 3 ? 50 : 2), my = cy - (w === 2 ? 16 : w === 3 ? 18 : 34) + kick;
    const g = ctx.createRadialGradient(mx, my, 0, mx, my, 26);
    g.addColorStop(0, 'rgba(255,236,170,.95)'); g.addColorStop(.4, 'rgba(255,170,60,.5)'); g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 26, 0, 7); ctx.fill();
  }
}

function renderHUD() {
  // 鍑嗘槦
  const cx = W / 2, cy = H / 2 + state.kick * 3;
  const gap = 3 + state.recoil * 6;
  ctx.fillStyle = state.hitMark > 0 ? '#ff6b5e' : 'rgba(140,255,190,.92)';
  ctx.fillRect(cx - gap - 6, cy, 6, 1);
  ctx.fillRect(cx + gap, cy, 6, 1);
  ctx.fillRect(cx, cy - gap - 6, 1, 6);
  ctx.fillRect(cx, cy + gap, 1, 6);

  // 宸︿笅锛氱敓鍛?鎶ょ敳
  ctx.font = 'bold 15px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(8, H - 52, 104, 44);
  ctx.fillStyle = state.hp > 40 ? '#9fe3b4' : '#f08a7a';
  ctx.fillText('鈾?' + Math.max(0, Math.floor(state.hp)), 14, H - 32);
  ctx.fillStyle = '#8fb8d6';
  ctx.fillText('鉀?' + Math.max(0, Math.floor(state.armor)), 14, H - 14);

  // 鍙充笅锛氬脊鑽?
  const w = state.weapon, def = WEAPONS[w];
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(W - 118, H - 52, 110, 44);
  ctx.fillStyle = state.mag[w] ? '#ffe9a8' : '#f08a7a';
  ctx.font = 'bold 18px ui-monospace, Consolas, monospace';
  ctx.fillText(String(state.mag[w]), W - 60, H - 26);
  ctx.font = 'bold 12px ui-monospace, Consolas, monospace';
  ctx.fillStyle = '#9aa5ae';
  ctx.fillText('/ ' + state.reserve[w], W - 52, H - 26);
  ctx.font = '11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = '#c3ccd4';
  ctx.fillText(def.name, W - 14, H - 10);
  if (state.reloading > 0) {
    ctx.fillStyle = 'rgba(255,220,140,.9)';
    ctx.textAlign = 'center';
    ctx.fillText('鎹㈠脊涓€?, W / 2, H - 26);
  }

  // 宸︿笂锛氬嚮鏉€鏁?娉㈡暟
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(8, 8, 128, 22);
  ctx.fillStyle = '#e8eef2';
  ctx.fillText(`鍑绘潃 ${state.kills}銆€娉㈡ ${state.waves}`, 14, 23);

  // 闆疯揪
  const RS = 54, rx = W - RS - 10, ry = 10;
  ctx.fillStyle = 'rgba(6,10,13,.62)'; ctx.fillRect(rx, ry, RS, RS);
  ctx.strokeStyle = 'rgba(140,200,170,.35)'; ctx.lineWidth = 1; ctx.strokeRect(rx + .5, ry + .5, RS - 1, RS - 1);
  const sc = RS / MAP_W;
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (MAP[y * MAP_W + x]) { ctx.fillStyle = 'rgba(150,180,200,.20)'; ctx.fillRect(rx + x * sc, ry + y * sc, sc, sc); }
  }
  for (const b of state.bots) {
    if (!b.alive) continue;
    ctx.fillStyle = '#f06a5a';
    ctx.fillRect(rx + b.x * sc - 1, ry + b.y * sc - 1, 2, 2);
  }
  ctx.fillStyle = '#9fe3b4';
  ctx.fillRect(rx + state.x * sc - 1, ry + state.y * sc - 1, 2, 2);
  ctx.strokeStyle = 'rgba(159,227,180,.8)';
  ctx.beginPath();
  ctx.moveTo(rx + state.x * sc, ry + state.y * sc);
  ctx.lineTo(rx + (state.x + Math.cos(state.a) * 3) * sc, ry + (state.y + Math.sin(state.a) * 3) * sc);
  ctx.stroke();

  // 娑堟伅
  if (state.msgT > 0) {
    ctx.globalAlpha = Math.min(1, state.msgT);
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    const tw = ctx.measureText(state.msg).width + 18;
    ctx.fillRect(W / 2 - tw / 2, 34, tw, 20);
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText(state.msg, W / 2, 48);
    ctx.globalAlpha = 1;
  }

  // 姝讳骸 / 閫氬叧
  if (state.dead || state.won) {
    ctx.fillStyle = 'rgba(6,9,12,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px system-ui, "PingFang SC", sans-serif';
    ctx.fillStyle = state.dead ? '#f08a7a' : '#9fe3b4';
    ctx.fillText(state.dead ? '浣犺鍑诲€掍簡' : `绗?${state.waves} 娉㈡竻绌篳, W / 2, H / 2 - 14);
    ctx.font = '13px system-ui, "PingFang SC", sans-serif';
    ctx.fillStyle = '#c3ccd4';
    ctx.fillText(`鍑绘潃 ${state.kills}銆€鎸?R 閲嶆柊寮€濮媊, W / 2, H / 2 + 14);
  }
}

// ---------------------------------------------------------------- 涓诲惊鐜?
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!state.dead && !state.won) update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  state.time += dt;
  if (state.msgT > 0) state.msgT -= dt;
  if (state.hitMark > 0) state.hitMark -= dt;
  if (state.recoil > 0) state.recoil = Math.max(0, state.recoil - dt * 3.2);
  if (state.kick > 0) state.kick = Math.max(0, state.kick - dt * 6);

  // 鎹㈠脊
  if (state.reloading > 0) {
    state.reloading -= dt;
    if (state.reloading <= 0) {
      const w = state.weapon, def = WEAPONS[w];
      const need = def.mag - state.mag[w];
      const take = Math.min(need, state.reserve[w]);
      state.mag[w] += take; state.reserve[w] -= take;
      state.reloading = 0;
    }
  }

  // 绉诲姩
  let mx = 0, my = 0;
  if (keys['KeyW']) my += 1;
  if (keys['KeyS']) my -= 1;
  if (keys['KeyA']) mx -= 1;
  if (keys['KeyD']) mx += 1;
  const speed = (keys['ShiftLeft'] || keys['ShiftRight'] ? 1.9 : 3.4) * dt;
  if (mx || my) {
    const len = Math.hypot(mx, my) || 1;
    const dx = (Math.cos(state.a) * my - Math.sin(state.a) * mx) / len * speed;
    const dy = (Math.sin(state.a) * my + Math.cos(state.a) * mx) / len * speed;
    if (!blocked(state.x + dx, state.y, 0.24)) state.x += dx;
    if (!blocked(state.x, state.y + dy, 0.24)) state.y += dy;
  }

  // 鏈哄櫒浜?AI
  for (const b of state.bots) {
    if (!b.alive) continue;
    if (b.hitFlash > 0) b.hitFlash -= dt;
    b.anim += dt * 6;
    const dx = state.x - b.x, dy = state.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    // 淇濇寔 4~8 绫充氦鎴樿窛绂?
    let dir = 0;
    if (d > 8) dir = 1; else if (d < 3.5) dir = -1;
    if (dir) {
      const nx = b.x + (dx / d) * b.speed * dir * dt;
      const ny = b.y + (dy / d) * b.speed * dir * dt;
      if (!blocked(nx, ny, 0.26)) { b.x = nx; b.y = ny; }
    }
    // 妯悜娓歌蛋
    const strafe = Math.sin(b.anim * 0.5) * b.speed * 0.6 * dt;
    const px = b.x + (-dy / d) * strafe, py = b.y + (dx / d) * strafe;
    if (!blocked(px, py, 0.26)) { b.x = px; b.y = py; }

    // 寮€鐏垽瀹氾紙瑙嗙嚎閬尅 + 姒傜巼鍛戒腑锛?
    b.cd -= dt;
    if (b.cd <= 0 && d < 16) {
      b.cd = 0.75 + Math.random() * 0.9;
      let visible = true;
      for (let s = 0.3; s < d; s += 0.3) if (solid(b.x + dx / d * s, b.y + dy / d * s)) { visible = false; break; }
      if (visible) {
        const acc = Math.max(0.18, 0.75 - d * 0.035);
        if (Math.random() < acc) {
          const dmg = 8 + Math.random() * 12;
          state.hp -= dmg;
          if (state.armor > 0) { state.armor = Math.max(0, state.armor - dmg * 0.5); state.hp += dmg * 0.5; }
          state.recoil = Math.min(1, state.recoil + 0.9);
          state.kick = Math.max(state.kick, 0.8);
          if (window.__mfKit?.sfx) window.__mfKit.sfx.hit?.();
          if (state.hp <= 0) { state.hp = 0; state.dead = true; }
        }
      }
    }
  }
}

// 鑳滃埄鍚庤繘鍏ヤ笅涓€娉?
function checkWin() {
  if (state.won) {
    state.won = false;
    spawnWave();
  }
}

// ------------------------------------------------ WAD 鎷栨嫿锛堢敤鎴疯嚜宸辩殑娓告垙鏂囦欢锛?
const dropEl = document.getElementById('drop');
const dropInfo = document.getElementById('dropinfo');
let paletteBuf = null;

async function readFile(f) {
  return new Uint8Array(await f.arrayBuffer());
}

dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('hot'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('hot'));
dropEl.addEventListener('drop', async (e) => {
  e.preventDefault(); dropEl.classList.remove('hot');
  const files = [...e.dataTransfer.files];
  const wadFile = files.find(f => /\.wad$/i.test(f.name));
  const palFile = files.find(f => /palette\.lmp$/i.test(f.name) || /\.lmp$/i.test(f.name));
  if (palFile) { paletteBuf = await readFile(palFile); dropInfo.textContent = '璋冭壊鏉垮凡璇诲彇锛? + palFile.name; }
  if (!wadFile) return;
  try {
    const buf = await readFile(wadFile);
    const pal = paletteBuf || defaultPalette();
    const map = parseWad(buf, pal);
    const hit = applyWad(map);
    usingWad = true;
    dropInfo.textContent = `宸插姞杞?${wadFile.name}锛?{map.size} 寮犺创鍥撅紝鍚敤 ${hit} 寮燻;
    say('宸插垏鎹负 WAD 璐村浘');
  } catch (err) {
    dropInfo.textContent = '瑙ｆ瀽澶辫触锛? + err.message;
  }
});

// Quake/HL 椋庢牸鐏板害鍏滃簳璋冭壊鏉匡紙鏃?palette.lmp 鏃剁敤锛屼粎淇濊瘉鍙帺锛?
function defaultPalette() {
  const p = new Uint8Array(768);
  for (let i = 0; i < 256; i++) { p[i * 3] = i; p[i * 3 + 1] = i; p[i * 3 + 2] = i; }
  return p;
}

// 鑷€傚簲缂╂斁锛堜繚鎸?16:9锛屽儚绱犱笉绯婏級
function fit() {
  const r = Math.min(innerWidth / W, innerHeight / H);
  view.style.width = Math.floor(W * r) + 'px';
  view.style.height = Math.floor(H * r) + 'px';
}
addEventListener('resize', fit);
fit();
requestAnimationFrame(loop);
</script>
