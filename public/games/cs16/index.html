<!DOCTYPE html>
<!-- build-marker: cs16 self-hosted fps v3 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CS 1.6 · 网页版小游戏</title>
<style>
  :root{ --bg:#0b0e11; --panel:#12161c; --text:#e8eef2; --muted:#8b959f; --accent:#8fd6b4; --sand:#c9a76a; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;user-select:none;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #view{display:block;background:#000;image-rendering:pixelated;cursor:crosshair;
    width:100%;height:100%;max-width:100vw;max-height:100vh;}
  #boot{position:absolute;inset:0;background:rgba(8,11,14,.92);display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);z-index:20;}
  .panel{max-width:520px;padding:26px 24px;border-radius:14px;background:var(--panel);
    box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06);}
  h1{font-size:20px;letter-spacing:.5px;margin-bottom:6px;color:#fff;}
  .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;color:#c3ccd4;margin-bottom:16px;}
  .keys b{color:#fff;font-variant-numeric:tabular-nums;}
  .btn{display:inline-block;padding:10px 20px;border-radius:10px;border:0;cursor:pointer;font-size:14px;font-weight:600;
    background:#2f6f5e;color:#fff;}
  .btn:hover{background:#36806c;}
  .btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px #2a3038;color:#cfd4da;font-weight:500;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .drop{margin-top:14px;padding:12px;border:1px dashed #2f3a44;border-radius:10px;font-size:12px;color:#8b959f;text-align:center;}
  .drop.hot{border-color:var(--accent);color:var(--accent);}
  .file{font-size:12px;color:#6f7b86;margin-top:6px;}
  .texstat{font-size:11.5px;color:#8fd6b4;margin:8px 0 6px;line-height:1.6;word-break:break-all;}
  #hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-size:12px;color:#9aa5ae;
    background:rgba(10,14,18,.6);padding:6px 12px;border-radius:999px;pointer-events:none;z-index:5;opacity:.9;}
  #hint.hide{opacity:0;transition:opacity .4s;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="view"></canvas>
  <div id="hint" class="hide"></div>
  <div id="boot">
    <div class="panel">
      <h1>CS 1.6 · 网页版</h1>
      <div class="sub">de_dust 风格的浏览器内 FPS：射线投射渲染、机器人对抗、武器后坐力。</div>
      <div class="keys">
        <b>W A S D</b><span>移动　·　<b>鼠标</b>转身</span>
        <b>左键</b><span>开火　·　<b>右键</b>点射（单发）</span>
        <b>1 2 3</b><span>切换 手枪 / 步枪 / 狙</span>
        <b>R</b><span>换弹　·　<b>Shift</b>静步</span>
        <b>Esc</b><span>释放鼠标</span>
      </div>
      <div class="row">
        <button class="btn" id="start">开始游戏</button>
        <button class="btn ghost" id="full">全屏</button>
      </div>
      <div class="drop" id="drop">
        已内置 <b>de_dust2 原版贴图</b>（沙墙 / 木箱 / 铁门 / 岩石 / 水泥，取自 CS 1.6 本体，不裁剪不缩略）。
        想要更多材质可把 <b>cs_dust.wad</b> 或 <b>de_dust2.bsp</b> + <b>palette.lmp</b> 拖进来（或点这里选文件），本地解析、存在浏览器里。
        <div class="file" id="dropinfo">未加载额外贴图包：使用内置的 5 张原版贴图</div>
      </div>
      <div class="texstat" id="texstat"></div>
      <button class="btn ghost" id="cleartex" hidden>清除已存的原版贴图</button>
    </div>
  </div>
</div>
<script>window.__mfNoRestart = true;</script>
<script src="/games/kit.js"></script>
<script>
'use strict';
/* =========================================================================
   CS 1.6 风格网页 FPS —— 射线投射（raycasting）渲染
   贴图来源：优先 WAD3（用户自己提供的 cstrike.wad / halflife.wad + palette.lmp），
            没有时用内置程序化贴图（原始像素自绘，不依赖任何外部资源）
   ========================================================================= */

// ---------------------------------------------------------------- 常量
const W = 480, H = 270;                 // 内部渲染分辨率（放大到屏幕，保持像素感）
const FOV = Math.PI / 3;                // 60°
const TEX = 64;                         // 贴图边长
const MAP_W = 28, MAP_H = 24;

// 墙体类型 → 贴图索引（1..5），0 = 空地
// 1 沙墙 2 木箱 3 铁门 4 红砖 5 水泥
const MAP = (() => {
  const w = MAP_W, h = MAP_H;
  const m = new Uint8Array(w * h).fill(1);
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < w && y < h) m[y * w + x] = v; };
  // 外围清空，做成一个封闭场地
  for (let x = 1; x < w - 1; x++) for (let y = 1; y < h - 1; y++) set(x, y, 0);
  // 内部结构：一个双层长通道 + 若干掩体（dust2 中门的味道）
  for (let y = 4; y <= 19; y++) { set(10, y, 4); set(17, y, 4); }
  for (let x = 10; x <= 17; x++) { set(x, 4, 3); }
  set(13, 4, 0); set(14, 4, 0);            // 中门
  // 木箱掩体
  const box = (x, y) => { set(x, y, 2); };
  box(5, 7); box(6, 7); box(5, 8); box(6, 8);
  box(21, 14); box(22, 14); box(21, 15);
  box(13, 11); box(14, 11);
  box(4, 16); box(5, 16);
  box(23, 6); box(24, 6);
  // 边角小房间
  for (let x = 2; x <= 7; x++) { set(x, 3, 5); }
  for (let y = 3; y <= 6; y++) { set(8, y, 5); }
  set(4, 3, 0);
  return m;
})();

// ---------------------------------------------------------------- 贴图
const textures = [];        // 每项 { canvas, ctx, data, w, h }
let usingWad = false;

function mkTexCanvas() {
  const c = document.createElement('canvas');
  c.width = TEX; c.height = TEX;
  return { canvas: c, ctx: c.getContext('2d') };
}

// ------- 程序化贴图（无外部资源；模仿 dust 的沙墙/木箱/铁皮色调） -------
function rndSeed(s) { return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; }

function genSandWall(seed, base) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  const img = ctx.createImageData(TEX, TEX);
  const d = img.data;
  for (let y = 0; y < TEX; y++) {
    for (let x = 0; x < TEX; x++) {
      const i = (y * TEX + x) * 4;
      // 砖块排列：4 行 × 2 列，错缝
      const row = (y / 16) | 0;
      const off = row % 2 ? 16 : 0;
      const bx = ((x + off) % 32), by = y % 16;
      const mortar = (bx < 2) || (by < 2);
      let n = (r() - 0.5) * 22;
      const shade = 1 - (y / TEX) * 0.18;         // 顶部微亮
      let v = mortar ? base * 0.62 : base * shade;
      v += n;
      // 水泥缝的沙粒
      if (!mortar && r() > 0.93) v += 16;
      d[i] = v * 1.02; d[i + 1] = v * 0.88; d[i + 2] = v * 0.66; d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // 砖缝加深
  ctx.strokeStyle = 'rgba(40,30,18,.55)';
  ctx.lineWidth = 1;
  for (let y = 0; y < TEX; y += 16) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(TEX, y + .5); ctx.stroke(); }
  for (let y = 0; y < TEX; y += 16) {
    const off = ((y / 16) | 0) % 2 ? 16 : 0;
    for (let x = 0; x < TEX; x += 32) { ctx.beginPath(); ctx.moveTo((x + off) + .5, y); ctx.lineTo((x + off) + .5, y + 16); ctx.stroke(); }
  }
  return canvas;
}

function genCrate(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  // 木箱：外框 + 斜撑 + 木纹
  ctx.fillStyle = '#8a6a3f'; ctx.fillRect(0, 0, TEX, TEX);
  const img = ctx.getImageData(0, 0, TEX, TEX), d = img.data;
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const i = (y * TEX + x) * 4;
    const grain = Math.sin((x * 0.6 + Math.sin(y * 0.35) * 2.4)) * 10 + (r() - .5) * 14;
    d[i] += grain; d[i + 1] += grain * .8; d[i + 2] += grain * .5;
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = 'rgba(58,40,20,.9)'; ctx.lineWidth = 3; ctx.strokeRect(1.5, 1.5, TEX - 3, TEX - 3);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(TEX - 4, TEX - 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(TEX - 4, 4); ctx.lineTo(4, TEX - 4); ctx.stroke();
  ctx.strokeStyle = 'rgba(30,20,10,.6)'; ctx.lineWidth = 1; ctx.strokeRect(5.5, 5.5, TEX - 11, TEX - 11);
  return canvas;
}

function genMetalDoor(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  const g = ctx.createLinearGradient(0, 0, TEX, 0);
  g.addColorStop(0, '#3f4a52'); g.addColorStop(.5, '#59656d'); g.addColorStop(1, '#3a444b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, TEX, TEX);
  const img = ctx.getImageData(0, 0, TEX, TEX), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
  // 铆钉与横筋
  ctx.fillStyle = 'rgba(20,26,30,.75)';
  for (let x = 8; x < TEX; x += 16) for (let y = 8; y < TEX; y += 16) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(220,235,240,.10)'; ctx.fillRect(0, 14, TEX, 2); ctx.fillRect(0, 46, TEX, 2);
  ctx.strokeStyle = 'rgba(15,20,24,.85)'; ctx.lineWidth = 2; ctx.strokeRect(1.5, 1.5, TEX - 3, TEX - 3);
  return canvas;
}

function genBrickRed(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  ctx.fillStyle = '#5c2f26'; ctx.fillRect(0, 0, TEX, TEX);
  for (let y = 0; y < TEX; y += 8) {
    const off = ((y / 8) | 0) % 2 ? 8 : 0;
    for (let x = -16; x < TEX; x += 16) {
      const v = 70 + r() * 40;
      ctx.fillStyle = `rgb(${v + 32},${v * .55},${v * .42})`;
      ctx.fillRect(x + off + 1, y + 1, 14, 6);
    }
  }
  const img = ctx.getImageData(0, 0, TEX, TEX), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

function genConcrete(seed) {
  const { canvas, ctx } = mkTexCanvas();
  const r = rndSeed(seed);
  const img = ctx.createImageData(TEX, TEX), d = img.data;
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const i = (y * TEX + x) * 4;
    const v = 96 + (r() - .5) * 26 + Math.sin(x * .12) * 4 + Math.sin(y * .1) * 3;
    d[i] = v; d[i + 1] = v; d[i + 2] = v * .97; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  ctx.strokeStyle = 'rgba(40,44,48,.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 32.5); ctx.lineTo(TEX, 32.5); ctx.stroke();
  return canvas;
}

function buildProceduralTextures() {
  textures.length = 0;
  textures[1] = { canvas: genSandWall(7, 176) };
  textures[2] = { canvas: genCrate(11) };
  textures[3] = { canvas: genMetalDoor(3) };
  textures[4] = { canvas: genBrickRed(5) };
  textures[5] = { canvas: genConcrete(19) };
  // 预取 1px 宽的列切片不方便，改为直接按列 drawImage 源矩形（见 render）
}
buildProceduralTextures();

// ---------------------------------------------------------------- WAD3 解析
// 结构：头 'WAD3' + int32 numlumps + int32 infotableofs
// lump 目录项 32 字节：int32 filepos, int32 disksize, int32 size, byte type, byte compression, 2 pad, char name[16]
// type 0x43 = miptex（贴图）：char name[16], uint32 width, height, uint32 offsets[4], 然后各 mip 的 8bit 索引像素
function parseWad(buf, palette) {
  if (buf instanceof ArrayBuffer) buf = new Uint8Array(buf);
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const fourcc = String.fromCharCode(buf[0], buf[1], buf[2], buf[3]);
  if (fourcc !== 'WAD3' && fourcc !== 'WAD2') throw new Error('不是 WAD 文件');
  const numlumps = dv.getInt32(4, true);
  const infotableofs = dv.getInt32(8, true);
  const out = new Map();
  for (let i = 0; i < numlumps; i++) {
    const off = infotableofs + i * 32;
    const filepos = dv.getInt32(off, true);
    const size = dv.getInt32(off + 8, true);
    const type = dv.getUint8(off + 12);
    let name = '';
    for (let k = 0; k < 16; k++) { const ch = dv.getUint8(off + 16 + k); if (!ch) break; name += String.fromCharCode(ch); }
    if (type !== 0x43) continue;                    // 只要贴图
    try {
      const lv = new DataView(buf.buffer, buf.byteOffset + filepos, size);
      const w = lv.getUint32(16, true), h = lv.getUint32(20, true);
      const mipOff = lv.getUint32(24, true);
      if (w <= 0 || h <= 0 || w > 512 || h > 512) continue;
      const px = new Uint8Array(buf.buffer, buf.byteOffset + filepos + mipOff, w * h);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d');
      const img = cx.createImageData(w, h), d = img.data;
      for (let p = 0; p < w * h; p++) {
        const idx = px[p];
        const pi = idx * 3;
        d[p * 4] = palette[pi]; d[p * 4 + 1] = palette[pi + 1]; d[p * 4 + 2] = palette[pi + 2];
        d[p * 4 + 3] = idx === 255 ? 0 : 255;       // miptex 约定 255 = 透明
      }
      cx.putImageData(img, 0, 0);
      out.set(name.toLowerCase(), c);
    } catch (e) { /* 跳过坏 lump */ }
  }
  return out;
}

// -------- 内置原版贴图：从 de_dust2 里取出的五种墙面（palette.lmp 展开成真彩）--------
const BAKED_TEX = {
  1: 'tex/wall.png',    // csSandWall2  128x240  沙墙
  2: 'tex/crate.png',   // SandCrtLrgSd 128x128  木箱
  3: 'tex/door.png',    // SandWllDoor  192x160  铁门
  4: 'tex/rock.png',    // -0SandRock   128x256  岩石
  5: 'tex/crete.png',   // SandCCrete   256x192  水泥
  6: 'tex/floor.png',   // SandRoad     256x256  地面
};

function loadBakedTextures() {
  const slots = Object.keys(BAKED_TEX);
  let done = 0;
  try {
    if (typeof Image === 'undefined') return Promise.resolve(0);
  } catch (e) { return Promise.resolve(0); }
  return Promise.all(slots.map((slot) => new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      if (!usingWad) { textures[slot] = { canvas: img, name: '内置原版' }; done++; }
      res(true);
    };
    img.onerror = () => res(false);
    img.src = BAKED_TEX[slot];
  }))).then((oks) => {
    const hit = oks.filter(Boolean).length;
    if (hit && !usingWad) {
      texSource = 'de_dust2 原版贴图（内置）';
      const el = document.getElementById('texstat');
      if (el) el.textContent = '正在使用 de_dust2 原版贴图：沙墙 / 木箱 / 铁门 / 岩石 / 水泥（想换更多材质可拖入 cs_dust.wad 或 de_dust2.bsp）';
    }
    return hit;
  });
}

// -------- BSP30 内嵌贴图解析（de_dust2 的沙墙/岩石/门都内嵌在 .bsp 里）--------
// TEXTURE lump = int32 数量 + int32 偏移[数量]；每个 blob = name[16] + uint32 w,h + uint32 各 mip 偏移
function parseBspTextures(buf, palette) {
  if (buf instanceof ArrayBuffer) buf = new Uint8Array(buf);
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const version = dv.getInt32(0, true);
  if (version !== 30) throw new Error('不是 BSP30（版本 ' + version + '）');
  const texOfs = dv.getInt32(4 + 2 * 8, true);
  const texLen = dv.getInt32(8 + 2 * 8, true);
  const n = dv.getInt32(texOfs, true);
  if (n <= 0 || n > 4096) throw new Error('贴图表异常');
  const out = new Map();
  for (let i = 0; i < n; i++) {
    const rel = dv.getInt32(texOfs + 4 + i * 4, true);
    if (rel <= 0) continue;                       // <=0 表示外部引用（在 WAD 里）
    const p = texOfs + rel;
    if (p + 40 > texOfs + texLen) continue;
    let name = '';
    for (let k = 0; k < 16; k++) { const ch = dv.getUint8(p + k); if (!ch) break; name += String.fromCharCode(ch); }
    const w = dv.getUint32(p + 16, true), h = dv.getUint32(p + 20, true);
    const mip0 = dv.getUint32(p + 24, true);
    if (!w || !h || w > 1024 || h > 1024) continue;
    const pxStart = p + mip0;
    if (pxStart + w * h > buf.byteLength) continue;   // 没有像素数据（外部引用）
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const cx = c.getContext('2d');
    const img = cx.createImageData(w, h), d = img.data;
    for (let q = 0; q < w * h; q++) {
      const idx = buf[pxStart + q];
      const pi = idx * 3;
      d[q * 4] = palette[pi]; d[q * 4 + 1] = palette[pi + 1]; d[q * 4 + 2] = palette[pi + 2];
      d[q * 4 + 3] = idx === 255 ? 0 : 255;
    }
    cx.putImageData(img, 0, 0);
    out.set(name.toLowerCase(), c);
  }
  return out;
}

// -------- 材质槽位：按 de_dust2 的真实贴图名挑 --------
// 1 沙墙 2 箱子 3 门/铁皮 4 岩石 5 水泥/石阶
const MATERIAL_RULES = [
  { slot: 1, name: '沙墙', want: [/^cssandwall/i, /sandwallb/i, /sandwall/i, /^cs?wall/i] },
  { slot: 2, name: '木箱', want: [/sandcrtlrg/i, /mltrycrtesd/i, /sandcrtsm/i, /crate/i, /crt/i] },
  { slot: 3, name: '铁门', want: [/sandwlldoor/i, /wllwndw/i, /door/i] },
  { slot: 4, name: '岩石', want: [/sandrock/i, /rock/i] },
  { slot: 5, name: '水泥', want: [/sandccrete/i, /sandtrim/i, /crete/i, /cncr/i] },
];

function pickMaterials(map) {
  const keys = [...map.keys()];
  const chosen = [];
  const used = new Set();
  for (const rule of MATERIAL_RULES) {
    let hitName = null;
    for (const re of rule.want) {
      // 动画帧前缀（+0 -0 +a -1 …）跳过，取第一帧
      const cand = keys.filter((k) => re.test(k.replace(/^[+\-][0-9a-z]/i, '')) && !used.has(k));
      if (cand.length) {
        // 优先没有动画前缀的、名字更短的（更接近基础贴图）
        cand.sort((a, b) => {
          const pa = /^[+\-][0-9a-z]/i.test(a) ? 1 : 0;
          const pb = /^[+\-][0-9a-z]/i.test(b) ? 1 : 0;
          return pa - pb || a.length - b.length || a.localeCompare(b);
        });
        hitName = cand[0];
        break;
      }
    }
    if (hitName) {
      used.add(hitName);
      textures[rule.slot] = { canvas: map.get(hitName), name: hitName };
      chosen.push({ slot: rule.slot, label: rule.name, name: hitName });
    }
  }
  return chosen;
}

// 记录当前贴图来源，供界面显示
let texSource = '';

function applyTextureMaps(maps) {
  const merged = new Map();
  for (const m of maps) for (const [k, v] of m) if (!merged.has(k)) merged.set(k, v);
  const chosen = pickMaterials(merged);
  // 没对上的槽位：从剩余贴图里挑最大的补上，避免出现棋盘格
  const rest = [...merged.entries()].filter(([k]) => !chosen.some((c) => c.name === k))
    .sort((a, b) => b[1].width * b[1].height - a[1].width * a[1].height);
  let ri = 0;
  for (let slot = 1; slot <= 5; slot++) {
    if (chosen.some((c) => c.slot === slot)) continue;
    if (ri < rest.length) {
      textures[slot] = { canvas: rest[ri][1], name: rest[ri][0] };
      chosen.push({ slot, label: '补位', name: rest[ri][0] });
      ri++;
    }
  }
  usingWad = chosen.length > 0;
  // 地面：优先 SandRoad，其次任意 road/sand/floor 贴图
  const floorKey = [...merged.keys()].find((k) => /^sandroad$/i.test(k))
    || [...merged.keys()].find((k) => /road|ground|floor|sand$/i.test(k));
  if (floorKey) {
    textures[6] = { canvas: merged.get(floorKey), name: floorKey };
    chosen.push({ slot: 6, label: '地面', name: floorKey });
  }
  // 贴图换了，采样缓存要重建
  texPixCache.clear();
  floorImg = null;
  return { chosen, total: merged.size };
}

// ---------------------------------------------------------------- 游戏状态
const state = {
  x: 4.5, y: 20.5, a: -Math.PI / 2,        // 玩家位置/朝向
  hp: 100, armor: 100,
  weapon: 1, ammo: [0, 20, 30, 5], mag: [0, 20, 30, 5], reserve: [0, 60, 90, 15],
  kills: 0, waves: 0, dead: false, won: false,
  lastShot: 0, reloading: 0, recoil: 0, kick: 0, hitMark: 0,
  bots: [], time: 0, msg: '', msgT: 0,
};
const WEAPONS = {
  1: { name: 'Glock', dmg: 24, rate: 0.16, spread: 0.02, auto: true, reload: 1.4, pellets: 1 },
  2: { name: 'AK-47', dmg: 36, rate: 0.1, spread: 0.035, auto: true, reload: 2.3, pellets: 1 },
  3: { name: 'AWP', dmg: 115, rate: 0.7, spread: 0.004, auto: false, reload: 3.2, pellets: 1 },
};

// 碰撞
function solid(x, y) {
  const gx = x | 0, gy = y | 0;
  if (gx < 0 || gy < 0 || gx >= MAP_W || gy >= MAP_H) return true;
  return MAP[gy * MAP_W + gx] !== 0;
}
function blocked(x, y, r) {
  return solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
}

// ---------------------------------------------------------------- 机器人
function spawnWave() {
  state.waves++;
  const n = Math.min(6, 2 + state.waves);
  state.bots = [];
  const spots = [[22, 4], [24, 20], [13, 6], [3, 18], [19, 21], [7, 12]];
  for (let i = 0; i < n; i++) {
    const [sx, sy] = spots[i % spots.length];
    state.bots.push({
      x: sx + (Math.random() - .5), y: sy + (Math.random() - .5),
      hp: 100, alive: true, cd: 1 + Math.random(), speed: 1.1 + Math.random() * .5,
      hitFlash: 0, anim: Math.random() * 6,
    });
  }
  say(`第 ${state.waves} 波 · ${n} 个敌人`);
}

function say(t) { state.msg = t; state.msgT = 2.2; }

// ---------------------------------------------------------------- 输入
const keys = Object.create(null);
let pointerLocked = false;

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['Digit1', 'Digit2', 'Digit3'].includes(e.code)) {
    const w = +e.code.slice(-1);
    if (state.reserve[w] > 0 || state.mag[w] > 0) { state.weapon = w; state.reloading = 0; }
  }
  if (e.code === 'KeyR') startReload();
  if (e.code === 'Escape') pointerLocked = false;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

const view = document.getElementById('view');
view.width = W; view.height = H;
const ctx = view.getContext('2d');
ctx.imageSmoothingEnabled = false;

view.addEventListener('click', () => {
  if (!pointerLocked) { view.requestPointerLock?.(); return; }
  fire();
});
view.addEventListener('contextmenu', (e) => { e.preventDefault(); fire(true); });
view.addEventListener('mousemove', (e) => {
  if (!pointerLocked) return;
  state.a += (e.movementX || 0) * 0.0028;
});
document.addEventListener('pointerlockchange', () => { pointerLocked = document.pointerLockElement === view; });

function startReload() {
  const w = state.weapon, def = WEAPONS[w];
  if (state.reloading > 0 || state.mag[w] >= def.mag) return;
  if (state.reserve[w] <= 0) { say('没有备弹'); return; }
  state.reloading = def.reload;
}
WEAPONS[1].mag = 20; WEAPONS[2].mag = 30; WEAPONS[3].mag = 5;

// ---------------------------------------------------------------- 开火
function fire(single) {
  const now = performance.now() / 1000;
  const w = state.weapon, def = WEAPONS[w];
  if (state.dead || state.reloading > 0) return;
  if (now - state.lastShot < def.rate) return;
  if (state.mag[w] <= 0) { startReload(); return; }
  state.lastShot = now;
  state.mag[w]--;
  state.kick = 1; state.recoil = Math.min(1, state.recoil + 0.35);
  if (window.__mfKit?.sfx) window.__mfKit.sfx.shoot?.(w);

  // 射线：沿视线扫，命中最近敌人
  const spread = def.spread * (1 + state.recoil * 0.8);
  const ang = state.a + (Math.random() - .5) * spread;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let best = null, bestT = 1e9;
  for (const b of state.bots) {
    if (!b.alive) continue;
    const vx = b.x - state.x, vy = b.y - state.y;
    const t = vx * dx + vy * dy;                    // 投影距离
    if (t <= 0 || t > 26) continue;
    const perp = Math.abs(vx * dy - vy * dx);       // 垂直偏移
    if (perp > 0.42) continue;                      // 命中半径
    if (t < bestT) {
      // 墙遮挡检查
      let blockedByWall = false;
      for (let s = 0.3; s < t; s += 0.25) {
        if (solid(state.x + dx * s, state.y + dy * s)) { blockedByWall = true; break; }
      }
      if (!blockedByWall) { best = b; bestT = t; }
    }
  }
  if (best) {
    best.hp -= def.dmg * (1 + Math.random() * .2);
    best.hitFlash = 0.18;
    state.hitMark = 0.18;
    if (window.__mfKit?.sfx) window.__mfKit.sfx.hit?.();
    if (best.hp <= 0) {
      best.alive = false;
      state.kills++;
      if (window.__mfKit?.sfx) window.__mfKit.sfx.score?.();
      if (state.bots.every(x => !x.alive)) { state.won = true; }
    }
    // 轻微回推
    state.x -= dx * 0.02; state.y -= dy * 0.02;
  }
}

// ---------------------------------------------------------------- 渲染
const zBuf = new Float32Array(W);
const FLOOR_H = H * 0.5;

function castColumn(camX, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let mx = state.x | 0, my = state.y | 0;
  const ddx = Math.abs(1 / dx || 1e9), ddy = Math.abs(1 / dy || 1e9);
  let sx, sy, sdx, sdy;
  if (dx < 0) { sx = -1; sdx = (state.x - mx) * ddx; } else { sx = 1; sdx = (mx + 1 - state.x) * ddx; }
  if (dy < 0) { sy = -1; sdy = (state.y - my) * ddy; } else { sy = 1; sdy = (my + 1 - state.y) * ddy; }
  let side = 0;
  for (let i = 0; i < 64; i++) {
    if (sdx < sdy) { sdx += ddx; mx += sx; side = 0; } else { sdy += ddy; my += sy; side = 1; }
    if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return null;
    const t = MAP[my * MAP_W + mx];
    if (t) {
      const dist = side === 0 ? (sdx - ddx) : (sdy - ddy);
      let wallX = side === 0 ? state.y + dist * dy : state.x + dist * dx;
      wallX -= Math.floor(wallX);
      return { t, dist, wallX, side };
    }
  }
  return null;
}

// -------- 地面贴图（floor casting；用 SandRoad 原图，不缩放不裁剪）--------
const texPixCache = new Map();
let floorImg = null;

function texPixels(slot) {
  if (texPixCache.has(slot)) return texPixCache.get(slot);
  const t = textures[slot];
  if (!t) return null;
  const src = t.canvas;
  const w = src.width || src.naturalWidth || 0;
  const h = src.height || src.naturalHeight || 0;
  if (!w || !h) return null;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  let rec = null;
  try {
    cx.drawImage(src, 0, 0);
    rec = { w, h, px: cx.getImageData(0, 0, w, h).data };
  } catch (e) { rec = null; }
  texPixCache.set(slot, rec);
  return rec;
}

function drawFloor(horizon) {
  const tex = texPixels(6) || texPixels(5);
  if (!tex) return false;
  if (!floorImg) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    floorImg = c.getContext('2d').createImageData(W, H);
  }
  const out = floorImg.data;
  const dirX = Math.cos(state.a), dirY = Math.sin(state.a);
  const half = Math.tan(FOV / 2);
  const planeX = -dirY * half, planeY = dirX * half;
  const px = tex.px, tw = tex.w, th = tex.h;
  const y0 = Math.max(0, horizon + 1);
  for (let y = y0; y < H; y++) {
    const rowDist = (H * 0.5) / (y - horizon);
    // 地平线以下：行距 = 0.5*H / (y-horizon)
    const stepX = rowDist * 2 * planeX / W;
    const stepY = rowDist * 2 * planeY / W;
    let fx = state.x + rowDist * (dirX - planeX);
    let fy = state.y + rowDist * (dirY - planeY);
    // 远处压暗（雾）
    const fog = Math.max(0.28, 1 - rowDist * 0.045);
    let o = (y * W) * 4;
    for (let x = 0; x < W; x++) {
      let tx = (fx * tw) | 0;
      let ty = (fy * th) | 0;
      tx = ((tx % tw) + tw) % tw;
      ty = ((ty % th) + th) % th;
      const s = (ty * tw + tx) * 4;
      out[o] = px[s] * fog;
      out[o + 1] = px[s + 1] * fog;
      out[o + 2] = px[s + 2] * fog;
      out[o + 3] = 255;
      o += 4;
      fx += stepX; fy += stepY;
    }
  }
  ctx.putImageData(floorImg, 0, 0, 0, y0, W, H - y0);
  return true;
}

function render() {
  // 天空（dust2 的沙尘蓝天）+ 地面原版贴图
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#8fa3bb'); sky.addColorStop(0.7, '#bfb79a'); sky.addColorStop(1, '#cfc2a2');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H * 0.55);
  const horizon = Math.round(H / 2 + state.kick * 4);
  const floorDrawn = drawFloor(horizon);
  if (!floorDrawn) {
    const grd = ctx.createLinearGradient(0, H * 0.55, 0, H);
    grd.addColorStop(0, '#8a7551'); grd.addColorStop(1, '#4a3c28');
    ctx.fillStyle = grd; ctx.fillRect(0, H * 0.55, W, H * 0.45);
  }

  const FOV_V = FOV;
  for (let col = 0; col < W; col++) {
    const camX = (2 * col / W) - 1;
    const ang = state.a + Math.atan(camX * Math.tan(FOV_V / 2));
    const hit = castColumn(camX, ang);
    if (!hit) { zBuf[col] = 1e9; continue; }
    // 透视修正
    const perp = hit.dist * Math.cos(ang - state.a);
    zBuf[col] = perp;
    const lineH = Math.min(H * 3, (H / perp));
    const y0 = H / 2 - lineH / 2 + (state.kick * 4);
    const tex = textures[hit.t] || textures[1];
    if (!tex) continue;
    const tw = tex.canvas.width;
    let tx = Math.floor(hit.wallX * tw) % tw;
    if (hit.side === 1) tx = tw - 1 - tx;
    // 明暗：侧面墙壁调暗，远处变暗（简易雾）
    const shade = Math.min(1, 1 / (1 + perp * 0.16)) * (hit.side === 1 ? 0.78 : 1);
    ctx.globalAlpha = 1;
    ctx.drawImage(tex.canvas, tx, 0, 1, tex.canvas.height, col, y0, 1, lineH);
    if (shade < 0.999) {
      ctx.fillStyle = `rgba(0,0,0,${(1 - shade) * 0.82})`;
      ctx.fillRect(col, y0, 1, lineH);
    }
  }
  renderBots();
  renderViewmodel();
  renderHUD();
}

function renderBots() {
  const list = state.bots.filter(b => b.alive)
    .map(b => ({ b, d: Math.hypot(b.x - state.x, b.y - state.y) }))
    .sort((p, q) => q.d - p.d);
  for (const { b, d } of list) {
    const vx = b.x - state.x, vy = b.y - state.y;
    const rel = Math.atan2(vy, vx) - state.a;
    let ang = rel;
    while (ang > Math.PI) ang -= Math.PI * 2;
    while (ang < -Math.PI) ang += Math.PI * 2;
    if (Math.abs(ang) > FOV / 2 + 0.35) continue;
    const screenX = (0.5 + Math.tan(ang) / (2 * Math.tan(FOV / 2))) * W;
    const size = (H / Math.max(0.6, d)) * 0.62;
    const bottom = H / 2 + size * 0.42 + state.kick * 4;
    const top = bottom - size * 1.15;
    // 逐列深度测试
    const x0 = Math.floor(screenX - size * 0.30), x1 = Math.ceil(screenX + size * 0.30);
    const colW = Math.max(1, Math.round((x1 - x0) / 1));
    for (let px = x0; px <= x1; px++) {
      if (px < 0 || px >= W) continue;
      if (zBuf[px] < d - 0.2) continue;
      drawBotSlice(px, top, bottom, size, b, x0, x1);
    }
  }
}

function drawBotSlice(px, top, bottom, size, b, x0, x1) {
  const t = (px - x0) / Math.max(1, (x1 - x0));
  const bodyW = size * 0.5;
  // 命中反馈：整体泛红
  const flash = b.hitFlash > 0;
  const cx = x0 + (x1 - x0) * 0.5;
  const dxAbs = Math.abs(px - cx) / (bodyW / 2);
  if (dxAbs > 1) return;
  const hh = bottom - top;
  const legTop = top + hh * 0.62;
  const headR = size * 0.10;
  const headY = top + headR * 1.2;
  // 头
  if (Math.abs(px - cx) < headR * 1.6) {
    ctx.fillStyle = flash ? '#e08a7a' : '#d9b99a';
    ctx.fillRect(px, headY - headR, 1, headR * 2);
    // 头带/帽子
    ctx.fillStyle = flash ? '#c86a58' : '#3f4a52';
    ctx.fillRect(px, headY - headR, 1, headR * 0.8);
  }
  ctx.fillStyle = flash ? '#a8584a' : '#4f5d52';
  ctx.fillRect(px, top + hh * 0.26, 1, legTop - (top + hh * 0.26));
  // 腿
  ctx.fillStyle = flash ? '#8a4a3e' : '#38413c';
  ctx.fillRect(px, legTop, 1, bottom - legTop);
}

function renderViewmodel() {
  const kick = state.kick * 10 + state.recoil * 6;
  const cx = W * 0.72, cy = H - 8 + kick;
  ctx.save();
  ctx.translate(cx, cy);
  const w = state.weapon;
  if (w === 1) {                       // Glock 轮廓
    ctx.fillStyle = '#2b2f33'; ctx.fillRect(-26, -38, 30, 30);
    ctx.fillStyle = '#22262a'; ctx.fillRect(-14, -10, 18, 26);
    ctx.fillStyle = '#3a4148'; ctx.fillRect(-26, -40, 30, 5);
  } else if (w === 2) {                // AK 轮廓
    ctx.fillStyle = '#4a2f1c'; ctx.fillRect(-52, -12, 26, 16);      // 木托
    ctx.fillStyle = '#25292d'; ctx.fillRect(-30, -22, 62, 18);      // 机匣
    ctx.fillStyle = '#2e3439'; ctx.fillRect(14, -19, 44, 7);        // 枪管
    ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-6, -6, 14, 26);        // 弹匣
    ctx.fillStyle = '#1b1f22'; ctx.fillRect(24, -26, 8, 12);        // 准星
  } else {                             // AWP
    ctx.fillStyle = '#20262b'; ctx.fillRect(-46, -16, 96, 14);
    ctx.fillStyle = '#2b3640'; ctx.fillRect(-34, -24, 44, 10);      // 镜
    ctx.fillStyle = '#5a3f24'; ctx.fillRect(-58, -10, 18, 22);
    ctx.fillStyle = '#171c20'; ctx.fillRect(40, -22, 10, 8);
  }
  ctx.restore();
  // 枪口闪光
  if (state.kick > 0.55) {
    const mx = cx + (w === 2 ? 58 : w === 3 ? 50 : 2), my = cy - (w === 2 ? 16 : w === 3 ? 18 : 34) + kick;
    const g = ctx.createRadialGradient(mx, my, 0, mx, my, 26);
    g.addColorStop(0, 'rgba(255,236,170,.95)'); g.addColorStop(.4, 'rgba(255,170,60,.5)'); g.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 26, 0, 7); ctx.fill();
  }
}

function renderHUD() {
  // 准星
  const cx = W / 2, cy = H / 2 + state.kick * 3;
  const gap = 3 + state.recoil * 6;
  ctx.fillStyle = state.hitMark > 0 ? '#ff6b5e' : 'rgba(140,255,190,.92)';
  ctx.fillRect(cx - gap - 6, cy, 6, 1);
  ctx.fillRect(cx + gap, cy, 6, 1);
  ctx.fillRect(cx, cy - gap - 6, 1, 6);
  ctx.fillRect(cx, cy + gap, 1, 6);

  // 左下：生命/护甲
  ctx.font = 'bold 15px ui-monospace, Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(8, H - 52, 104, 44);
  ctx.fillStyle = state.hp > 40 ? '#9fe3b4' : '#f08a7a';
  ctx.fillText('♥ ' + Math.max(0, Math.floor(state.hp)), 14, H - 32);
  ctx.fillStyle = '#8fb8d6';
  ctx.fillText('⛨ ' + Math.max(0, Math.floor(state.armor)), 14, H - 14);

  // 右下：弹药
  const w = state.weapon, def = WEAPONS[w];
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(W - 118, H - 52, 110, 44);
  ctx.fillStyle = state.mag[w] ? '#ffe9a8' : '#f08a7a';
  ctx.font = 'bold 18px ui-monospace, Consolas, monospace';
  ctx.fillText(String(state.mag[w]), W - 60, H - 26);
  ctx.font = 'bold 12px ui-monospace, Consolas, monospace';
  ctx.fillStyle = '#9aa5ae';
  ctx.fillText('/ ' + state.reserve[w], W - 52, H - 26);
  ctx.font = '11px ui-monospace, Consolas, monospace';
  ctx.fillStyle = '#c3ccd4';
  ctx.fillText(def.name, W - 14, H - 10);
  if (state.reloading > 0) {
    ctx.fillStyle = 'rgba(255,220,140,.9)';
    ctx.textAlign = 'center';
    ctx.fillText('换弹中…', W / 2, H - 26);
  }

  // 左上：击杀数/波数
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px ui-monospace, Consolas, monospace';
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(8, 8, 128, 22);
  ctx.fillStyle = '#e8eef2';
  ctx.fillText(`击杀 ${state.kills}　波次 ${state.waves}`, 14, 23);

  // 雷达
  const RS = 54, rx = W - RS - 10, ry = 10;
  ctx.fillStyle = 'rgba(6,10,13,.62)'; ctx.fillRect(rx, ry, RS, RS);
  ctx.strokeStyle = 'rgba(140,200,170,.35)'; ctx.lineWidth = 1; ctx.strokeRect(rx + .5, ry + .5, RS - 1, RS - 1);
  const sc = RS / MAP_W;
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (MAP[y * MAP_W + x]) { ctx.fillStyle = 'rgba(150,180,200,.20)'; ctx.fillRect(rx + x * sc, ry + y * sc, sc, sc); }
  }
  for (const b of state.bots) {
    if (!b.alive) continue;
    ctx.fillStyle = '#f06a5a';
    ctx.fillRect(rx + b.x * sc - 1, ry + b.y * sc - 1, 2, 2);
  }
  ctx.fillStyle = '#9fe3b4';
  ctx.fillRect(rx + state.x * sc - 1, ry + state.y * sc - 1, 2, 2);
  ctx.strokeStyle = 'rgba(159,227,180,.8)';
  ctx.beginPath();
  ctx.moveTo(rx + state.x * sc, ry + state.y * sc);
  ctx.lineTo(rx + (state.x + Math.cos(state.a) * 3) * sc, ry + (state.y + Math.sin(state.a) * 3) * sc);
  ctx.stroke();

  // 消息
  if (state.msgT > 0) {
    ctx.globalAlpha = Math.min(1, state.msgT);
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    const tw = ctx.measureText(state.msg).width + 18;
    ctx.fillRect(W / 2 - tw / 2, 34, tw, 20);
    ctx.fillStyle = '#ffe9b0';
    ctx.fillText(state.msg, W / 2, 48);
    ctx.globalAlpha = 1;
  }

  // 死亡 / 通关
  if (state.dead || state.won) {
    ctx.fillStyle = 'rgba(6,9,12,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px system-ui, "PingFang SC", sans-serif';
    ctx.fillStyle = state.dead ? '#f08a7a' : '#9fe3b4';
    ctx.fillText(state.dead ? '你被击倒了' : `第 ${state.waves} 波清空`, W / 2, H / 2 - 14);
    ctx.font = '13px system-ui, "PingFang SC", sans-serif';
    ctx.fillStyle = '#c3ccd4';
    ctx.fillText(`击杀 ${state.kills}　按 R 重新开始`, W / 2, H / 2 + 14);
  }
}

// ---------------------------------------------------------------- 主循环
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!state.dead && !state.won) update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  state.time += dt;
  if (state.msgT > 0) state.msgT -= dt;
  if (state.hitMark > 0) state.hitMark -= dt;
  if (state.recoil > 0) state.recoil = Math.max(0, state.recoil - dt * 3.2);
  if (state.kick > 0) state.kick = Math.max(0, state.kick - dt * 6);

  // 换弹
  if (state.reloading > 0) {
    state.reloading -= dt;
    if (state.reloading <= 0) {
      const w = state.weapon, def = WEAPONS[w];
      const need = def.mag - state.mag[w];
      const take = Math.min(need, state.reserve[w]);
      state.mag[w] += take; state.reserve[w] -= take;
      state.reloading = 0;
    }
  }

  // 移动
  let mx = 0, my = 0;
  if (keys['KeyW']) my += 1;
  if (keys['KeyS']) my -= 1;
  if (keys['KeyA']) mx -= 1;
  if (keys['KeyD']) mx += 1;
  const speed = (keys['ShiftLeft'] || keys['ShiftRight'] ? 1.9 : 3.4) * dt;
  if (mx || my) {
    const len = Math.hypot(mx, my) || 1;
    const dx = (Math.cos(state.a) * my - Math.sin(state.a) * mx) / len * speed;
    const dy = (Math.sin(state.a) * my + Math.cos(state.a) * mx) / len * speed;
    if (!blocked(state.x + dx, state.y, 0.24)) state.x += dx;
    if (!blocked(state.x, state.y + dy, 0.24)) state.y += dy;
  }

  // 机器人 AI
  for (const b of state.bots) {
    if (!b.alive) continue;
    if (b.hitFlash > 0) b.hitFlash -= dt;
    b.anim += dt * 6;
    const dx = state.x - b.x, dy = state.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    // 保持 4~8 米交战距离
    let dir = 0;
    if (d > 8) dir = 1; else if (d < 3.5) dir = -1;
    if (dir) {
      const nx = b.x + (dx / d) * b.speed * dir * dt;
      const ny = b.y + (dy / d) * b.speed * dir * dt;
      if (!blocked(nx, ny, 0.26)) { b.x = nx; b.y = ny; }
    }
    // 横向游走
    const strafe = Math.sin(b.anim * 0.5) * b.speed * 0.6 * dt;
    const px = b.x + (-dy / d) * strafe, py = b.y + (dx / d) * strafe;
    if (!blocked(px, py, 0.26)) { b.x = px; b.y = py; }

    // 开火判定（视线遮挡 + 概率命中）
    b.cd -= dt;
    if (b.cd <= 0 && d < 16) {
      b.cd = 0.75 + Math.random() * 0.9;
      let visible = true;
      for (let s = 0.3; s < d; s += 0.3) if (solid(b.x + dx / d * s, b.y + dy / d * s)) { visible = false; break; }
      if (visible) {
        const acc = Math.max(0.18, 0.75 - d * 0.035);
        if (Math.random() < acc) {
          const dmg = 8 + Math.random() * 12;
          state.hp -= dmg;
          if (state.armor > 0) { state.armor = Math.max(0, state.armor - dmg * 0.5); state.hp += dmg * 0.5; }
          state.recoil = Math.min(1, state.recoil + 0.9);
          state.kick = Math.max(state.kick, 0.8);
          try { window.mfKit && window.mfKit.sfx('hit'); } catch (e) {}
          if (state.hp <= 0) {
            state.hp = 0;
            state.dead = true;
            try { window.mfhryScore && window.mfhryScore('cs16', state.kills); } catch (e) {}
            try { window.mfKit && window.mfKit.gameOver(); } catch (e) {}
          }
        }
      }
    }
  }
}

// 胜利后进入下一波
function checkWin() {
  if (state.won) {
    state.won = false;
    spawnWave();
  }
}

// ---------------------------------------------------------------- 启动 & 交互
const boot = document.getElementById('boot');
document.getElementById('start').onclick = () => {
  boot.style.display = 'none';
  spawnWave();
  state.lastShot = 0;
  view.requestPointerLock?.();
};
document.getElementById('full').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

addEventListener('keydown', (e) => {
  if (e.code === 'KeyR' && (state.dead || state.won)) {
    state.dead = false; state.hp = 100; state.armor = 100; state.kills = 0; state.waves = 0;
    state.mag = [0, 20, 30, 5]; state.reserve = [0, 60, 90, 15];
    spawnWave();
  }
});

// 循环补齐：每帧检查通关
const _render = render;
render = function () {
  if (state.won) checkWin();
  _render();
};

// ------------------------------------------------ 原版贴图载入（用户本机的游戏文件）
// 支持：cstrike.wad / cs_dust.wad / de_dust2.bsp + palette.lmp
// 全部在浏览器本地解析；解析结果连同原始字节存进 IndexedDB，下次进页面自动生效，不用再拖。
const dropEl = document.getElementById('drop');
const dropInfo = document.getElementById('dropinfo');
const texStat = document.getElementById('texstat');
const clearBtn = document.getElementById('cleartex');

const DB_NAME = 'mfhry-cs16-tex', STORE = 'files';

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(name, buf) {
  const db = await idbOpen();
  await new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(buf, name);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  db.close();
}
async function idbAll() {
  const db = await idbOpen();
  const out = await new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const st = tx.objectStore(STORE);
    const keys = st.getAllKeys(), vals = st.getAll();
    tx.oncomplete = () => res(keys.result.map((k, i) => [k, vals.result[i]]));
    tx.onerror = () => rej(tx.error);
  });
  db.close();
  return out;
}
async function idbClear() {
  const db = await idbOpen();
  await new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  db.close();
}

// entries: [[文件名, ArrayBuffer], ...]
async function buildFromFiles(entries, persist) {
  let pal = null;
  const notes = [];
  for (const [name, buf] of entries) if (/\.lmp$/i.test(name)) pal = new Uint8Array(buf.slice(0));
  const maps = [];
  let sourceNames = [];
  for (const [name, buf] of entries) {
    if (/\.lmp$/i.test(name)) continue;
    try {
      if (/\.wad$/i.test(name)) { const m = parseWad(buf, pal || defaultPalette()); maps.push(m); sourceNames.push(name + '(' + m.size + ')'); }
      else if (/\.bsp$/i.test(name)) { const m = parseBspTextures(buf, pal || defaultPalette()); maps.push(m); sourceNames.push(name + '(' + m.size + ')'); }
    } catch (e) { notes.push(name + '：' + e.message); }
  }
  if (!pal) notes.push('没有 palette.lmp，颜色会变成灰度');
  if (!maps.length) {
    dropInfo.textContent = '没读到可用贴图。' + (notes.join('；') || '请拖入 .wad 或 .bsp');
    return false;
  }
  const r = applyTextureMaps(maps);
  texSource = sourceNames.join(' + ');
  const lines = r.chosen.map((c) => `${c.label}←${c.name}`).join('　');
  texStat.textContent = `已用原版贴图 · ${r.total} 张可用 · ${lines}`;
  dropInfo.textContent = sourceNames.join(' + ') + (notes.length ? '　⚠ ' + notes.join('；') : '');
  if (clearBtn) clearBtn.hidden = false;
  say('已切换为 CS 1.6 原版贴图');
  if (persist) {
    try {
      await idbClear();
      for (const [name, buf] of entries) await idbPut(name, buf instanceof ArrayBuffer ? buf : buf.buffer);
    } catch (e) { /* 存不下不影响本次生效 */ }
  }
  return true;
}

async function handleFiles(files, persist) {
  const entries = [];
  for (const f of files) {
    if (!/\.(wad|bsp|lmp)$/i.test(f.name)) continue;
    entries.push([f.name, await f.arrayBuffer()]);
  }
  if (!entries.length) { dropInfo.textContent = '需要 .wad / .bsp / .lmp 文件'; return; }
  await buildFromFiles(entries, persist !== false);
}

dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('hot'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('hot'));
dropEl.addEventListener('drop', async (e) => {
  e.preventDefault(); dropEl.classList.remove('hot');
  await handleFiles([...e.dataTransfer.files], true);
});
dropEl.addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.accept = '.wad,.bsp,.lmp';
  inp.onchange = () => handleFiles([...inp.files], true);
  inp.click();
});
if (clearBtn) clearBtn.addEventListener('click', async () => {
  await idbClear();
  buildProceduralTextures();
  texSource = '';
  usingWad = false;
  texStat.textContent = '已清除，回到内置自绘贴图';
  clearBtn.hidden = true;
});

// 进页面时尝试恢复上次载入的原版贴图
(async function restoreTextures() {
  try {
    const saved = await idbAll();
    if (!saved.length) return;
    const entries = saved.filter(([n, b]) => b && /\.(wad|bsp|lmp)$/i.test(n));
    if (entries.length) await buildFromFiles(entries, false);
  } catch (e) { /* 隐私模式等情况下忽略 */ }
})();

// Quake/HL 风格灰度兜底调色板（无 palette.lmp 时用，仅保证可玩）
function defaultPalette() {
  const p = new Uint8Array(768);
  for (let i = 0; i < 256; i++) { p[i * 3] = i; p[i * 3 + 1] = i; p[i * 3 + 2] = i; }
  return p;
}

// 自适应缩放（保持 16:9，像素不糊）
function fit() {
  const r = Math.min(innerWidth / W, innerHeight / H);
  view.style.width = Math.floor(W * r) + 'px';
  view.style.height = Math.floor(H * r) + 'px';
}
addEventListener('resize', fit);
fit();
loadBakedTextures();
requestAnimationFrame(loop);
</script>
