<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音游 · mfhry.store</title>
<style>
  :root{--bg:#0b0e11;--panel:#151b21;--cell:#1c232b;--fg:#eaecef;--muted:#8b939c;--accent:#7fd1b0}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{width:min(96vw,560px)}
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  h1{font-size:21px}
  .stats{display:flex;gap:8px}
  .stat{background:var(--cell);border-radius:10px;padding:5px 12px;text-align:center;min-width:62px}
  .stat span{display:block;font-size:9px;color:var(--muted);letter-spacing:.08em}
  .stat b{font-size:15px;font-variant-numeric:tabular-nums}

  .stage{position:relative;background:var(--panel);border-radius:14px;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:auto}

  .panel{position:absolute;inset:0;background:rgba(9,12,15,.95);padding:14px;overflow:auto;z-index:6}
  .panel h2{font-size:13px;margin:14px 0 7px;color:var(--accent);font-weight:600;letter-spacing:.02em}
  .panel h2:first-child{margin-top:0}
  .search{display:flex;gap:6px}
  .search input{flex:1;min-width:0;padding:8px 11px;border-radius:9px;border:1px solid #2b3742;background:#141a20;
    color:var(--fg);font:inherit;font-size:13px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .search button{padding:8px 14px;border-radius:9px;border:1px solid var(--accent);background:rgba(127,209,176,.14);
    color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 11px;border-radius:999px;border:1px solid #2b3742;background:#141a20;
    font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip.on{border-color:var(--accent);color:var(--fg);background:rgba(127,209,176,.13)}
  .list{display:grid;gap:5px;margin-top:8px}
  .more{font-size:12px;color:var(--accent);cursor:pointer;padding:7px 2px 2px;user-select:none}
  .more:hover{text-decoration:underline}
  .gtitle{font-size:11px;color:#6f7883;margin:9px 0 5px;letter-spacing:.03em}
  .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;
    border:1px solid #263039;border-radius:9px;background:#141a20;cursor:pointer;font-size:12.5px;line-height:1.45}
  .item:hover{border-color:#3b4a56}
  .item small{color:var(--muted);font-size:11px}
  .item .go2{color:var(--accent);font-size:11.5px;white-space:nowrap}
  .keys{display:grid;gap:5px;margin-top:4px}
  .krow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .krow i{width:48px;font-style:normal}
  .keybtn{min-width:48px;padding:5px 9px;border-radius:8px;border:1px solid #2f3d48;background:#141a20;
    color:var(--fg);font:inherit;font-size:12.5px;cursor:pointer;text-align:center}
  .keybtn.wait{border-color:var(--accent);color:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{50%{background:rgba(127,209,176,.18)}}
  .go{width:100%;margin-top:12px;padding:11px;border-radius:11px;border:1px solid var(--accent);
    background:rgba(127,209,176,.14);color:var(--fg);font:inherit;font-size:15px;cursor:pointer;
    position:sticky;bottom:0;backdrop-filter:blur(6px)}
  .note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
  .bar{height:5px;border-radius:3px;background:#1c232b;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s}

  .result{position:absolute;inset:0;background:rgba(9,12,15,.95);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;z-index:7;padding:20px;text-align:center}
  .result.on{display:flex}
  .result h2{font-size:24px}
  .result .grade{font-size:56px;font-weight:800;line-height:1;color:var(--accent)}
  .result .nums{font-size:13px;color:var(--muted);line-height:1.8}
  .result .row{margin-top:6px;justify-content:center}
  button.ghost{padding:8px 18px;border-radius:10px;border:1px solid #33414d;background:transparent;
    color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
  button.ghost:hover{border-color:var(--accent)}
  .back{display:inline-block;margin-top:12px;font-size:12px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--fg)}
  .hint{margin-top:8px;font-size:11.5px;color:var(--muted)}
  /* 判定反馈 */
  .judge{position:absolute;left:50%;bottom:150px;transform:translate(-50%,0);
    font-weight:800;font-size:32px;letter-spacing:.03em;pointer-events:none;opacity:0;
    text-shadow:0 6px 22px rgba(0,0,0,.6);white-space:nowrap;z-index:3;text-align:center}
  .judge.pop{animation:jpop .54s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes jpop{
    0%{opacity:0;transform:translate(-50%,12px) scale(.72)}
    20%{opacity:1;transform:translate(-50%,-6px) scale(1.16)}
    40%{transform:translate(-50%,-9px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-28px) scale(.96)}
  }
  .judge .d{display:block;font-size:11.5px;font-weight:600;opacity:.75;margin-top:1px;letter-spacing:0}
  .judge.perfect{color:#7fd1b0}
  .judge.great{color:#8ec5ff}
  .judge.miss{color:#ff6b81}
  .stats .stat b{display:inline-block;transition:color .2s}
  .stats .stat b.bump{animation:cbump .26s ease}
  @keyframes cbump{0%{transform:scale(1)}38%{transform:scale(1.24)}100%{transform:scale(1)}}
  .stage.shake{animation:shake .24s ease}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}55%{transform:translate(2px,-1px)}80%{transform:translate(-1px,0)}}

  /* ---------- 电脑端 16:9 适配 ---------- */
  body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:var(--cover-bg, none) center/cover no-repeat;
    filter:blur(70px) saturate(1.25) brightness(.34);opacity:0;transition:opacity .5s}
  body.has-cover::before{opacity:1}
  body.has-cover{background:#080a0d}

  @media (min-width:960px){
    body{padding:14px 18px}
    .wrap{width:auto;max-width:1180px}
    .top{margin-bottom:12px}
    .stats{gap:10px}
    .stat{min-width:78px;padding:6px 16px}
    .stat b{font-size:18px}

    .stage{display:grid;grid-template-columns:minmax(320px,372px) auto;gap:16px;align-items:start;
      background:transparent;border-radius:0;overflow:visible}
    .stage::after{content:'';display:none}
    canvas{order:2;height:min(calc(100vh - 186px),680px);width:auto;max-width:100%;
      border-radius:16px;background:#0b0f13;box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06)}
    .judge{bottom:170px}
    .panel{order:1;position:relative;inset:auto;width:auto;max-height:min(calc(100vh - 186px),680px);
      border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(12,16,20,.82);
      -webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2);
      padding:16px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .panel[hidden]{display:none}
    .stage:has(.panel[hidden]){grid-template-columns:auto;justify-content:center}
    .stage:has(.panel[hidden]) canvas{order:1}

    .result,.pickLayer{max-height:none}
  }
  @media (min-width:960px) and (min-height:820px){
    canvas{height:min(calc(100vh - 186px),760px)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>音游</h1>
    <div class="stats">
      <div class="stat"><span>SCORE</span><b id="score">0</b></div>
      <div class="stat"><span>COMBO</span><b id="combo">0</b></div>
      <div class="stat"><span>ACC</span><b id="acc">100%</b></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" width="520" height="620"></canvas>
    <div class="judge" id="judge"></div>

    <div class="panel" id="panel">
      <h2>搜歌（谱面来自 osu! 镜像，点开才下载）</h2>
      <div class="search">
        <input id="q" type="search" placeholder="歌名 / 歌手 / 番名，例如 only my railgun" />
        <button id="search">搜索</button>
      </div>
      <div class="row" style="margin-top:7px">
        <span class="chip" id="localBtn" style="border-style:dashed">＋ 本地 .osz 文件</span>
        <span class="chip" id="hotTip" style="border:0;background:none;color:#8b939c;padding-left:0">热门：</span>
      </div>
      <div id="hot" style="margin-top:2px"></div>
      <div class="list" id="sets"></div>

      <div id="dl" hidden>
        <h2 id="dltitle">下载中</h2>
        <div class="bar"><i id="dlbar"></i></div>
        <div class="note" id="dlinfo"></div>
      </div>

      <div id="pick" hidden>
        <h2>选难度（这张图的谱面版本）</h2>
        <div class="list" id="diffs"></div>
      </div>

      <div id="setup" hidden>
        <h2>判定严格度</h2>
        <div class="row" id="strict"></div>
        <h2 id="laneTitle">轨道数</h2>
        <div class="row" id="lanesRow"></div>
        <h2>按键设置（点一下，再按你要的键）</h2>
        <div class="keys" id="keys"></div>
        <h2>判定偏移 <span id="offVal" style="color:var(--accent);font-weight:700">0 ms</span></h2>
        <input type="range" id="offRange" min="-150" max="150" step="5" value="0"
          style="width:100%;accent-color:var(--accent);margin:2px 0 4px">
        <div class="row">
          <span class="chip" id="offCal">自动校准</span>
          <span class="chip" id="soundToggle">打击音：开</span>
        </div>
        <p class="note" id="offNote">打不准先校准：按提示跟着节拍敲 8 下，自动把偏差补掉。蓝牙耳机建议先测。</p>
        <button class="go" id="start">开始</button>
      </div>

      <p class="note" id="status"></p>
      <p class="note">谱面和音乐从 osu! 镜像（osu.direct）现下现玩，下过的会缓存在本地。判定窗口按谱面的 OD 换算。</p>
    </div>

    <div class="result" id="result">
      <h2 id="rtitle">成绩</h2>
      <div class="grade" id="grade">S</div>
      <div class="nums" id="rnums"></div>
      <div class="row">
        <button class="ghost" id="again">再来一次</button>
        <button class="ghost" id="tomenu">换一首</button>
      </div>
    </div>
  </div>

  <div class="hint">键位可改 · 空格暂停 · 触屏直接点轨道</div>
  <a class="back" href="/music/">只想听歌？去音乐页 →</a><br>
  <a class="back" href="/games/">← 返回小游戏</a>
</div>

<script src="/songs.js"></script>
<script src="/games/score.js"></script>
<script>
(() => {
  'use strict';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const $ = (id) => document.getElementById(id);
  const $score = $('score'), $combo = $('combo'), $acc = $('acc');
  const panel = $('panel'), resultEl = $('result'), stage = $('stage');

  const MIRROR = 'https://osu.direct/api';
  const LS_KEYS = 'mfhry_rhythm_keys';
  const LS_PREF = 'mfhry_rhythm_pref';

  const LANE_COLORS = ['#7fd1b0', '#6fb2e8', '#e8b06f', '#e87f9a', '#b78fe8', '#8fe8c4', '#e8d78f', '#8fb8e8'];
  const DEFAULT_KEYS = {
    1: ['f'], 2: ['f', 'j'], 3: ['d', 'f', 'j'],
    4: ['d', 'f', 'j', 'k'],
    5: ['d', 'f', 'g', 'j', 'k'],
    6: ['s', 'd', 'f', 'j', 'k', 'l'],
    7: ['s', 'd', 'f', 'g', 'j', 'k', 'l'],
    8: ['a', 's', 'd', 'f', 'j', 'k', 'l', ';'],
  };
  const KEY_LABEL = (k) => (k === ';' ? ';' : k === 'space' ? '空格' : k.length === 1 ? k.toUpperCase() : k);
  // 曲单在 /songs.js（音乐页共用）
  const GROUPS = window.MFHRY_SONGS || [];

  let keys = load(LS_KEYS, DEFAULT_KEYS);
  let pref = load(LS_PREF, { lanes: 4, strict: 1, offset: 0, sound: 1 });
  const AUTO = /[?&]auto=1/.test(location.search);

  function load(k, dflt) {
    try {
      const raw = localStorage.getItem(k);
      const v = raw ? JSON.parse(raw) : null;
      return Object.assign(JSON.parse(JSON.stringify(dflt)), v || {});
    } catch (e) { return JSON.parse(JSON.stringify(dflt)); }
  }
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // ---------- 音频 ----------
  let actx = null;
  const ac = () => (actx = actx || new (window.AudioContext || window.webkitAudioContext)());

  // ---------- IndexedDB 缓存 ----------
  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('mfhry_rhythm', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('osz');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function cacheGet(k) {
    try {
      const d = await db();
      return await new Promise((res) => {
        const rq = d.transaction('osz', 'readonly').objectStore('osz').get(k);
        rq.onsuccess = () => res(rq.result || null);
        rq.onerror = () => res(null);
      });
    } catch (e) { return null; }
  }
  async function cachePut(k, v) {
    try {
      const d = await db();
      await new Promise((res) => {
        const tx = d.transaction('osz', 'readwrite');
        tx.objectStore('osz').put(v, k);
        tx.oncomplete = res; tx.onerror = res;
      });
    } catch (e) {}
  }

  // 老谱面里偶尔有非 UTF-8 的文本，兜一下
  function decodeText(bytes) {
    let s = new TextDecoder('utf-8').decode(bytes);
    if (s.indexOf('�') < 0) return s;
    for (const enc of ['gbk', 'shift_jis', 'big5', 'euc-kr']) {
      try {
        const t = new TextDecoder(enc).decode(bytes);
        if (t.indexOf('�') < 0) return t;
      } catch (e) {}
    }
    return s;
  }

  // ---------- zip ----------
  function readZip(buf) {
    const dv = new DataView(buf);
    const u8 = new Uint8Array(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('文件不是 zip');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const files = [];
    for (let i = 0; i < count; i++) {
      if (off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true);
      const elen = dv.getUint16(off + 30, true);
      const clen = dv.getUint16(off + 32, true);
      const lho = dv.getUint32(off + 42, true);
      const name = decodeText(u8.subarray(off + 46, off + 46 + nlen));
      files.push({ name, method, csize, lho });
      off += 46 + nlen + elen + clen;
    }
    return files;
  }

  async function zipEntry(buf, entry, all) {
    const dv = new DataView(buf);
    const u8 = new Uint8Array(buf);
    const lho = entry.lho;
    const nlen = dv.getUint16(lho + 26, true);
    const elen = dv.getUint16(lho + 28, true);
    let start = lho + 30 + nlen + elen;
    let csize = entry.csize;
    if (!csize) {
      // 有些 zip 用 data descriptor，长度从下一个文件头推
      const next = all.map((f) => f.lho).filter((o) => o > lho).sort((a, b) => a - b)[0];
      csize = (next || u8.length) - start - 16;
    }
    const raw = u8.subarray(start, start + csize);
    if (entry.method === 0) return raw;
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Response(raw).body.pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  // ---------- .osu 解析 ----------
  function parseOsu(text) {
    const lines = text.split(/\r?\n/);
    let section = '';
    let audio = '', mode = 0, cs = 4, od = 5, title = '', artist = '', version = '', bg = '';
    const objects = [];
    for (const raw of lines) {
      const line = raw.trim();
      if (!line || line.startsWith('//')) continue;
      if (line.startsWith('[')) { section = line; continue; }
      if (section === '[General]') {
        const m = /^([A-Za-z]+)\s*:\s*(.*)$/.exec(line);
        if (m) { if (m[1] === 'AudioFilename') audio = m[2].trim(); if (m[1] === 'Mode') mode = +m[2]; }
      } else if (section === '[Metadata]') {
        const m = /^([A-Za-z]+)\s*:\s*(.*)$/.exec(line);
        if (m) {
          if (m[1] === 'Title') title = m[2].trim();
          if (m[1] === 'Artist') artist = m[2].trim();
          if (m[1] === 'Version') version = m[2].trim();
        }
      } else if (section === '[Events]') {
        const m = /^0\s*,\s*0\s*,\s*"([^"]+)"/.exec(line);
        if (m && !bg) bg = m[1];
      } else if (section === '[Difficulty]') {
        const m = /^(CircleSize|OverallDifficulty)\s*:\s*(.*)$/.exec(line);
        if (m) { if (m[1] === 'CircleSize') cs = +m[2]; if (m[1] === 'OverallDifficulty') od = +m[2]; }
      } else if (section === '[HitObjects]') {
        const p = line.split(',');
        if (p.length < 5) continue;
        const x = +p[0], t = +p[2], type = +p[3];
        if (!((type & 1) || (type & 2) || (type & 128))) continue; // 只留能点的
        objects.push({ x, t: t / 1000 });
      }
    }
    return { audio, mode, cs, od, title, artist, version, bg, objects };
  }

  function toNotes(obj, lanes) {
    const out = [];
    for (const o of obj.objects) {
      const lane = Math.max(0, Math.min(lanes - 1, Math.floor((o.x / 512) * lanes)));
      out.push({ t: o.t, lane, judged: 0 });
    }
    out.sort((a, b) => a.t - b.t);
    return out;
  }

  // 判定窗口按 osu 的 OD 换算（mania / 标准两套公式），再乘严格度
  function windows(od, mode) {
    const p = mode === 3 ? 64 - 3 * od : 80 - 6 * od;
    const g = mode === 3 ? 97 - 3 * od : 140 - 8 * od;
    const k = [1.3, 1, 0.8][pref.strict] || 1;
    return { perfect: Math.max(0.012, (p / 1000) * k), great: Math.max(0.03, (g / 1000) * k) };
  }

  // ---------- 网上下谱面 ----------
  let songSet = null;
  let oszBuf = null;
  let charts = [];
  let chart = null;
  let audioUrl = '';

  async function searchSets(q) {
    $('status').textContent = '搜索中…';
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const r = await fetch(MIRROR + '/search?query=' + encodeURIComponent(q) + '&limit=12');
        if (!r.ok) throw new Error('镜像返回 ' + r.status);
        const list = rankSets(await r.json(), q);
        lastSets = list;
        setsOpen = false;
        renderSets(list);
        $('status').textContent = list.length
          ? '找到 ' + list.length + ' 个谱面集，点一个开始下载（几十 MB）'
          : '没搜到，换个关键词试试（英文 / 罗马音通常更准）';
        return;
      } catch (e) {
        if (attempt === 1) $('status').textContent = '搜索失败：' + e.message + '（网络不稳，再点一次）';
        else await new Promise((r) => setTimeout(r, 800));
      }
    }
  }

  // 镜像的搜索排序很杂（合集包、翻唱会挤前面），按「歌名/歌手命中」重排，别看 Tags 免得误伤
  function rankSets(list, q) {
    const norm = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const toks = norm(q).split(' ').filter((t) => t.length > 1);
    const bad = /various artists|compilation|favourites|pack|collection|megamix|medley/i;
    return list.map((s) => {
      const title = norm(s.Title), artist = norm(s.Artist);
      let k = 0;
      for (const t of toks) {
        if (title.includes(t)) k += 6;
        else if (artist.includes(t)) k += 3;
      }
      k += Math.min(6, Math.log10(1 + (s.Favourites || 0)) * 2);
      if (bad.test((s.Title || '') + ' ' + (s.Artist || ''))) k -= 5;
      if (/cover|instrumental|off vocal|karaoke|8-bit|chiptune|nightcore|remix/i.test(s.Title || '')) k -= 4;
      const lens = (s.ChildrenBeatmaps || []).map((c) => c.TotalLength || 0);
      if (lens.length && Math.max(...lens) > 480) k -= 4;   // 十几分钟的合集往后排
      return { s, k };
    }).sort((a, b) => b.k - a.k).map((x) => x.s);
  }

  const SHOW = 3;
  let lastSets = [], setsOpen = false;

  function renderSets(list) {
    const wrap = $('sets');
    wrap.innerHTML = '';
    if (!list.length) { wrap.innerHTML = '<div class="note">没搜到，换个关键词</div>'; return; }
    for (const s of (setsOpen ? list : list.slice(0, SHOW))) {
      const d = document.createElement('div');
      d.className = 'item';
      const diffs = (s.ChildrenBeatmaps || []).length;
      d.innerHTML =
        '<span>' + esc(s.Title || '?') + ' — ' + esc(s.Artist || '') +
        '<br><small>' + esc(s.Creator || '') + ' · ' + diffs + ' 个难度 · ♥ ' + (s.Favourites || 0) + '</small></span>' +
        '<span class="go2">下载 →</span>';
      d.onclick = () => loadSet(s);
      wrap.appendChild(d);
    }
    if (list.length > SHOW) {
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = setsOpen ? '收起 ↑' : '展开全部 ' + list.length + ' 个 ↓';
      more.onclick = () => { setsOpen = !setsOpen; renderSets(lastSets); };
      wrap.appendChild(more);
    }
  }

  async function loadSet(s) {
    songSet = s;
    $('pick').hidden = true;
    $('setup').hidden = true;
    $('dl').hidden = false;
    $('dltitle').textContent = s.Title + ' — ' + s.Artist;
    $('dlbar').style.width = '0%';
    $('dlinfo').textContent = '检查本地缓存…';
    try {
      oszBuf = await cacheGet('set' + s.SetID);
      if (oszBuf) {
        $('dlinfo').textContent = '缓存命中，正在解包…';
        $('dlbar').style.width = '100%';
      } else {
        oszBuf = await downloadOsz(s.SetID);
      }
      await unpack();
    } catch (e) {
      $('dlinfo').textContent = '没成功：' + e.message;
      $('status').textContent = '下载失败，换个谱面或检查网络';
    }
  }

  async function downloadOsz(id) {
    let res = null, errMsg = '';
    const urls = ['/api/mirror?id=' + id, MIRROR + '/d/' + id];
    for (let attempt = 0; attempt < 2; attempt++) {
      for (const u of urls) {
        try {
          res = await fetch(u);
          if (res.ok) break;
          errMsg = ' ' + res.status;
        } catch (e) { res = null; errMsg = ' ' + e.message; }
      }
      if (res && res.ok) break;
      await new Promise((r) => setTimeout(r, 900));
    }
    if (!res || !res.ok) throw new Error('下载失败' + errMsg);
    if (!res.body) throw new Error('这个浏览器不支持流式下载');
    const total = +res.headers.get('content-length') || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0, last = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      if (performance.now() - last > 100) {
        last = performance.now();
        const pct = total ? Math.round((got / total) * 100) : 0;
        $('dlbar').style.width = pct + '%';
        $('dlinfo').textContent = '下载中 ' + (got / 1048576).toFixed(1) + ' MB' + (total ? ' / ' + (total / 1048576).toFixed(1) + ' MB' : '');
      }
    }
    const buf = new Uint8Array(got);
    let o = 0;
    for (const c of chunks) { buf.set(c, o); o += c.length; }
    const ab = buf.buffer;
    await cachePut('set' + id, ab);
    return ab;
  }

  // ---------- 歌曲封面：轨道背后的模糊底图 ----------
  let coverUrl = '', coverImg = null, coverLayer = null;
  function buildCoverLayer() {
    coverLayer = null;
    window.__rhythmCover = null;
    if (!coverImg || !coverImg.naturalWidth) return;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const k = Math.max((W * 1.14) / coverImg.naturalWidth, (H * 1.14) / coverImg.naturalHeight);
    const dw = coverImg.naturalWidth * k, dh = coverImg.naturalHeight * k;
    try {
      g.filter = 'blur(20px) saturate(1.35) brightness(1.38)';
      g.drawImage(coverImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    } catch (e) {
      g.filter = 'none';
      g.drawImage(coverImg, (W - dw) / 2, (H - dh) / 2, dw, dh);
    }
    g.filter = 'none';
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(9,12,16,.56)');
    grad.addColorStop(0.42, 'rgba(10,13,17,.34)');
    grad.addColorStop(1, 'rgba(7,9,12,.66)');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    coverLayer = c;
    window.__rhythmCover = { w: coverImg.naturalWidth, h: coverImg.naturalHeight };
  }
  async function setCoverBytes(bytes, name) {
    const type = /\.png$/i.test(name || '') ? 'image/png'
      : /\.webp$/i.test(name || '') ? 'image/webp'
      : /\.gif$/i.test(name || '') ? 'image/gif' : 'image/jpeg';
    if (coverUrl) { try { URL.revokeObjectURL(coverUrl); } catch (e) {} }
    coverUrl = URL.createObjectURL(new Blob([bytes], { type }));
    const img = new Image();
    img.decoding = 'async';
    await new Promise((res) => { img.onload = res; img.onerror = res; img.src = coverUrl; });
    coverImg = img.naturalWidth ? img : null;
    buildCoverLayer();
    if (coverImg) {
      document.body.classList.add('has-cover');
      document.body.style.setProperty('--cover-bg', 'url("' + coverUrl + '")');
    }
  }
  async function loadCover(obj) {
    try {
      const id = songSet && songSet.SetID ? String(songSet.SetID) : '';
      if (id) {
        const cached = await cacheGet('bg:' + id);
        if (cached && cached.byteLength) { await setCoverBytes(cached, 'cached.jpg'); return; }
      }
      const nm = String((obj && obj.bg) || '').toLowerCase();
      let entry = nm
        ? zipAll.find((f) => f.name.toLowerCase() === nm || f.name.toLowerCase().endsWith('/' + nm))
        : null;
      if (!entry) {
        entry = zipAll
          .filter((f) => /\.(jpe?g|png|webp|gif)$/i.test(f.name) && !/\/(hitsounds?|samples?)\//i.test(f.name))
          .sort((a, b) => (b.csize || 0) - (a.csize || 0))[0];
      }
      if (!entry) return;
      const bytes = await zipEntry(oszBuf, entry, zipAll);
      if (id && bytes.byteLength) { try { await cachePut('bg:' + id, bytes.buffer); } catch (e) {} }
      await setCoverBytes(bytes, entry.name);
    } catch (e) { /* 没封面就保持纯色底 */ }
  }

  let zipAll = [];
  async function unpack() {
    const files = readZip(oszBuf);
    zipAll = files;
    const osuFiles = files.filter((f) => f.name.toLowerCase().endsWith('.osu'));
    if (!osuFiles.length) throw new Error('包里没有 .osu 谱面');
    charts = [];
    for (const f of osuFiles) {
      const bytes = await zipEntry(oszBuf, f, files);
      const obj = parseOsu(decodeText(bytes));
      charts.push({ file: f, obj, name: obj.version || f.name.replace(/\.osu$/i, '') });
    }
    await ensureAudio(charts[0].obj);
    $('dlinfo').textContent = '下载完成 · 音乐 ' + Math.round(songLen) + ' 秒 · 共 ' + charts.length + ' 个难度';
    $('dlbar').style.width = '100%';
    $('dl').hidden = true;
    renderDiffs();
    $('pick').hidden = false;
  }

  let loadedAudio = '';
  async function ensureAudio(obj) {
    if (buf && loadedAudio === obj.audio) return;
    const af = zipAll.find((f) => f.name.toLowerCase() === String(obj.audio).toLowerCase()) ||
               zipAll.find((f) => /\.(mp3|ogg|wav)$/i.test(f.name));
    if (!af) throw new Error('包里没有音频');
    await setAudio(await zipEntry(oszBuf, af, zipAll));
    loadedAudio = obj.audio;
  }

  async function setAudio(bytes) {
    const blob = new Blob([bytes]);
    if (audioUrl) URL.revokeObjectURL(audioUrl);
    audioUrl = URL.createObjectURL(blob);
    const ab = await (await fetch(audioUrl)).arrayBuffer();
    buf = await ac().decodeAudioData(ab);
    songLen = buf.duration;
  }

  function renderDiffs() {
    const wrap = $('diffs');
    wrap.innerHTML = '';
    const rank = (m) => (m === 3 ? 0 : m === 0 ? 1 : m === 1 ? 2 : 3);
    charts = charts.map((c, i) => ({ c, i })).sort((a, b) => rank(a.c.obj.mode) - rank(b.c.obj.mode) || b.c.obj.objects.length - a.c.obj.objects.length).map((x) => x.c);
    charts.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      const modeTxt = ['std', 'taiko', 'catch', 'mania'][c.obj.mode] || 'std';
      d.innerHTML = '<span>' + esc(c.name) + '<br><small>' + modeTxt + ' · ' +
        (c.obj.mode === 3 ? Math.round(c.obj.cs) + 'K · ' : '') + c.obj.objects.length + ' 个物件 · OD ' + c.obj.od + '</small></span><span class="go2">选这个</span>';
      d.onclick = () => chooseChart(i);
      wrap.appendChild(d);
    });
  }

  async function chooseChart(i) {
    chart = charts[i];
    curLanes = chart.obj.mode === 3 ? Math.max(1, Math.min(8, Math.round(chart.obj.cs))) : pref.lanes;
    $('status').textContent = '准备音频…';
    try {
      await ensureAudio(chart.obj);
    } catch (e) {
      $('status').textContent = '音频加载失败：' + e.message;
      return;
    }
    $('pick').hidden = true;
    $('setup').hidden = false;
    loadCover(chart.obj);
    $('status').textContent = '已选：' + (chart.obj.title || '') + ' [' + chart.name + '] · ' +
      Math.round(songLen) + ' 秒 · ' + chart.obj.objects.length + ' 个音符';
    renderStrict(); renderLanes(); renderKeys(); renderOffset();
  }

  // ---------- 状态 ----------
  let state = 'menu';
  let notes = [];
  let buf = null, src = null, gain = null;
  let startAt = 0, songTime = -3, songLen = 0;
  let stats = null, hp = 100;
  let pressed = {}, capturing = -1;
  let curLanes = 4;

  // ---------- 击打反馈 ----------
  const judgeEl = $('judge');
  const fx = [];
  function addFx(lane, kind) {
    fx.push({ lane, kind, at: performance.now() });
    if (fx.length > 48) fx.shift();
  }
  function popJudge(kind, deltaMs) {
    const label = kind === 'perfect' ? 'PERFECT' : kind === 'great' ? 'GREAT' : 'MISS';
    let sub = '';
    if (kind !== 'miss' && deltaMs != null && Math.abs(deltaMs) >= 1) {
      sub = '<span class="d">' + (deltaMs > 0 ? '晚 ' : '早 ') + Math.abs(Math.round(deltaMs)) + ' ms</span>';
    }
    judgeEl.className = 'judge ' + kind;
    judgeEl.innerHTML = label + sub;
    void judgeEl.offsetWidth;
    judgeEl.classList.add('pop');
    if (kind === 'miss') {
      const st = $('stage');
      st.classList.remove('shake');
      void st.offsetWidth;
      st.classList.add('shake');
    }
  }

  // ---------- 打击音 ----------
  let hsCtx = null;
  function tick(kind) {
    if (!pref.sound) return;
    try {
      hsCtx = hsCtx || new (window.AudioContext || window.webkitAudioContext)();
      const a = hsCtx, t0 = a.currentTime;
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(kind === 'perfect' ? 1720 : kind === 'great' ? 1240 : 620, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(kind === 'miss' ? 0.03 : 0.055, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.055);
      o.connect(g).connect(a.destination);
      o.start(t0); o.stop(t0 + 0.06);
    } catch (e) {}
  }

  const offSec = () => (Number(pref.offset) || 0) / 1000;
  const now = () => ac().currentTime;
  const laneW = () => W / curLanes;
  const HIT_Y = H - 96;

  // ---------- 渲染 ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (coverLayer) {
      ctx.drawImage(coverLayer, 0, 0);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0f151b');
      g.addColorStop(1, '#0a0d10');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    const lw = laneW();
    for (let i = 0; i < curLanes; i++) {
      const x = i * lw;
      ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.022)' : 'rgba(255,255,255,.04)';
      ctx.fillRect(x, 0, lw, H);
      ctx.strokeStyle = 'rgba(255,255,255,.05)';
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      if (pressed[i] && performance.now() - pressed[i] < 110) {
        ctx.fillStyle = 'rgba(127,209,176,.14)';
        ctx.fillRect(x, HIT_Y - 40, lw, H - HIT_Y + 40);
      }
      const kb = keys[curLanes] || DEFAULT_KEYS[curLanes] || [];
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.font = '13px -apple-system,PingFang SC,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(KEY_LABEL(kb[i] || ''), x + lw / 2, H - 24);
    }

    ctx.fillStyle = 'rgba(127,209,176,.18)';
    ctx.fillRect(0, HIT_Y - 2, W, 4);
    ctx.strokeStyle = 'rgba(127,209,176,.7)';
    ctx.beginPath(); ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();

    const tNow = performance.now();
    for (let i = fx.length - 1; i >= 0; i--) {
      const f = fx[i];
      const life = f.kind === 'miss' ? 420 : 220;
      const age = tNow - f.at;
      if (age > life) { fx.splice(i, 1); continue; }
      const k = 1 - age / life;
      const fxX = f.lane * lw;
      if (f.kind === 'miss') {
        ctx.fillStyle = 'rgba(255,80,110,' + (0.30 * k).toFixed(3) + ')';
        ctx.fillRect(fxX, 0, lw, H);
        ctx.fillStyle = 'rgba(255,80,110,' + (0.85 * k).toFixed(3) + ')';
        ctx.fillRect(fxX, HIT_Y - 2, lw, 4);
      } else {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.20 * k).toFixed(3) + ')';
        ctx.fillRect(fxX, HIT_Y - 46, lw, 62);
        const r = 12 + (1 - k) * lw * 0.55;
        ctx.strokeStyle = 'rgba(127,209,176,' + (0.5 * k).toFixed(3) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(fxX + lw / 2, HIT_Y, r, Math.max(3, r * 0.3), 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    const pxPerSec = H * [0.62, 0.85, 1.1][pref.strict];
    for (const n of notes) {
      if (n.judged) continue;
      const y = HIT_Y - (n.t - songTime) * pxPerSec;
      if (y < -40 || y > H + 40) continue;
      const x = n.lane * lw + 6;
      ctx.fillStyle = LANE_COLORS[n.lane % LANE_COLORS.length];
      roundRect(x, y - 8, lw - 12, 16, 6);
      ctx.fill();
    }

    if (songLen > 0 && (state === 'playing' || state === 'paused' || state === 'countdown')) {
      const p = Math.max(0, Math.min(1, songTime / songLen));
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      ctx.fillRect(0, 0, W, 3);
      ctx.fillStyle = 'rgba(127,209,176,.85)';
      ctx.fillRect(0, 0, W * p, 3);
    }

    if (state === 'countdown') {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#eaecef';
      ctx.font = '700 64px -apple-system,PingFang SC,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(Math.max(1, Math.ceil(-songTime))), W / 2, H / 2);
    }
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#eaecef';
      ctx.font = '600 26px -apple-system,PingFang SC,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('已暂停', W / 2, H / 2 - 10);
      ctx.font = '13px -apple-system,PingFang SC,sans-serif';
      ctx.fillStyle = '#8b939c';
      ctx.fillText('空格 / 点这里继续', W / 2, H / 2 + 22);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- 循环 ----------
  let raf = 0;
  function loop() {
    raf = requestAnimationFrame(loop);
    if (state === 'playing' || state === 'countdown') {
      songTime = now() - startAt;
      if (state === 'countdown' && songTime >= 0) state = 'playing';
      if (state === 'playing') {
        const w = windows(chart.obj.od, chart.obj.mode);
        for (const n of notes) {
          if (n.judged) continue;
          if (AUTO && Math.abs(n.t - (songTime + offSec())) < 0.016) { press(n.lane); continue; }
          if (songTime + offSec() - n.t > w.great) judge(n, 'miss');
        }
        if (notes.length && songTime > notes[notes.length - 1].t + 2.5) return finish(false);
        if (hp <= 0) return finish(true);
      }
      draw();
      updateHud();
    } else if (state === 'paused') {
      draw();
    }
  }

  function updateHud() {
    if (!stats) return;
    $score.textContent = stats.score;
    $combo.textContent = stats.combo;
    const total = stats.perfect + stats.great + stats.miss;
    const acc = total ? ((stats.perfect + stats.great * 0.55) / total) * 100 : 100;
    $acc.textContent = acc.toFixed(1) + '%';
  }

  function judge(n, kind) {
    if (n.judged) return;
    n.judged = 1;
    addFx(n.lane, kind === 'miss' ? 'miss' : 'hit');
    popJudge(kind, n.delta);
    tick(kind);
    const cb = $('combo');
    if (kind === 'miss') {
      stats.miss++;
      stats.combo = 0;
      hp = Math.max(0, hp - 5);
      cb.textContent = '0';
      cb.style.color = '#ff6b81';
      setTimeout(() => { cb.style.color = ''; }, 260);
      return;
    }
    stats[kind]++;
    stats.combo++;
    stats.maxCombo = Math.max(stats.maxCombo, stats.combo);
    stats.score += Math.round((kind === 'perfect' ? 300 : 160) * (1 + Math.min(0.5, stats.combo / 200)));
    if (kind === 'perfect') hp = Math.min(100, hp + 0.3);
    cb.textContent = String(stats.combo);
    cb.classList.remove('bump');
    void cb.offsetWidth;
    cb.classList.add('bump');
  }

  function press(lane) {
    if (state !== 'playing' || !chart) return;
    pressed[lane] = performance.now();
    const w = windows(chart.obj.od, chart.obj.mode);
    const t = songTime + offSec();
    let best = null, bestAbs = 1e9;
    for (const n of notes) {
      if (n.judged || n.lane !== lane) continue;
      const abs = Math.abs(n.t - t);
      if (abs < bestAbs) { bestAbs = abs; best = n; }
      if (n.t > t + 0.3) break;
    }
    if (!best) return;
    best.delta = (t - best.t) * 1000;
    if (bestAbs <= w.perfect) judge(best, 'perfect');
    else if (bestAbs <= w.great) judge(best, 'great');
  }

  $('offRange').addEventListener('input', (e) => {
    pref.offset = Number(e.target.value) || 0;
    save(LS_PREF, pref);
    $('offVal').textContent = (pref.offset > 0 ? '+' : '') + pref.offset + ' ms';
  });
  $('offCal').addEventListener('click', () => { calibrate(); });
  $('soundToggle').addEventListener('click', () => {
    pref.sound = pref.sound ? 0 : 1;
    save(LS_PREF, pref);
    renderOffset();
    if (pref.sound) tick('perfect');
  });

  // ---------- 开始 / 结束 ----------
  async function startGame() {
    if (!chart || !buf) return;
    cancelAnimationFrame(raf);
    panel.hidden = true;
    resultEl.classList.remove('on');
    try {
      const a = ac();
      if (a.state === 'suspended') await a.resume();
    } catch (e) { alert('这个浏览器不支持 WebAudio'); return; }

    notes = toNotes(chart.obj, curLanes);
    if (!notes.length) { alert('这张谱面里没有可点的音符'); panel.hidden = false; return; }
    stats = { score: 0, combo: 0, maxCombo: 0, perfect: 0, great: 0, miss: 0 };
    hp = 100; pressed = {};
    $score.textContent = '0'; $combo.textContent = '0'; $acc.textContent = '100%';

    if (!gain) { gain = ac().createGain(); gain.gain.value = 0.9; gain.connect(ac().destination); }
    if (src) { try { src.stop(); } catch (e) {} }
    src = ac().createBufferSource();
    src.buffer = buf;
    src.connect(gain);
    startAt = ac().currentTime + 3.0;
    songTime = -3.0;
    src.start(startAt);
    state = 'countdown';
    raf = requestAnimationFrame(loop);
  }

  function finish(failed) {
    state = 'result';
    cancelAnimationFrame(raf);
    try { if (src) src.stop(); } catch (e) {}
    src = null;
    showResult(failed);
  }

  function showResult(failed) {
    let best = 0;
    try { best = +(localStorage.getItem('mfhry_rhythm_best') || 0); } catch (e) {}
    if (stats.score > best) {
      best = stats.score;
      try { localStorage.setItem('mfhry_rhythm_best', String(best)); } catch (e) {}
    }
    const total = stats.perfect + stats.great + stats.miss;
    const acc = total ? ((stats.perfect + stats.great * 0.55) / total) * 100 : 0;
    let grade = 'D';
    if (acc >= 97 && !stats.miss) grade = 'S';
    else if (acc >= 93) grade = 'A';
    else if (acc >= 86) grade = 'B';
    else if (acc >= 74) grade = 'C';
    if (failed) grade = 'F';
    $('grade').textContent = grade;
    $('rtitle').textContent = failed ? '血条空了…' : '完成！';
    $('rnums').innerHTML =
      '得分 <b>' + stats.score + '</b> · 最大连击 <b>' + stats.maxCombo + '</b><br>' +
      'Perfect ' + stats.perfect + ' · Great ' + stats.great + ' · Miss ' + stats.miss + '<br>' +
      '准确率 ' + acc.toFixed(1) + '% · 最高分 ' + best;
    resultEl.classList.add('on');
    if (stats.score > 0 && !AUTO) window.mfhryScore && window.mfhryScore('rhythm', stats.score);
  }

  // ---------- 输入 ----------
  function laneFromKey(k) {
    const kb = keys[curLanes] || DEFAULT_KEYS[curLanes] || [];
    return kb.map((x) => x.toLowerCase()).indexOf(k.toLowerCase());
  }

  window.addEventListener('keydown', (e) => {
    if (capturing >= 0) {
      e.preventDefault();
      const k = e.key === ' ' ? 'space' : e.key.toLowerCase();
      if (k === 'escape') { capturing = -1; renderKeys(); return; }
      const arr = keys[curLanes];
      const dup = arr.indexOf(k);
      if (dup >= 0 && dup !== capturing) arr[dup] = arr[capturing];
      arr[capturing] = k;
      capturing = -1;
      save(LS_KEYS, keys);
      renderKeys();
      return;
    }
    if (e.key === ' ' || e.key === 'Escape') {
      if (state === 'playing') { pause(); e.preventDefault(); return; }
      if (state === 'paused') { resume(); e.preventDefault(); return; }
    }
    if (state !== 'playing') return;
    const lane = laneFromKey(e.key);
    if (lane >= 0) { e.preventDefault(); press(lane); }
  });

  function pause() {
    if (state !== 'playing') return;
    state = 'paused';
    try { if (actx) actx.suspend(); } catch (e) {}
    draw();
  }
  function resume() {
    if (state !== 'paused') return;
    try { if (actx) actx.resume(); } catch (e) {}
    state = 'playing';
  }

  stage.addEventListener('pointerdown', (e) => {
    if (state === 'paused') { resume(); return; }
    if (state !== 'playing') return;
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) * (W / r.width);
    press(Math.max(0, Math.min(curLanes - 1, Math.floor(x / laneW()))));
  });

  // ---------- 设置界面 ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function renderHot() {
    const wrap = $('hot');
    wrap.innerHTML = '';
    for (const g of GROUPS) {
      const t = document.createElement('div');
      t.className = 'gtitle';
      t.textContent = g.title;
      wrap.appendChild(t);
      const row = document.createElement('div');
      row.className = 'row';
      for (const h of g.items) {
        const b = document.createElement('span');
        b.className = 'chip';
        b.textContent = h.label;
        b.onclick = () => { $('q').value = h.label; searchSets(h.q); };
        row.appendChild(b);
      }
      wrap.appendChild(row);
    }
  }

  function renderOffset() {
    const v = Number(pref.offset) || 0;
    $('offVal').textContent = (v > 0 ? '+' : '') + v + ' ms';
    $('offRange').value = String(v);
    $('soundToggle').textContent = '打击音：' + (pref.sound ? '开' : '关');
    $('soundToggle').classList.toggle('on', !!pref.sound);
  }

  async function calibrate() {
    const note = $('offNote');
    note.textContent = '听节拍，跟着敲 8 下…';
    const bpm = 120, gap = 60000 / bpm, beats = 8;
    const taps = [];
    const onTap = (e) => {
      if (e && e.target && e.target.closest && e.target.closest('#offCal')) return;
      taps.push(performance.now());
    };
    document.addEventListener('pointerdown', onTap, true);
    document.addEventListener('keydown', onTap, true);
    const t0 = performance.now() + 700;
    const beatAt = [];
    for (let i = 0; i < beats; i++) {
      const at = t0 + i * gap;
      beatAt.push(at);
      setTimeout(() => tick('perfect'), Math.max(0, at - performance.now()));
    }
    await new Promise((r) => setTimeout(r, beats * gap + 600));
    document.removeEventListener('pointerdown', onTap, true);
    document.removeEventListener('keydown', onTap, true);
    const deltas = [];
    for (const t of taps) {
      let best = Infinity;
      for (const b of beatAt) { const d = t - b; if (Math.abs(d) < Math.abs(best)) best = d; }
      if (Math.abs(best) <= 200) deltas.push(best);
    }
    if (deltas.length < 4) {
      note.textContent = '只收到 ' + deltas.length + ' 次有效敲击，再来一次（跟着响的那一下敲）。';
      return;
    }
    deltas.sort((a, b) => a - b);
    const median = deltas[Math.floor(deltas.length / 2)];
    const next = Math.max(-150, Math.min(150, Math.round((-median) / 5) * 5));
    pref.offset = next; save(LS_PREF, pref); renderOffset();
    note.textContent = '检测到平均' + (median > 0 ? '偏晚 ' : '偏早 ') + Math.abs(Math.round(median)) +
      ' ms，已设偏移 ' + (next > 0 ? '+' : '') + next + ' ms（' + deltas.length + ' 次采样）。';
  }

  function renderStrict() {
    const wrap = $('strict');
    wrap.innerHTML = '';
    ['宽松', '标准', '严格'].forEach((name, i) => {
      const b = document.createElement('span');
      b.className = 'chip' + (pref.strict === i ? ' on' : '');
      b.textContent = name;
      b.onclick = () => { pref.strict = i; save(LS_PREF, pref); renderStrict(); };
      wrap.appendChild(b);
    });
  }

  function renderLanes() {
    const wrap = $('lanesRow');
    const fixed = chart && chart.obj.mode === 3;
    $('laneTitle').textContent = fixed ? '轨道数（这张图固定 ' + curLanes + 'K）' : '轨道数';
    wrap.innerHTML = '';
    [4, 5, 6, 7, 8].forEach((n) => {
      const b = document.createElement('span');
      b.className = 'chip' + (curLanes === n ? ' on' : '');
      b.textContent = n + ' 轨';
      b.style.opacity = fixed && curLanes !== n ? 0.4 : 1;
      b.onclick = () => {
        if (fixed) return;
        pref.lanes = n; curLanes = n; save(LS_PREF, pref); renderLanes(); renderKeys();
      };
      wrap.appendChild(b);
    });
  }

  function renderKeys() {
    if (!keys[curLanes]) keys[curLanes] = (DEFAULT_KEYS[curLanes] || []).slice();
    const wrap = $('keys');
    wrap.innerHTML = '';
    keys[curLanes].forEach((k, i) => {
      const row = document.createElement('div');
      row.className = 'krow';
      const label = document.createElement('i');
      label.textContent = '第 ' + (i + 1) + ' 轨';
      label.style.color = LANE_COLORS[i % LANE_COLORS.length];
      const b = document.createElement('button');
      b.className = 'keybtn' + (capturing === i ? ' wait' : '');
      b.textContent = capturing === i ? '按键…' : KEY_LABEL(k);
      b.onclick = () => { capturing = i; renderKeys(); };
      row.appendChild(label); row.appendChild(b);
      wrap.appendChild(row);
    });
  }

  // 本地导入 .osz（自己从 osu 官网下的包）
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.osz,.zip';
  fileInput.hidden = true;
  document.body.appendChild(fileInput);
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    $('dl').hidden = false;
    $('dltitle').textContent = f.name;
    $('dlinfo').textContent = '读取本地文件…';
    $('dlbar').style.width = '30%';
    try {
      oszBuf = await f.arrayBuffer();
      $('dlbar').style.width = '100%';
      await unpack();
      $('status').textContent = '已载入本地谱面包：' + f.name;
    } catch (e) {
      $('dlinfo').textContent = '这个包打不开：' + e.message;
    }
  });

  // ---------- 绑定 ----------
  $('search').onclick = () => {
    const q = $('q').value.trim();
    if (q) searchSets(q);
  };
  $('q').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); const q = $('q').value.trim(); if (q) searchSets(q); }
  });
  $('localBtn').onclick = () => fileInput.click();
  $('start').onclick = startGame;
  $('again').onclick = () => { resultEl.classList.remove('on'); startGame(); };
  $('tomenu').onclick = () => {
    resultEl.classList.remove('on');
    panel.hidden = false;
    state = 'menu';
    cancelAnimationFrame(raf);
    draw();
  };

  // 调试 / 自动化
  window.__rhythm = {
    state: () => state,
    notes: () => notes.length,
    stats: () => stats,
    time: () => songTime,
    lanes: () => curLanes,
    keys: () => (keys[curLanes] || []).slice(),
    openLocal: () => fileInput.click(),
    search: (q) => searchSets(q),
  };

  // ---------- 启动 ----------
  renderHot(); renderStrict(); renderLanes(); renderKeys(); renderOffset();
  draw();
  requestAnimationFrame(loop);
})();
</script>
<script src="/errlog.js"></script>
</body>
</html>
