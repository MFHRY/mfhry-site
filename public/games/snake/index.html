<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>贪吃蛇 · mfhry.store</title>
<style>
  :root{--bg:#0b0e11;--fg:#eaecef;--muted:#8b939c;--accent:#7fd1b0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .wrap{width:min(94vw,520px)}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  h1{font-size:22px}
  .stat{background:#161d24;border-radius:10px;padding:6px 14px;font-size:14px}
  .stat b{color:var(--accent)}
  .stage{position:relative;border-radius:14px;overflow:hidden;background:#121820}
  canvas{display:block;width:100%;height:auto;touch-action:none}
  .overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center}
  .overlay.on{display:flex}
  .overlay h2{font-size:20px}
  button{font:inherit;padding:9px 22px;border-radius:10px;border:1px solid var(--accent);
    background:transparent;color:var(--fg);cursor:pointer}
  button:hover{background:rgba(127,209,176,.12)}
  .hint{margin-top:10px;font-size:12px;color:var(--muted)}
  .back{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>贪吃蛇</h1>
    <div class="stat">分数 <b id="score">0</b> · 最高 <b id="best">0</b></div>
  </div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="ov"><h2 id="ovt">准备开始</h2><button id="btn">开始</button></div>
  </div>
  <div class="hint">方向键 / WASD 控制，手机可滑动</div>
  <a class="back" href="/games/">← 返回小游戏</a>
</div>
<script>
(() => {
  const N = 20;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const ov = document.getElementById('ov'), ovt = document.getElementById('ovt'), btn = document.getElementById('btn');

  let cell = 22, snake, dir, nextDir, food, score, best = +(localStorage.getItem('mfhry_snake_best') || 0), timer = null, speed = 150;
  $best.textContent = best;

  function fit() {
    const w = cv.parentElement.clientWidth;
    cell = Math.floor(w / N);
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = N * cell * dpr;
    cv.height = N * cell * dpr;
    cv.style.width = N * cell + 'px';
    cv.style.height = N * cell + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function start() {
    fit();
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = { ...dir };
    score = 0; speed = 150;
    $score.textContent = 0;
    placeFood();
    ov.classList.remove('on');
    clearInterval(timer);
    timer = setInterval(tick, speed);
    draw();
  }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some((s) => s.x === head.x && s.y === head.y)) {
      clearInterval(timer);
      ovt.textContent = '结束 · 得分 ' + score;
      btn.textContent = '再来';
      ov.classList.add('on');
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      $score.textContent = score;
      if (score > best) { best = score; $best.textContent = best; localStorage.setItem('mfhry_snake_best', best); }
      placeFood();
      if (speed > 70) { speed -= 4; clearInterval(timer); timer = setInterval(tick, speed); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, N * cell, N * cell);
    ctx.fillStyle = '#121820';
    ctx.fillRect(0, 0, N * cell, N * cell);
    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,.025)';
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, N * cell); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(N * cell, i * cell); ctx.stroke();
    }
    // 食物
    ctx.fillStyle = '#e8735a';
    ctx.beginPath();
    ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.32, 0, Math.PI * 2);
    ctx.fill();
    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#7fd1b0' : `rgba(127,209,176,${0.75 - i * 0.02})`;
      const pad = i === 0 ? 1.5 : 2.5;
      ctx.beginPath();
      ctx.roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, 4);
      ctx.fill();
    });
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    const set = (x, y) => { if (dir.x + x !== 0 || dir.y + y !== 0) nextDir = { x, y }; };
    if (k === 'arrowleft' || k === 'a') set(-1, 0);
    else if (k === 'arrowright' || k === 'd') set(1, 0);
    else if (k === 'arrowup' || k === 'w') set(0, -1);
    else if (k === 'arrowdown' || k === 's') set(0, 1);
    else return;
    e.preventDefault();
  });

  let sx = 0, sy = 0;
  cv.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) { if (dir.x === 0) nextDir = { x: dx > 0 ? 1 : -1, y: 0 }; }
    else { if (dir.y === 0) nextDir = { x: 0, y: dy > 0 ? 1 : -1 }; }
  });

  btn.addEventListener('click', start);
  window.addEventListener('resize', () => { fit(); if (snake) draw(); });

  fit();
  ctx.fillStyle = '#121820';
  ctx.fillRect(0, 0, N * cell, N * cell);
  ovt.textContent = '贪吃蛇';
  btn.textContent = '开始';
  ov.classList.add('on');
})();
</script>
</body>
</html>
