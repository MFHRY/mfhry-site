<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>记忆翻牌 · mfhry.store</title>
<style>
  :root{--bg:#0b0e11;--fg:#eaecef;--muted:#8b939c;--accent:#7fd1b0}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .wrap{width:min(94vw,460px)}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  h1{font-size:22px}
  .stat{background:#161d24;border-radius:10px;padding:6px 14px;font-size:14px}
  .stat b{color:var(--accent)}
  .bar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .chip{background:#161d24;border-radius:10px;padding:7px 12px;font-size:13px;color:var(--muted)}
  .chip b{color:var(--fg)}
  .bar button{margin-left:auto}
  button{font:inherit;padding:8px 16px;border-radius:10px;border:1px solid #2a3540;background:#161d24;
    color:var(--fg);cursor:pointer;font-size:14px}
  button:hover{background:rgba(127,209,176,.12)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .card{aspect-ratio:1;perspective:800px;cursor:pointer;touch-action:manipulation}
  .inner{position:relative;width:100%;height:100%;transition:transform .28s;transform-style:preserve-3d}
  .card.flip .inner,.card.done .inner{transform:rotateY(180deg)}
  .card.bad{animation:mfbad .34s ease}
  @keyframes mfbad{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}
  .face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;font-size:clamp(24px,9vw,38px);user-select:none}
  .front{background:#1d2731;border:1px solid #26323e;color:#3b4b59;font-size:20px}
  .back{background:#1a2730;border:1px solid #2f4a44;transform:rotateY(180deg)}
  .card.done .back{background:#182e2a;border-color:var(--accent);animation:mfglow .5s ease}
  @keyframes mfglow{0%{box-shadow:0 0 0 0 rgba(127,209,176,.7)}100%{box-shadow:0 0 0 12px rgba(127,209,176,0)}}
  .overlay{position:fixed;inset:0;background:rgba(5,7,9,.8);display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;text-align:center;padding:24px}
  .overlay.on{display:flex}
  .overlay h2{font-size:22px}
  .overlay p{color:var(--muted);font-size:14px}
  .hint{margin-top:12px;font-size:12px;color:var(--muted)}
  .back-link{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted);text-decoration:none}
  @media (max-width:380px){.grid{gap:7px}.card .front{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>记忆翻牌</h1>
    <div class="stat">最少步数 <b id="best">--</b></div>
  </div>
  <div class="bar">
    <span class="chip">步数 <b id="moves">0</b></span>
    <span class="chip">时间 <b id="time">0</b>s</span>
    <button id="reset">重开</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">翻开两张相同的牌，全部配对即通关</div>
  <a class="back-link" href="/games/">← 返回小游戏</a>
</div>
<div class="overlay" id="ov"><h2 id="ovt">通关 🎉</h2><p id="ovs"></p><button id="again">再来一局</button></div>
<script src="/games/score.js"></script>
<script>
(() => {
  const EMOJI = ['🐶', '🐱', '🦊', '🐼', '🐸', '🐵', '🦁', '🐯'];
  const grid = document.getElementById('grid');
  const $moves = document.getElementById('moves');
  const $time = document.getElementById('time');
  const $best = document.getElementById('best');
  const ov = document.getElementById('ov'), ovt = document.getElementById('ovt'), ovs = document.getElementById('ovs');

  let deck = [], first = null, lock = false, moves = 0, matched = 0, timer = null, seconds = 0;
  let running = false, paused = false, won = false;
  let waits = [];

  function sfx(name) {
    try { if (window.mfKit) window.mfKit.sfx(name); } catch (e) {}
  }
  function later(fn, ms) {
    const id = setTimeout(() => {
      waits = waits.filter((w) => w !== id);
      fn();
    }, ms);
    waits.push(id);
  }
  function clearWaits() {
    waits.forEach(clearTimeout);
    waits = [];
  }

  // 最佳统一读 mfhry_best_memory（回退旧 key，不写旧 key）
  function readBest() {
    try {
      const v = +(localStorage.getItem('mfhry_best_memory') || localStorage.getItem('mfhry_memory_best') || 0);
      return v > 0 ? v : 0;
    } catch (e) { return 0; }
  }
  function renderBest() {
    const b = readBest();
    $best.textContent = b ? b + ' 步' : '--';
  }

  const shuffle = (a) => {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  function build() {
    grid.innerHTML = '';
    deck = shuffle([...EMOJI, ...EMOJI]).map((e, i) => ({ id: i, emoji: e, done: false }));
    deck.forEach((card) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = card.id;
      el.innerHTML = '<div class="inner"><div class="face front">?</div><div class="face back">' + card.emoji + '</div></div>';
      grid.appendChild(el);
      card.el = el;
    });
  }

  function stopTimer() {
    if (timer) { clearInterval(timer); timer = null; }
  }
  function startTimer() {
    stopTimer();
    if (!running || won || paused) return;
    timer = setInterval(tick, 1000);
  }

  function reset() {
    stopTimer();
    clearWaits();
    seconds = 0; moves = 0; matched = 0; running = false; won = false; paused = false;
    first = null; lock = false;
    $moves.textContent = 0;
    $time.textContent = 0;
    ov.classList.remove('on');
    renderBest();
    build();
  }

  function tick() {
    seconds++;
    $time.textContent = seconds;
  }

  function flip(card) {
    if (lock || won || card.done || card.el.classList.contains('flip')) return;
    if (!running) { running = true; startTimer(); }
    card.el.classList.add('flip');
    sfx('flip');
    if (!first) { first = card; return; }
    if (first === card) return;
    const second = card;
    moves++;
    $moves.textContent = moves;
    lock = true;

    if (first.emoji === second.emoji) {
      const a = first, b = second;
      first = null;
      later(() => {
        a.el.classList.add('done');
        b.el.classList.add('done');
        a.done = b.done = true;
        matched++;
        sfx('score');
        lock = false;
        if (matched === EMOJI.length) win();
      }, 300);
    } else {
      const a = first, b = second;
      first = null;
      later(() => {
        a.el.classList.add('bad');
        b.el.classList.add('bad');
      }, 340);
      later(() => {
        a.el.classList.remove('flip', 'bad');
        b.el.classList.remove('flip', 'bad');
        lock = false;
      }, 700);
    }
  }

  function win() {
    won = true;
    running = false;
    stopTimer();
    clearWaits();
    const prev = readBest();
    if (window.mfhryScore) { try { window.mfhryScore('memory', moves); } catch (e) {} }
    try { if (window.mfKit) window.mfKit.setScore(moves); } catch (e) {}
    const isNew = !prev || moves < prev;
    if (!isNew) sfx('win'); // 新纪录时 kit 的包装会播 win，避免双重音效
    renderBest();
    ovt.textContent = '通关 🎉';
    ovs.textContent = moves + ' 步 · ' + seconds + ' 秒' + (isNew ? ' · 新纪录' : '');
    ov.classList.add('on');
  }

  grid.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.card');
    if (!el) return;
    e.preventDefault();
    const card = deck.find((c) => c.id === +el.dataset.id);
    if (card) flip(card);
  });

  document.getElementById('reset').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  window.mfRestart = reset;

  // 暂停/恢复：kit 自动暂停与手动暂停都会派发；先清再起，避免叠加 interval
  window.addEventListener('mf:pause', () => { paused = true; stopTimer(); });
  window.addEventListener('mf:resume', () => { paused = false; startTimer(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { paused = true; stopTimer(); }
    else if (!document.body.classList.contains('mf-paused')) { paused = false; startTimer(); }
  });

  reset();
})();
</script>
<script src="/games/kit.js"></script>
<script src="/errlog.js"></script>
</body>
</html>
