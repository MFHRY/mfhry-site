<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>音乐 · mfhry.store</title>
<meta name="description" content="二次元曲库 · Apple 风格播放器" />
<link rel="canonical" href="https://mfhry.store/music/" />
<style>
  /* ---------------------------------------------------------------------------
     页面外壳样式：只作用于本页 .pg-* 元素，不修改 html/body（约束 2）。
     模块内部样式全部在各自 Shadow DOM 中，与这里完全隔离（约束 1/10）。
     --------------------------------------------------------------------------- */
  /* 本页是独立静态页，没有全站 reset：必须自己清掉 body 默认 8px 外边距，
     否则深色页面四周会露出一圈白边 */
  html,body{ margin:0; padding:0; }
  html,body{ background:#f5f5f7; }
  @media (prefers-color-scheme:dark){ html,body{ background:#000; } }
  html[data-theme="dark"],body[data-theme="dark"],
  html.dark,body.dark{ background:#000; }
  html[data-theme="light"],body[data-theme="light"],
  html.light,body.light{ background:#f5f5f7; }

  .pg-root{
    --pg-max:1200px;                 /* [191] 页面最大宽 */
    --pg-tint:10,132,255;            /* 当前歌曲封面主色，切歌时更新 */
    --pg-pad:24px;                   /* [191] 左右 padding */
    --pg-gap:24px;                   /* [30][195] 模块间距 16–24 */
    --pg-text:#1d1d1f;               /* [19] */
    --pg-text-2:#86868b;
    --pg-divider:rgba(0,0,0,0.07);   /* [20] */
    min-height:100vh;
    color:var(--pg-text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;  /* [5] */
    -webkit-font-smoothing:antialiased;  /* [48] */
    letter-spacing:-0.01em;              /* [44] 正文 */
    box-sizing:border-box;
    padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); /* [27] */
    position:relative;
    background:#f5f5f7;              /* [192] 浅色页面底 */
  }
  /* 深色页面底（[192] #000；[13] 三级主题解析） */
  @media (prefers-color-scheme:dark){
    .pg-root:not([data-theme="light"]){ --pg-text:#f5f5f7; --pg-text-2:#98989d;
      --pg-divider:rgba(255,255,255,0.10); background:#000; }
  }
  .pg-root[data-theme="dark"]{ --pg-text:#f5f5f7; --pg-text-2:#98989d;
    --pg-divider:rgba(255,255,255,0.10); background:#000; }
  .pg-root[data-theme="light"]{ --pg-text:#1d1d1f; --pg-text-2:#86868b;
    --pg-divider:rgba(0,0,0,0.07); background:#f5f5f7; }

  /* 极淡环境光：固定层但 opacity ≤0.5、不拦截交互（[193][3] 允许的例外） */
  .pg-ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.9;
    /* 取色来自当前歌曲封面（--pg-tint 是 "r,g,b"） */
    background:
      radial-gradient(58% 46% at 16% 0%,rgba(var(--pg-tint),.34),transparent 72%),
      radial-gradient(52% 44% at 88% 6%,rgba(var(--pg-tint),.22),transparent 74%),
      radial-gradient(70% 60% at 50% 108%,rgba(var(--pg-tint),.18),transparent 76%);
    transition:background 900ms cubic-bezier(.4,0,.2,1);
  }
  .pg-root[data-theme="dark"] .pg-ambient{ opacity:.28; }

  .pg-wrap{ position:relative; z-index:1; max-width:var(--pg-max); margin:0 auto;
    padding:24px var(--pg-pad) 40px; }

  /* 顶部导航 */
  .pg-bar{ display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding-bottom:16px; border-bottom:1px solid var(--pg-divider); margin-bottom:24px; }
  .pg-bar h1{ margin:0; font-size:22px; font-weight:600; letter-spacing:-0.02em; }
  .pg-bar small{ color:var(--pg-text-2); font-size:12px; font-weight:400;
    letter-spacing:-0.01em; }
  .pg-nav{ margin-left:auto; display:flex; flex-wrap:wrap; gap:4px; }
  .pg-nav a{ color:var(--pg-text-2); text-decoration:none; font-size:13px;
    padding:8px 10px; border-radius:10px; min-height:44px; box-sizing:border-box;
    display:inline-flex; align-items:center; transition:background-color .24s cubic-bezier(.4,0,.2,1),
      color .24s cubic-bezier(.4,0,.2,1); }
  .pg-nav a:hover{ background:rgba(0,0,0,.05); color:var(--pg-text); }
  .pg-root[data-theme="dark"] .pg-nav a:hover{ background:rgba(255,255,255,.07); }
  .pg-nav a[aria-current="page"]{ color:var(--pg-text); font-weight:600; }

  /* 主栅格：左播放器 + 右模块 */
  .pg-grid{ display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr);
    gap:var(--pg-gap); align-items:start; }          /* 模块卡片最大 480 [23] */
  @media (max-width:900px){ .pg-grid{ grid-template-columns:minmax(0,1fr); } }  /* 断点 900 */

  .pg-col{ min-width:0; display:flex; flex-direction:column; gap:var(--pg-gap); }
  /* 播放器不吸顶：避免桌面端滚动时遮挡左侧曲单，保证曲目始终可选 */
  .pg-sticky{ position:static; }
  @media (max-width:900px){ .pg-sticky{ position:static; } }

  /* segmented control：文字色 + 短下划线，不用彩底 [186] */
  .pg-tabs{ display:flex; gap:2px; padding:2px; border-bottom:1px solid var(--pg-divider);
    overflow-x:auto; scrollbar-width:none; }
  .pg-tabs::-webkit-scrollbar{ display:none; }
  .pg-tab{
    border:0; background:transparent; color:var(--pg-text-2); cursor:pointer;
    font-family:inherit; font-size:13px; letter-spacing:-0.01em;
    min-height:44px; padding:0 12px; border-radius:10px; position:relative;
    transition:color .24s cubic-bezier(.4,0,.2,1), background-color .24s cubic-bezier(.4,0,.2,1);
    white-space:nowrap;
  }
  .pg-tab:hover{ background:rgba(0,0,0,.05); }
  .pg-root[data-theme="dark"] .pg-tab:hover{ background:rgba(255,255,255,.07); }
  .pg-tab[aria-selected="true"]{ color:var(--pg-text); font-weight:600; }
  .pg-tab[aria-selected="true"]::after{
    content:''; position:absolute; left:12px; right:12px; bottom:-1px; height:2px;
    background:var(--pg-text); border-radius:1px;
  }
  .pg-tab:focus-visible{ outline:none;
    box-shadow:0 0 0 2px #f5f5f7,0 0 0 4px #0a84ff; }   /* [54] */

  /* 面板切换动画 ≤300ms，横向滑入或淡入 [182] */
  .pg-panel{ animation:pg-fade 220ms cubic-bezier(.4,0,.2,1); }
  .pg-panel[hidden]{ display:none; }
  @keyframes pg-fade{ from{ opacity:0; transform:translateX(8px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .pg-panel{ animation:none; } }   /* [58] */

  /* 宽屏并列：歌词与 MV 同时可见 [135] */
  @media (min-width:1100px){
    .pg-tabs{ display:none; }
    .pg-panels{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:var(--pg-gap); align-items:start; }
    .pg-panel[hidden]{ display:block; }     /* 宽屏全部并列 */
    /* 歌词是主模块：整列铺满，否则只占半列、看起来"卡片向左偏" */
    #panel-lyrics{ grid-column:1 / -1; }
  }

  /* 歌曲目录（保留旧站全部曲单） */
  .pg-catalog{ display:flex; flex-direction:column; gap:12px; }
  .pg-gtitle{ font-size:13px; font-weight:600; letter-spacing:-0.02em;
    color:var(--pg-text-2); margin-top:4px; }
  .pg-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .pg-chip{
    display:inline-flex; align-items:center; gap:6px; min-height:36px;
    padding:6px 12px; box-sizing:border-box; border-radius:999px;
    border:1px solid var(--pg-divider); background:rgba(255,255,255,.6);
    color:var(--pg-text); font-size:13px; letter-spacing:-0.01em; cursor:pointer;
    transition:background-color .24s cubic-bezier(.4,0,.2,1), border-color .24s cubic-bezier(.4,0,.2,1);
  }
  .pg-root[data-theme="dark"] .pg-chip{ background:rgba(28,28,30,.6); }
  .pg-chip:hover{ background:rgba(0,0,0,.05); }
  .pg-root[data-theme="dark"] .pg-chip:hover{ background:rgba(255,255,255,.08); }
  .pg-chip .pg-zh{ color:var(--pg-text-2); font-size:11.5px; }   /* 日文名（中文名）保留 */
  .pg-chip:focus-visible{ outline:none; box-shadow:0 0 0 2px #f5f5f7,0 0 0 4px #0a84ff; }
  .pg-nc{ border:0; background:transparent; cursor:pointer; font-size:12px;
    padding:2px 4px; border-radius:6px; line-height:1; }
  .pg-nc:hover{ background:rgba(0,0,0,.06); }
  .pg-gdiv{ flex-basis:100%; height:1px; margin:12px 0 8px;
    background:linear-gradient(90deg,transparent,rgba(0,0,0,.16),transparent); }
  .pg-root[data-theme="dark"] .pg-gdiv{
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent); }

  /* 内联 toast：圆角 12px，2s 自动消失 [203][204] */
  .pg-toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
    transform:translateX(-50%) translateY(12px); z-index:10;   /* [8] 浮层 10 */
    max-width:min(420px,calc(100vw - 48px));
    padding:10px 16px; border-radius:12px;
    background:rgba(28,28,30,.92); color:#f5f5f7; font-size:13px; letter-spacing:-0.01em;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    box-shadow:0 12px 30px -14px rgba(0,0,0,.4);
    opacity:0; pointer-events:none;
    transition:opacity .24s cubic-bezier(.4,0,.2,1), transform .24s cubic-bezier(.4,0,.2,1);
  }
  .pg-toast.pg-on{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* 首屏骨架屏 ≤800ms [197][198] */
  .pg-skel{ display:flex; flex-direction:column; gap:12px; }
  .pg-skel i{ display:block; height:14px; border-radius:7px; background:rgba(0,0,0,.06); }
  .pg-skel i:nth-child(2){ width:70%; }
  .pg-skel i:nth-child(3){ width:88%; }
  .pg-root[data-theme="dark"] .pg-skel i{ background:rgba(255,255,255,.08); }

  .pg-sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ---------------- 全屏：左播放卡片 + 右滚动字幕 ---------------- */
  /* 用 fixed 铺满整个视口：Safari 全屏时 100vh 可能略小于可用高度，会露出一圈 */
  .pg-root[data-fs]{
    position:fixed; inset:0; z-index:40; width:auto; height:auto; min-height:0;
    overflow:hidden; color:#f5f5f7; background:#0b0b0d; isolation:isolate;
  }
  /* 背景：当前封面放大模糊 + 暗角。inset 扩到 -28%，把模糊淡出的边缘推到屏幕外，
     否则边缘会透出一圈"淡化"的光晕（Safari 上尤其明显） */
  .pg-root[data-fs]::before{
    content:''; position:fixed; inset:-28%; z-index:-3; pointer-events:none;
    background-color:#0b0b0d;               /* 模糊边缘落在这层底色上，不再透出页面 */
    /* 封面不存在/加载失败时，用当前歌曲主色渐变兜底，不会是纯黑 */
    background-image:var(--fs-cover, none),
      radial-gradient(70% 60% at 22% 18%, rgba(var(--pg-tint),.55), transparent 72%),
      radial-gradient(70% 60% at 82% 86%, rgba(var(--pg-tint),.38), transparent 74%);
    background-size:cover; background-position:center;
    filter:blur(64px) saturate(155%) brightness(.60);
    transform:scale(1.12);
  }
  /* 暗角与色调叠加，本身也带不透明底色，确保四边没有缝隙 */
  .pg-root[data-fs]::after{
    content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background-color:rgba(0,0,0,.42);
    background-image:
      radial-gradient(110% 80% at 18% 0%, rgba(var(--pg-tint,10,132,255),.26), transparent 62%),
      radial-gradient(100% 70% at 88% 100%, rgba(var(--pg-tint,10,132,255),.18), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.72));
  }
  /* 原生全屏元素同样铺满（含 Safari 前缀） */
  .pg-root[data-fs]:fullscreen,
  .pg-root[data-fs]:-webkit-full-screen{
    width:100vw; height:100vh; max-width:none; max-height:none;
    margin:0; padding:0; inset:0;
  }
  .pg-root[data-fs] .pg-wrap{ position:relative; z-index:1; }
  /* 全屏里卡片用半透明材质，让背景透出来 */
  .pg-root[data-fs] ap-player,
  .pg-root[data-fs] ap-lyrics{ filter:none; }
  .pg-root[data-fs] .pg-ambient{ display:none; }
  .pg-root[data-fs] .pg-bar{ display:none; }
  /* 字幕与卡片共用同一列宽并居中，视觉上左右对齐 */
  .pg-root[data-fs]{ --fs-col:min(640px, calc(100% - 32px)); }
  /* 上下排：上方大字幕，底部播放卡片 + 最底待播列表 */
  .pg-root[data-fs] .pg-wrap{
    max-width:none; height:100%; box-sizing:border-box;
    padding:clamp(10px,1.6vh,20px) clamp(16px,4vw,56px)
            calc(clamp(20px,4.5vh,48px) + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; min-height:0;
  }
  .pg-root[data-fs] .pg-grid{
    display:flex; flex-direction:column; flex:1 1 auto;
    min-height:0; width:100%; gap:clamp(10px,1.6vh,20px);
  }
  .pg-root[data-fs] .pg-col{ min-height:0; min-width:0; width:100%; gap:0; }
  /* 歌词区：占据卡片以上的所有空间 */
  .pg-root[data-fs] #col-modules{
    order:1; display:flex; flex-direction:column; flex:1 1 auto; min-height:0;
    width:var(--fs-col); max-width:var(--fs-col); margin:0 auto; }
  .pg-root[data-fs] #col-modules > div{
    display:flex; flex-direction:column; flex:1 1 auto; min-height:0; }
  /* 播放卡片：底部居中、限宽、四边留白 */
  .pg-root[data-fs] #col-player{
    order:2; display:flex; flex-direction:column; flex:0 0 auto;
    width:var(--fs-col); max-width:var(--fs-col); margin:0 auto;
  }
  /* 最底一排：待播列表（横向滚动，腾出竖向空间给字幕） */
  .pg-fs-queue{
    order:3; flex:0 0 auto; width:100%;
    display:flex; align-items:center; gap:8px;
    padding:4px 0 calc(2px + env(safe-area-inset-bottom,0px));
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .pg-fs-queue::-webkit-scrollbar{ width:0; height:0; display:none; }
  .pg-fs-queue[hidden]{ display:none !important; }
  .pg-fsq{
    display:inline-flex; align-items:center; gap:8px; flex:0 0 auto;
    min-height:44px; padding:0 14px; box-sizing:border-box;
    border-radius:999px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08); color:#f5f5f7;
    font-size:13px; letter-spacing:-0.01em; white-space:nowrap; cursor:pointer;
    transition:background-color .24s cubic-bezier(.4,0,.2,1), border-color .24s cubic-bezier(.4,0,.2,1);
  }
  .pg-fsq:hover{ background:rgba(255,255,255,.15); }
  .pg-fsq[aria-current="true"]{
    background:rgba(10,132,255,.30); border-color:rgba(10,132,255,.55); font-weight:600;
  }
  .pg-fsq:focus-visible{ outline:none; box-shadow:0 0 0 2px #000,0 0 0 4px #0a84ff; }
  .pg-fsq .n{ font-variant-numeric:tabular-nums; opacity:.6; font-size:11px; }
  .pg-fsq .x{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; font-size:15px; line-height:1;
    opacity:.6; transition:opacity .2s, background-color .2s;
  }
  .pg-fsq .x:hover{ opacity:1; background:rgba(255,59,48,.32); }
  .pg-root[data-fs] #col-player > section{ display:none; }   /* 目录曲单让位给待播列表 */
  .pg-root[data-fs] .pg-sticky{
    display:flex; flex-direction:column; gap:10px; min-height:0; width:100%; }
  .pg-root[data-fs] ap-search{ display:none; }                        /* 全屏不显示搜索 */
  .pg-root[data-fs] ap-player{ flex:0 0 auto; width:100%; }
  .pg-root[data-fs] .pg-tabs{ display:none; }
  /* 宽屏的 .pg-panels 是两列 grid，全屏必须改回单列，否则歌词只占半宽 */
  .pg-root[data-fs] .pg-panels{ display:block; flex:1 1 auto; min-height:0; height:100%; }
  .pg-root[data-fs] .pg-panel{ display:none; }
  .pg-root[data-fs] #panel-lyrics{
    display:block; height:100%; min-height:0; overflow:hidden; }
  .pg-root[data-fs] #panel-lyrics ap-lyrics{
    display:block; height:100%; min-height:0; }
  /* 全屏退出按钮：浮层右上角，44px 热区 */
  .pg-fs-exit{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px);
    right:calc(env(safe-area-inset-right,0px) + 16px); z-index:101;
    width:44px; height:44px; border:0; border-radius:999px; padding:0;
    display:none; align-items:center; justify-content:center;
    background:rgba(28,28,30,.62); color:#f5f5f7; cursor:pointer;
    -webkit-backdrop-filter:blur(20px) saturate(180%);
            backdrop-filter:blur(20px) saturate(180%);
  }
  .pg-fs-exit:hover{ background:rgba(60,60,67,.72); }
  .pg-fs-exit:focus-visible{ outline:none; box-shadow:0 0 0 2px #000,0 0 0 4px #0a84ff; }
  .pg-fs-exit svg{ width:24px; height:24px; display:block; }
  .pg-root[data-fs] .pg-fs-exit{ display:inline-flex; }
  @media (max-width:820px){
    .pg-root[data-fs] #col-player{ max-width:100%; }
    .pg-root[data-fs] .pg-wrap{ padding-left:14px; padding-right:14px; }
  }

  /* 窄屏字号降 1px [31] */
  @media (max-width:360px){
    .pg-wrap{ padding:16px 16px 32px; }
    .pg-chip{ font-size:12px; }
    .pg-bar h1{ font-size:20px; }
  }
  /* 横屏可用 [32] */
  @media (orientation:landscape) and (max-height:480px){
    .pg-sticky{ position:static; }
    .pg-wrap{ padding-top:12px; }
  }
</style>
</head>
<body>
<div class="pg-root" id="root">
  <div class="pg-ambient" aria-hidden="true"></div>

  <div class="pg-wrap">
    <header class="pg-bar">
      <div>
        <h1>音乐</h1>
      </div>
      <nav class="pg-nav" aria-label="站点导航">
        <a href="/">首页</a>
        <a href="/projects">项目</a>
        <a href="/games">小游戏</a>
        <a href="/music" aria-current="page">音乐</a>
        <a href="/videos">视频</a>
        <a href="/news">新闻</a>
        <a href="/records">记录</a>
        <a href="/files">文件</a>
        <a href="/wall">墙</a>
      </nav>
    </header>

    <div class="pg-grid">
      <!-- 左列：搜索 + 播放器 + 曲单 -->
      <div class="pg-col" id="col-player">
        <div class="pg-sticky">
          <ap-search id="search"></ap-search>
          <div style="height:20px"></div>
          <ap-player id="player" aria-label="播放器"></ap-player>
        </div>
        <section aria-labelledby="cat-ttl">
          <h2 id="cat-ttl" class="pg-gtitle" style="margin:0 0 12px">曲单</h2>
          <div class="pg-catalog pg-skel" id="catalog" aria-busy="true">
            <i></i><i></i><i></i>
          </div>
        </section>
      </div>

      <!-- 右列：模块面板 -->
      <div class="pg-col" id="col-modules">
        <div>
          <div class="pg-tabs" role="tablist" aria-label="音乐模块" id="tabs">
            <button class="pg-tab" role="tab" id="tab-lyrics" aria-selected="true"
              aria-controls="panel-lyrics" data-mod="lyrics">歌词</button>
            <button class="pg-tab" role="tab" id="tab-comments" aria-selected="false"
              aria-controls="panel-comments" tabindex="-1" data-mod="comments">评论</button>
            <button class="pg-tab" role="tab" id="tab-mv" aria-selected="false"
              aria-controls="panel-mv" tabindex="-1" data-mod="mv">MV</button>
            <button class="pg-tab" role="tab" id="tab-cache" aria-selected="false"
              aria-controls="panel-cache" tabindex="-1" data-mod="cache">缓存</button>
          </div>
          <div class="pg-panels" id="panels">
            <div class="pg-panel" id="panel-lyrics" role="tabpanel" aria-labelledby="tab-lyrics">
            </div>
            <div class="pg-panel" id="panel-comments" role="tabpanel" aria-labelledby="tab-comments" hidden>
            </div>
            <div class="pg-panel" id="panel-mv" role="tabpanel" aria-labelledby="tab-mv" hidden>
            </div>
            <div class="pg-panel" id="panel-cache" role="tabpanel" aria-labelledby="tab-cache" hidden>
            </div>
          </div>
        </div>
      </div>

      <!-- 全屏时才显示的最底一排：待播列表 -->
      <div class="pg-fs-queue" id="fsQueue" role="list" aria-label="待播列表" hidden></div>
    </div>
  </div>

  <div class="pg-toast" id="toast" role="status" aria-live="polite"></div>
  <div class="pg-sr" id="live" role="status" aria-live="polite"></div>

  <!-- 全屏时右上角的退出按钮（由 [data-fs] 显示） -->
  <button class="pg-fs-exit" id="fsExit" type="button" aria-label="退出全屏"></button>
</div>

<script src="/songs.js?v=20"></script>
<script src="/music/engine.js?v=3"></script>
<!-- 组件按模块拆分，单文件均 < 1500 行（[216][219]）；ap-core 必须最先加载 -->
<script src="/music/ap-core.js?v=3"></script>
<script src="/music/ap-player.js?v=3"></script>
<script src="/music/ap-lyrics.js?v=3"></script>
<script src="/music/ap-comments.js?v=3"></script>
<script src="/music/ap-mv.js?v=3"></script>
<script src="/music/ap-search.js?v=3"></script>
<script src="/music/ap-cache.js?v=3"></script>
<script>
/* ============================================================================
 * 页面编排层（唯一知道所有模块存在的地方）
 *
 * 模块之间不互相引用 DOM，全部通过 APStore（共享状态）与 CustomEvent 协作：
 *   <ap-search>  --ap-search-pick-->  页面 → 加入队列
 *   <ap-lyrics>  --ap-lyrics-seek-->  页面 → player.seek()
 *   <ap-mv>      --ap-mv-play------>  页面 → player.pause()（不改变音频位置）
 *   <ap-mv>      --ap-mv-ended----->  页面 → player 下一首
 *   任意模块     --ap-toast-------->  页面 → 内联 toast
 * ========================================================================== */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var player = $('player'), search = $('search');

  /* 模块懒加载：首次切到该模块才创建元素（[188]） */
  var _mods = {};
  function modEl(mod) {
    if (_mods[mod]) return _mods[mod];
    var tag = { lyrics: 'ap-lyrics', comments: 'ap-comments', mv: 'ap-mv', cache: 'ap-cache' }[mod];
    if (!tag) return null;
    var panel = $('panel-' + mod);
    if (!panel) return null;
    var el = document.createElement(tag);
    el.id = mod;
    panel.appendChild(el);
    _mods[mod] = el;
    /* 接线：模块事件 → 页面编排 */
    el.addEventListener('ap-toast', function (ev) { showToast((ev.detail && ev.detail.text) || ''); });
    if (mod === 'lyrics') {
      el.addEventListener('ap-lyrics-seek', function (ev) { player.seek(ev.detail.time); });  /* [81] */
    }
    if (mod === 'mv') {
      el.addEventListener('ap-mv-play', function () {
        if (AP.Store.state.playing) player.pause();
        announce('MV 播放中');
      });
      el.addEventListener('ap-mv-ended', function () {
        var n = queue.length;
        if (n) playIndex((player.currentIndex + 1) % n, true);
      });
    }
    return el;
  }
  var toast = $('toast'), live = $('live'), root = $('root');

  var LSQ = 'ap:queue', LSI = 'ap:idx', LSV = 'ap:vol', LSH = 'ap:lastTrack';

  /* ---------------------------------------------------------------- toast */
  var toastTimer = 0;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('pg-on');             /* [203][204] */
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('pg-on'); }, 2000);
  }
  function announce(text) {
    if (!live) return;
    live.textContent = '';
    setTimeout(function () { live.textContent = text; }, 30);   /* [205] aria-live */
  }

  /* ------------------------------------------------------- 主题（页面级） */
  /* 只读取宿主设置，不写宿主变量（[12]）；模块各自也会解析一次（[15]） */
  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  function applyPageTheme() {
    var de = document.documentElement, b = document.body;
    var t = (de.getAttribute('data-theme') || (b && b.getAttribute('data-theme')) || '').toLowerCase();
    if (t !== 'dark' && t !== 'light') {
      t = (de.classList.contains('dark') || (b && b.classList.contains('dark'))) ? 'dark' : '';
    }
    if (!t) t = mqDark.matches ? 'dark' : 'light';
    if (root.getAttribute('data-theme') !== t) root.setAttribute('data-theme', t);
  }
  applyPageTheme();
  mqDark.addEventListener('change', applyPageTheme);
  var themeMo = new MutationObserver(applyPageTheme);
  themeMo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });

  /* ------------------------------------------------------------ 队列存取 */
  function loadJSON(k, d) {
    try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; }
    catch (e) { return d; }
  }
  function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

  /* 旧站队列一次性迁移，保证老用户歌单不丢（功能不删减） */
  (function migrate() {
    if (localStorage.getItem(LSQ)) return;
    var old = loadJSON('mfhry_music_queue', null);
    if (!Array.isArray(old) || !old.length) return;
    var conv = old.map(function (s) {
      return {
        id: s.r2 ? ('r2:' + (s.title || '')) : ('osu:' + s.setId),
        label: s.title || '未知曲目', zh: s.title || '', artist: s.artist || '',
        src: s.r2 || '', cover: s.cover || '', lyrics: s.lyrics || '',
        nc: s.nc || '', mv: s.mv || null, setId: s.setId || null
      };
    });
    saveJSON(LSQ, conv);
    var oi = loadJSON('mfhry_music_state', { idx: 0 });
    saveJSON(LSI, (oi && oi.idx) | 0);
    var ov = localStorage.getItem('mfhry_music_vol');
    if (ov != null) localStorage.setItem(LSV, ov);
  })();

  var queue = loadJSON(LSQ, []);
  if (!Array.isArray(queue)) queue = [];

  /* 曲目唯一标识 */
  function tid(t) { return t.id || (t.src ? 'src:' + t.src : (t.setId ? 'osu:' + t.setId : 'x:' + (t.label || ''))); }

  function persist() {
    saveJSON(LSQ, queue);
    saveJSON(LSI, player.currentIndex);
  }

  function addTrack(t, opts) {
    opts = opts || {};
    var id = tid(t);
    var i = queue.findIndex(function (x) { return tid(x) === id; });
    if (i >= 0) {
      /* 合并新字段（歌词 / 封面 / 直链 / MV），修复旧条目（原逻辑保留） */
      var dup = queue[i], changed = false;
      ['src', 'cover', 'lyrics', 'nc', 'mv', 'artist'].forEach(function (k) {
        if (t[k] && dup[k] !== t[k]) { dup[k] = t[k]; changed = true; }
      });
      if (changed) {
        player.tracks = queue;
        persist();
        showToast('《' + (t.zh || t.label) + '》已更新');
      }
      return i;
    }
    queue.push(t);
    player.tracks = queue;
    persist();
    return queue.length - 1;
  }

  function playIndex(i, autoplay) {
    if (i < 0 || i >= queue.length) return;
    player.currentIndex = i;
    persist();
    if (autoplay !== false) player.play();
  }

  /* --------------------------------------------- 背景随歌曲切换（封面取色） */
  var tintCache = loadJSON('ap:tint', {}) || {};
  var tintSeq = 0;

  function rgbToTint(r, g, b) {
    /* 稍微提饱和，避免灰扑扑 */
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var l = (mx + mn) / 2 / 255;
    if (mx > 0 && (mx - mn) / mx < 0.18) {          /* 近似灰：退回低调蓝 */
      return '96,116,146';
    }
    var boost = function (v) {
      var nl = l < 0.45 ? 0.45 : (l > 0.72 ? 0.66 : l);
      return Math.max(0, Math.min(255, Math.round(v + (v - l * 255) * 0.25 + (nl - l) * 90)));
    };
    return boost(r) + ',' + boost(g) + ',' + boost(b);
  }

  function setTint(url) {
    var seq = ++tintSeq;
    if (!url) { root.style.removeProperty('--pg-tint'); return; }
    if (tintCache[url]) { root.style.setProperty('--pg-tint', tintCache[url]); return; }
    var img = new Image();
    img.decoding = 'async';
    img.onload = function () {
      if (seq !== tintSeq) return;                   /* 已切歌，丢弃旧结果 */
      try {
        var c = document.createElement('canvas');
        c.width = c.height = 16;
        var g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(img, 0, 0, 16, 16);
        var d = g.getImageData(0, 0, 16, 16).data;
        var r = 0, gg = 0, b = 0, n = 0;
        for (var i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 128) continue;
          r += d[i]; gg += d[i + 1]; b += d[i + 2]; n++;
        }
        if (!n) return;
        var tint = rgbToTint(r / n, gg / n, b / n);
        tintCache[url] = tint;
        try {
          var keys = Object.keys(tintCache);
          if (keys.length > 60) { delete tintCache[keys[0]]; }
          localStorage.setItem('ap:tint', JSON.stringify(tintCache));
        } catch (e) { }
        if (seq === tintSeq) root.style.setProperty('--pg-tint', tint);
      } catch (e) { }
    };
    img.onerror = function () { if (seq === tintSeq) root.style.removeProperty('--pg-tint'); };
    img.src = url;
  }

  /* --------------------------------------------------- 从播放列表移除歌曲 */
  function removeFromQueue(i) {
    if (i < 0 || i >= queue.length) return;
    if (queue.length === 1) { showToast('这是最后一首，不能移除'); return; }
    var t = queue[i];
    var wasCur = i === player.currentIndex;
    var wasPlaying = AP.Store.state.playing;
    queue.splice(i, 1);

    /* 当前索引跟着调整：删当前之前的整体前移 */
    if (i < player.currentIndex) player.currentIndex = player.currentIndex - 1;
    else if (wasCur) player.currentIndex = Math.min(i, queue.length - 1);

    player.tracks = queue;
    persist();
    playIndex(player.currentIndex, wasPlaying && wasCur);   /* 删的是当前曲才续播下一首 */
    renderCatalog && renderCatalog();
    renderFsQueue && renderFsQueue();
    showToast('已从播放列表移除《' + (t.zh || t.label || '') + '》');
  }

  /* 首屏就按当前曲目上色（ap-change 未必触发，例如刷新后恢复同一首） */
  try {
    var bootTrack = AP.Store.track();
    if (bootTrack && bootTrack.cover) setTint(bootTrack.cover);
  } catch (e) { }

  player.addEventListener('ap-queue-remove', function (ev) {
    removeFromQueue(ev.detail && ev.detail.index);
  });

  /* --------------------------------------------------------- 曲目切换钩子 */
  var lastSrc = '';
  player.addEventListener('ap-change', function (ev) {
    var t = ev.detail.track, i = ev.detail.index;
    /* 需要在线取音频的条目：交给引擎（原「取音频」能力完整保留） */
    if (t && !t.src && t.setId && String(t.setId).indexOf('r2:') !== 0) {
      resolveOnline(t, i);
    }
    if (t) {
      setTint(t.cover || '');
      document.title = (t.zh || t.label || '音乐') + ' · mfhry.store';   /* [200] */
      saveJSON(LSH, tid(t));
      announce('正在播放 ' + (t.zh || t.label || ''));
      APEngine.setMediaSession({
        title: t.zh || t.label || '', artist: t.artist || '',
        play: function () { player.play(); },
        pause: function () { player.pause(); },
        previoustrack: function () { player._select && player._select((player.currentIndex - 1 + queue.length) % queue.length, true); },
        nexttrack: function () { player._select && player._select((player.currentIndex + 1) % queue.length, true); }
      });
    }
  });

  player.addEventListener('ap-play', function () { announce('播放'); });
  player.addEventListener('ap-pause', function () { announce('暂停'); });
  player.addEventListener('ap-error', function () {
    showToast('这个音频浏览器放不了，换一首试试');
    announce('音频播放失败');
  });

  /* 在线取音频：镜像搜索 → 流式解包 → IndexedDB 缓存（原能力） */
  var resolving = {};
  async function resolveOnline(t, index) {
    var key = tid(t);
    if (resolving[key]) return;
    resolving[key] = true;
    showToast('正在从镜像取音频…');
    try {
      var got = await APEngine.loadTrack(t, function (msg) { showToast(msg); });
      queue[index] = Object.assign({}, t, got.item, { src: got.url, setId: got.item.setId });
      if (got.bgUrl) queue[index].cover = got.bgUrl;
      player.tracks = queue;
      persist();
      if (player.currentIndex === index) player.play();
      showToast(got.fromCache ? '已从本机缓存载入' : '已存到本机缓存');
    } catch (e) {
      showToast('没取到音频：' + e.message);
    } finally {
      resolving[key] = false;
    }
  }

  /* ------------------------------------------------------------- 搜索接歌 */
  search.addEventListener('ap-search-pick', function (ev) {
    var d = ev.detail;
    var i = addTrack({
      id: 'osu:' + d.setId, label: d.title, zh: d.title, artist: d.artist,
      src: '', cover: 'https://assets.ppy.sh/beatmaps/' + d.setId + '/covers/cover.jpg',
      setId: d.setId
    });
    showToast('已加入《' + d.title + '》');
    announce('已加入 ' + d.title);
    if (player.currentIndex < 0) playIndex(i, false);
  });

  /* 常驻模块的 toast 接线（懒加载模块在 modEl 内接线） */
  ['search', 'player'].forEach(function (id) {
    var elc = $(id);
    if (!elc) return;
    elc.addEventListener('ap-toast', function (ev) { showToast((ev.detail && ev.detail.text) || ''); });
  });

  /* ------------------------------------------------------------- 模块导航 */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.pg-tab'));
  var panels = {
    lyrics: $('panel-lyrics'), comments: $('panel-comments'),
    mv: $('panel-mv'), cache: $('panel-cache')
  };
  var activeMod = 'lyrics';
  var scrollMemo = {};           /* 切模块保留滚动位置 [183] */

  function isWide() { return window.matchMedia('(min-width:1100px)').matches; }

  function setMod(mod, focusTab) {
    var prev = activeMod;
    if (prev && panels[prev]) scrollMemo[prev] = window.scrollY;
    activeMod = mod;
    tabs.forEach(function (b) {
      var on = b.dataset.mod === mod;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
      if (on && focusTab) b.focus();
    });
    Object.keys(panels).forEach(function (k) {
      if (!panels[k]) return;
      var show = isWide() || k === mod;
      /* 宽屏并列时全部显示 [135] */
      if (show) panels[k].removeAttribute('hidden');
      else panels[k].setAttribute('hidden', '');
    });
    /* 懒初始化：首次切到才创建/刷新（[188]）；宽屏标签栏隐藏、四模块并列，
       因此宽屏必须一次性全部挂载，否则评论/MV/缓存永远无法打开 */
    if (isWide()) { ['lyrics', 'comments', 'mv', 'cache'].forEach(modEl); }
    var el = modEl(mod);
    if (mod === 'cache' && el && el.refresh) el.refresh();
    /* 恢复该模块上次的滚动位置（[183]） */
    if (scrollMemo[mod] != null && !isWide()) {
      window.scrollTo({ top: scrollMemo[mod], behavior: 'auto' });
    }
    /* 非活跃模块动画暂停（[185]）：隐藏即停止其内部 animation */
    Object.keys(panels).forEach(function (k) {
      if (panels[k]) panels[k].style.visibility = (isWide() || k === mod) ? '' : 'hidden';
    });
  }

  tabs.forEach(function (b) {
    b.addEventListener('click', function () { setMod(b.dataset.mod); });
    b.addEventListener('keydown', function (ev) {           /* [187] 键盘左右切换 */
      if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
      ev.preventDefault();
      var i = tabs.indexOf(b);
      var n = (i + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      setMod(tabs[n].dataset.mod, true);
    });
  });

  var wideMq = window.matchMedia('(min-width:1100px)');
  wideMq.addEventListener('change', function () { setMod(activeMod); });

  setMod('lyrics');

  /* ------------------------------------------------- 全屏：左卡片 + 右字幕 */
  var rootEl = $('root');
  var fsOn = false, fsTriggerEl = null, fsListWasOpen = false;

  function enterFs(trigger) {
    fsTriggerEl = trigger || null;
    /* 字幕用面板里的歌词实例，先确保已挂载 */
    var ly = modEl('lyrics');
    if (ly) ly.setAttribute('fs', '');          /* 沉浸形态：无卡片、大字幕 */
    /* 全屏字号/容器尺寸变化后必须重算行位置，否则滚动目标会算错 */
    if (ly) requestAnimationFrame(function () {
      requestAnimationFrame(function () { if (ly._measure) ly._measure(); });
    });
    rootEl.setAttribute('data-fs', '');         /* 页面切两栏：左卡片 / 右字幕 */
    /* 用当前封面做全屏背景，避免纯黑 */
    var cur = AP.Store.track();
    if (cur && cur.cover) rootEl.style.setProperty('--fs-cover', 'url("' + cur.cover + '")');
    else rootEl.style.removeProperty('--fs-cover');
    /* 卡片内列表收起，待播改到最底一排，竖向空间留给字幕（退出时还原） */
    try {
      fsListWasOpen = !player.shadowRoot.getElementById('plist').hasAttribute('hidden');
      player.setAttribute('playlist-open', 'false');
    } catch (e) { }
    renderFsQueue();
    document.documentElement.style.overflow = 'hidden';
    var req = rootEl.requestFullscreen ? rootEl.requestFullscreen() : Promise.reject();
    (req || Promise.reject()).then(function () {
      fsOn = true;
    }).catch(function () {
      fsOn = true;                              /* 兜底：仍是全屏布局，ESC 可退 */
      showToast('当前浏览器不支持全屏 API，已使用覆盖模式');
    });
  }

  function exitFs() {
    if (document.fullscreenElement === rootEl) {
      (document.exitFullscreen() || Promise.resolve()).catch(function () { });
    }
    fsOn = false;
    rootEl.removeAttribute('data-fs');
    rootEl.style.removeProperty('--fs-cover');
    var qb = $('fsQueue');
    if (qb) { qb.hidden = true; qb.innerHTML = ''; }
    var ly = _mods.lyrics;
    if (ly) ly.removeAttribute('fs');
    document.documentElement.style.overflow = '';
    try {
      player.setAttribute('playlist-open', fsListWasOpen ? 'true' : 'false');
    } catch (e) { }
    if (fsTriggerEl) { try { fsTriggerEl.focus(); } catch (e) { } fsTriggerEl = null; }
    /* 退出后重建位置缓存，避免全屏尺寸下的旧偏移 */
    if (ly && ly._measure) { try { ly._measure(); } catch (e) { } }
  }

  /* 最底待播列表：横向 chips，点击直接切歌 */
  function renderFsQueue() {
    var bar = $('fsQueue');
    if (!bar) return;
    bar.innerHTML = '';
    if (!queue.length) { bar.hidden = true; return; }
    bar.hidden = false;
    var idx = player.currentIndex;
    queue.forEach(function (t, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pg-fsq ap-focusable';
      b.setAttribute('aria-current', i === idx ? 'true' : 'false');
      b.setAttribute('aria-label', '播放 ' + (t.zh || t.label || ''));
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span>' +
        (t.zh || t.label || '') + '</span>' +
        '<span class="x" role="button" tabindex="-1" aria-label="移除">×</span>';
      b.addEventListener('click', function () { playIndex(i, true); renderFsQueue(); });
      var x = b.querySelector('.x');
      x.addEventListener('click', function (ev) {
        ev.stopPropagation();
        removeFromQueue(i);
      });
      bar.appendChild(b);
    });
    var act = bar.querySelector('[aria-current="true"]');
    if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  window.__apFsQueue = renderFsQueue;

  function toggleFs(trigger) {
    if (fsOn || rootEl.hasAttribute('data-fs')) exitFs();
    else enterFs(trigger);
  }

  /* 播放器的全屏按钮 / 双击封面 → 页面级全屏布局 */
  player._fsDelegate = true;
  player.addEventListener('ap-fs-toggle', function () { toggleFs(player); });

  /* 全屏中切歌或队列变化 → 重绘底部待播栏 */
  AP.Store.on(function (st) {
    if (!fsOn) return;
    if (st.index !== renderFsQueue._last || st.playing === undefined) {
      renderFsQueue._last = st.index;
      renderFsQueue();
    }
  });

  var fsExitBtn = $('fsExit');
  fsExitBtn.innerHTML = AP.ICON.compress;
  fsExitBtn.addEventListener('click', function () { exitFs(); });

  document.addEventListener('fullscreenchange', function () {
    if (document.fullscreenElement === rootEl) { fsOn = true; return; }
    if (fsOn && document.fullscreenElement === null) exitFs();   /* ESC / 系统退出 */
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && fsOn) exitFs();
  });


  /* ------------------------------------------------------------ 曲单渲染 */
  function renderCatalog() {
    var wrap = $('catalog');
    wrap.classList.remove('pg-skel');
    wrap.removeAttribute('aria-busy');
    wrap.innerHTML = '';
    var groups = window.MFHRY_SONGS || [];

    groups.forEach(function (g) {
      var title = document.createElement('div');
      title.className = 'pg-gtitle';
      title.textContent = g.title;
      wrap.appendChild(title);

      var row = document.createElement('div');
      row.className = 'pg-row';
      (g.items || []).forEach(function (h) {
        if ('divider' in h) {                            /* 分隔线（保留） */
          var dv = document.createElement('div');
          dv.className = 'pg-gdiv';
          row.appendChild(dv);
          return;
        }
        var chip = document.createElement('div');
        chip.className = 'pg-chip';
        chip.setAttribute('role', 'button');
        chip.setAttribute('tabindex', '0');
        chip.setAttribute('aria-label', (h.zh || h.label) + (h.artist ? ' - ' + h.artist : ''));

        var name = document.createElement('span');
        name.textContent = h.label;
        if (h.zh && h.zh !== h.label) {
          var zh = document.createElement('span');
          zh.className = 'pg-zh';
          zh.textContent = '（' + h.zh + '）';            /* 日文名（中文名）保留 */
          name.appendChild(zh);
        }
        chip.appendChild(name);

        if (h.nc) {                                       /* 评论入口（保留） */
          var nc = document.createElement('button');
          nc.className = 'pg-nc';
          nc.type = 'button';
          nc.textContent = '💬';
          nc.setAttribute('aria-label', (h.zh || h.label) + ' 的网易云评论');
          nc.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var t = trackFromChip(h);
            addTrack(t);
            player.currentIndex = queue.findIndex(function (x) { return tid(x) === tid(t); });
            persist();
            setMod('comments');
            var cm = modEl('comments');
            if (cm && cm._load) cm._load(AP.Store.track());
          });
          chip.appendChild(nc);
        }

        var onPick = function () {
          if (h.r2) {                                     /* 直链：直接进队播放 */
            var t = trackFromChip(h);
            var i = addTrack(t);
            playIndex(i, true);
            showToast('正在播放《' + (h.zh || h.label) + '》');
          } else {                                        /* 无直链：走镜像搜索 */
            var q = search.shadowRoot && search.shadowRoot.querySelector('#q');
            if (q) {
              q.value = h.q || h.label;
              q.dispatchEvent(new Event('input', { bubbles: true }));
            }
            setMod('comments');
            showToast('正在镜像里搜《' + (h.zh || h.label) + '》');
          }
        };
        chip.addEventListener('click', onPick);
        chip.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onPick(); }
        });
        row.appendChild(chip);
      });
      wrap.appendChild(row);
    });
    if (!groups.length) {
      wrap.innerHTML = '<div class="pg-gtitle">曲单还没有内容</div>';
    }
  }

  function trackFromChip(h) {
    return {
      id: h.r2 ? ('r2:' + h.label) : ('osu:' + h.label),
      label: h.label, zh: h.zh || h.label, artist: h.artist || '',
      src: h.r2 || '', cover: h.cover || '', lyrics: h.lyrics || '',
      nc: h.nc || '', mv: h.mv || null, setId: h.setId || null
    };
  }

  /* --------------------------------------------------------------- 启动 */
  var vol = parseFloat(localStorage.getItem(LSV));
  if (!isFinite(vol)) vol = 0.85;
  player.volume = vol;
  player.tracks = queue;

  var idx = loadJSON(LSI, 0) | 0;
  if (queue.length) {
    if (idx < 0 || idx >= queue.length) idx = 0;
    player.currentIndex = idx;      /* 恢复上次的歌，但不自动出声（[74]） */
  }

  /* 曲单在下一帧渲染，保证首屏骨架屏立即出现（[197]） */
  requestAnimationFrame(function () {
    renderCatalog();
    if (window.MFHRY_SONGS && window.MFHRY_SONGS.length) {
      showToast('曲单已就绪');
    }
  });

  /* deep link ?track=N（[199]） */
  (function deepLink() {
    var m = /[?&]track=(\d+)/.exec(location.search);
    if (!m) return;
    var n = Number(m[1]);
    if (n >= 0 && n < queue.length) {
      player.currentIndex = n;
      persist();
    }
  })();

  /* 页面级快捷键（保留旧站操作） */
  document.addEventListener('keydown', function (ev) {
    var tag = (ev.target && ev.target.tagName) || '';
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); if (AP.Store.state.playing) player.pause(); else player.play(); }
    else if (k === 'ArrowRight') { ev.preventDefault(); player.seek(AP.Store.state.time + 5); }
    else if (k === 'ArrowLeft') { ev.preventDefault(); player.seek(AP.Store.state.time - 5); }
    else if (k === 'ArrowUp') { ev.preventDefault(); player.setVolume(Math.min(1, AP.Store.state.volume + 0.05)); }
    else if (k === 'ArrowDown') { ev.preventDefault(); player.setVolume(Math.max(0, AP.Store.state.volume - 0.05)); }
    else if (k === 'f' || k === 'F') {
      var art = player.shadowRoot && player.shadowRoot.querySelector('#art');
      player.toggleFullscreen(art);
    }
  });

  /* 音量持久化 */
  var saveVol = function () {
    try { localStorage.setItem(LSV, String(AP.Store.state.volume)); } catch (e) { }
  };
  AP.Store.on(function (st) { saveVol(); });
  AP.Store.on(function () {
    if (document.title.indexOf('·') > 0) return;
  });

  /* 清理：页面卸载时停掉 Media Session 与 observer（[212][213]） */
  window.addEventListener('pagehide', function () {
    themeMo.disconnect();
    try { player.pause(); } catch (e) { }
  });

  /* 供其它页面 / 调试调用（不产生 console 输出 [202]） */
  window.__music = {
    queue: function () { return queue.slice(); },
    play: function (i) { playIndex(i, true); },
    add: function (t) { return addTrack(t); },
    modules: function () { return setMod; },
    toast: showToast
  };
})();
</script>
</body>
</html>
