<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐 · mfhry.store</title>
<style>
  :root{
    --bg:#08090b;--fg:#eef1f4;--muted:rgba(238,241,244,.55);--accent:#7fd1b0;
    --glass:linear-gradient(165deg,rgba(255,255,255,.13),rgba(255,255,255,.05) 46%,rgba(255,255,255,.075));
    --glass-hi:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.06);
    --rim:1px solid rgba(255,255,255,.17);
    --shadow:0 20px 48px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;overflow-x:hidden}

  /* 液态玻璃环境层：整张页面铺满当前封面 */
  .ambient{position:fixed;inset:-12%;z-index:-1;overflow:hidden;background:#0a0b0d}
  .ambient img{width:100%;height:100%;object-fit:cover;filter:blur(70px) saturate(175%) brightness(.40);transform:scale(1.12)}
  .ambient::after{content:'';position:absolute;inset:0;background:
    radial-gradient(120% 80% at 30% -10%,rgba(255,255,255,.10),transparent 55%),
    linear-gradient(180deg,rgba(8,9,11,.30),rgba(8,9,11,.62) 55%,rgba(8,9,11,.82))}

  /* 顶部导航：和全站一样铺满、毛玻璃 */
  .site-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:10px clamp(16px,3vw,40px);
    background:rgba(12,14,17,.42);border-bottom:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.28)}
  .site-bar::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 140% at 22% -60%,rgba(255,255,255,.28),transparent 60%);opacity:.6}
  .head-left{position:relative;display:flex;align-items:baseline;gap:10px;min-width:0}
  .head-left h1{font-size:17px;letter-spacing:-.01em;white-space:nowrap}
  .head-left small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .site-nav{position:relative;display:flex;gap:2px;font-size:14px;overflow-x:auto;scrollbar-width:none}
  .site-nav::-webkit-scrollbar{display:none}
  .site-nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;
    border:1px solid transparent;white-space:nowrap;
    transition:background .18s,color .18s,border-color .18s,box-shadow .18s,transform .12s}
  .site-nav a:hover{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.28)}
  .site-nav a:active{transform:scale(.97)}
  .site-nav a.on{color:#8fe0c3;background:rgba(127,209,176,.18);border-color:rgba(127,209,176,.42);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  @media (max-width:860px){
    .head-left small{display:none}
    .site-nav a{padding:6px 9px;font-size:13px}
  }

  main{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:16px;align-items:start;
    padding:10px clamp(16px,3vw,40px) 24px;min-height:calc(100vh - 108px)}
  @media (max-width:860px){main{grid-template-columns:1fr;min-height:0}}

  .card{position:relative;border-radius:22px;background:var(--glass);border:var(--rim);
    box-shadow:var(--shadow),var(--glass-hi);backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);padding:16px;overflow:hidden}
  .card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(130% 55% at 18% -12%,rgba(255,255,255,.20),transparent 62%)}
  .card>*{position:relative}
  @media (min-width:861px){
    #colRight{max-height:calc(100vh - 92px);overflow:auto;scrollbar-width:thin}
    #colRight::-webkit-scrollbar{width:8px}
    #colRight::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
  }

  .cover{width:100%;aspect-ratio:900/250;object-fit:cover;border-radius:16px;background:#12161b;
    display:block;margin-bottom:14px;border:1px solid rgba(255,255,255,.14);
    box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
  .thumb{width:36px;height:36px;border-radius:9px;object-fit:cover;background:#1d2731;flex:none;
    border:1px solid rgba(255,255,255,.16);box-shadow:0 4px 10px rgba(0,0,0,.35)}

  .np{font-size:17px;font-weight:600;line-height:1.35;word-break:break-word;min-height:46px;letter-spacing:-.01em}
  .np small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);margin-top:3px}

  .seek{margin-top:14px}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:999px;outline:none;
    background:linear-gradient(90deg,rgba(255,255,255,.42),rgba(255,255,255,.16));
    box-shadow:inset 0 1px 2px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.08)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#d6dee6);cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.5),inset 0 -1px 2px rgba(0,0,0,.15)}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:7px;
    font-variant-numeric:tabular-nums}

  .controls{display:flex;align-items:center;gap:9px;margin-top:12px}
  .controls button{width:42px;height:40px;border-radius:13px;color:var(--fg);font-size:15px;cursor:pointer;
    background:var(--glass);border:var(--rim);box-shadow:var(--glass-hi),0 10px 24px rgba(0,0,0,.30);
    backdrop-filter:blur(18px) saturate(170%);transition:background .18s,transform .12s,box-shadow .18s}
  .controls button:hover{background:linear-gradient(165deg,rgba(255,255,255,.24),rgba(255,255,255,.10));
    box-shadow:var(--glass-hi),0 14px 30px rgba(0,0,0,.36)}
  .controls button:active{transform:scale(.95)}
  #toggle{width:58px;background:#fff;color:#000;border:0;
    box-shadow:0 8px 20px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.6);font-size:17px}
  #toggle:hover{background:#f2f2f2}

  .chip{padding:6px 13px;border-radius:999px;font-size:12px;color:var(--fg);cursor:pointer;white-space:nowrap;
    background:var(--glass);border:var(--rim);box-shadow:var(--glass-hi),0 8px 20px rgba(0,0,0,.26);
    backdrop-filter:blur(16px) saturate(165%);transition:background .18s,transform .12s}
  .chip:hover{background:linear-gradient(165deg,rgba(255,255,255,.22),rgba(255,255,255,.09))}
  .chip:active{transform:scale(.97)}
  .chip.on{background:linear-gradient(165deg,rgba(127,209,176,.34),rgba(127,209,176,.14));
    border-color:rgba(127,209,176,.55);color:#fff;box-shadow:var(--glass-hi),0 10px 26px rgba(48,150,116,.35)}

  .vol{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:11px;color:var(--muted)}
  .vol input{flex:1}
  .status{font-size:11.5px;color:var(--muted);margin-top:10px;min-height:16px;line-height:1.5}
  .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden;display:none}
  .bar.on{display:block}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fa2d48,#ff5d72);
    transition:width .12s}

  .row{display:flex;gap:7px;flex-wrap:wrap}
  .gtitle{font-size:11px;color:rgba(255,255,255,.42);margin:10px 0 6px;letter-spacing:.04em}

  .search{display:flex;gap:7px;margin-bottom:2px}
  .search input{flex:1;min-width:0;padding:9px 14px;border-radius:13px;border:var(--rim);color:var(--fg);
    font:inherit;font-size:13px;background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26),inset 0 -1px 0 rgba(0,0,0,.2);
    backdrop-filter:blur(18px) saturate(170%)}
  .search input::placeholder{color:rgba(255,255,255,.38)}
  .search input:focus{outline:none;border-color:rgba(127,209,176,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 3px rgba(127,209,176,.16)}
  .search button{padding:9px 16px;border-radius:13px;color:var(--fg);font:inherit;font-size:13px;cursor:pointer;
    background:linear-gradient(165deg,rgba(127,209,176,.34),rgba(127,209,176,.13));
    border:1px solid rgba(127,209,176,.5);box-shadow:var(--glass-hi),0 10px 26px rgba(48,150,116,.3);
    backdrop-filter:blur(18px) saturate(170%);transition:background .18s,transform .12s}
  .search button:hover{background:linear-gradient(165deg,rgba(127,209,176,.46),rgba(127,209,176,.2))}
  .search button:active{transform:scale(.97)}

  h3{font-size:12px;color:rgba(255,255,255,.78);margin:16px 0 7px;font-weight:600;letter-spacing:.02em}
  h3 small{color:var(--muted);font-weight:400;margin-left:6px}

  .list{display:grid;gap:6px}
  .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;
    border-radius:14px;font-size:12.5px;line-height:1.45;
    background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 20px rgba(0,0,0,.22);
    transition:background .18s,border-color .18s,transform .12s}
  .item:hover{background:linear-gradient(165deg,rgba(255,255,255,.135),rgba(255,255,255,.05));
    border-color:rgba(255,255,255,.2)}
  .item small{color:var(--muted);font-size:11px}
  .item.playing{border-color:rgba(127,209,176,.55);
    background:linear-gradient(165deg,rgba(127,209,176,.22),rgba(127,209,176,.07));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 10px 26px rgba(48,150,116,.28)}
  .item .act{font-size:11.5px;white-space:nowrap;cursor:pointer;padding:5px 10px;border-radius:999px;
    color:#dff5ec;background:linear-gradient(165deg,rgba(127,209,176,.28),rgba(127,209,176,.10));
    border:1px solid rgba(127,209,176,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
    transition:background .18s,transform .12s}
  .item .act:hover{background:linear-gradient(165deg,rgba(127,209,176,.42),rgba(127,209,176,.18))}
  .item .act:active{transform:scale(.96)}
  .item .rm{color:rgba(255,255,255,.45);cursor:pointer;padding:3px 7px;font-size:13px;border-radius:8px;
    transition:color .15s,background .15s}
  .item .rm:hover{color:#ff9fb4;background:rgba(255,255,255,.08)}
  .empty{font-size:12px;color:var(--muted);padding:10px 4px;line-height:1.6}
  .more{display:inline-block;font-size:12px;color:var(--fg);cursor:pointer;padding:6px 13px;margin-top:8px;
    border-radius:999px;background:var(--glass);border:var(--rim);
    box-shadow:var(--glass-hi),0 8px 20px rgba(0,0,0,.26);backdrop-filter:blur(16px) saturate(165%);
    transition:background .18s,transform .12s}
  .more:hover{background:linear-gradient(165deg,rgba(255,255,255,.22),rgba(255,255,255,.09))}
  .more:active{transform:scale(.97)}
  .foot{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.7}
  .foot a{color:rgba(180,235,215,.9);text-decoration:none;border-bottom:1px solid rgba(180,235,215,.3)}

  /* ---------- 全屏播放（液态玻璃） ---------- */
  .fs{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;overflow:hidden;background:#08090c}
  .fs.on{display:flex}
  .fs-bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;
    filter:blur(80px) saturate(170%) brightness(.42);transform:scale(1.08)}
  .fs-shade{position:absolute;inset:0;background:
    radial-gradient(130% 90% at 50% -12%,rgba(255,255,255,.10),rgba(255,255,255,0) 55%),
    linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.55) 62%,rgba(0,0,0,.84))}
  .fs-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;color:rgba(255,255,255,.58);font-size:12.5px;letter-spacing:.02em}
  .fs-top .acts{display:flex;gap:10px}
  .fs-top button{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;color:rgba(255,255,255,.85);font-size:13.5px;
    background:rgba(255,255,255,.10);backdrop-filter:blur(18px) saturate(160%);transition:background .18s,transform .12s}
  .fs-top button:hover{background:rgba(255,255,255,.20)}
  .fs-top button:active{transform:scale(.94)}

  .fs-body{position:relative;z-index:2;flex:1;display:flex;align-items:center;justify-content:center;
    gap:clamp(30px,6vw,72px);padding:0 clamp(20px,4.5vw,64px);min-height:0}
  .fs-art{width:clamp(200px,31vw,352px);aspect-ratio:1/1;object-fit:cover;border-radius:16px;background:#12151a;
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 34px 80px rgba(0,0,0,.60),inset 0 1px 0 rgba(255,255,255,.18);
    transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s}
  .fs-art.playing{transform:scale(1.012);box-shadow:0 46px 100px rgba(0,0,0,.66),inset 0 1px 0 rgba(255,255,255,.24)}
  .fs-mv{width:min(78vw,760px);max-height:62vh;aspect-ratio:16/9;object-fit:contain;border-radius:14px;
    background:#000;border:1px solid rgba(255,255,255,.10);box-shadow:0 34px 80px rgba(0,0,0,.6);display:none}
  .fs-mv.on{display:block}
  .fs-art.mvhide,.fs-ly.mvhide{display:none}
  .fs-mvbar{position:absolute;top:16px;right:16px;z-index:3;display:none;flex-wrap:wrap;gap:6px;max-width:64%;justify-content:flex-end}
  .fs-mvbar.on{display:flex}
  .fs-mvbar button{padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
    background:rgba(0,0,0,.42);color:#fff;font:600 12px/1 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}
  .fs-mvbar button:hover{background:rgba(255,255,255,.16)}
  .fs-mvbar button.on{background:rgba(127,209,176,.9);color:#08201a;border-color:transparent}
  .fs-mvbtn{margin-top:14px;display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;
    border:1px solid rgba(127,209,176,.5);background:rgba(127,209,176,.10);color:#9fe8cd;
    font:600 13px/1 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer}
  .fs-mvbtn:hover{background:rgba(127,209,176,.2)}
  .fs-mvbtn.on{background:rgba(127,209,176,.9);color:#08201a}
  .fs-info{width:clamp(260px,40vw,460px);color:#fff;min-width:0}
  .fs-title{font-size:clamp(24px,2.8vw,34px);font-weight:700;letter-spacing:-.022em;line-height:1.18;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .fs-artist{font-size:clamp(15px,1.6vw,19px);font-weight:500;color:rgba(255,255,255,.60);margin-top:9px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fs-prog{margin-top:30px}
  .fs-prog input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;
    background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.22) var(--p,0%));outline:none;margin:0}
  .fs-prog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
  .fs-prog:hover input[type=range]::-webkit-slider-thumb{opacity:1}
  .fs-times{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.52);
    margin-top:10px;font-variant-numeric:tabular-nums}
  .fs-ctrl{display:flex;align-items:center;justify-content:center;gap:clamp(20px,3.2vw,36px);margin-top:26px}
  .fs-ctrl button{background:none;border:0;color:rgba(255,255,255,.92);cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;transition:color .15s,transform .12s}
  .fs-ctrl button:hover{color:#fff}
  .fs-ctrl button:active{transform:scale(.93)}
  .fs-ctrl .mini{opacity:.62;font-size:18px;width:30px;height:30px}
  .fs-ctrl .mini:hover{opacity:1}
  .fs-ctrl .mini.on{opacity:1;color:#fa2d48}
  .fs-ctrl .fs-play{width:74px;height:74px;border-radius:50%;color:#000!important;background:#fff!important;
    border:0!important;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
  .fs-ctrl .fs-play:hover{background:#f4f4f4!important;color:#000!important}
  .fs-vol{display:flex;align-items:center;gap:12px;margin-top:28px;color:rgba(255,255,255,.55)}
  .fs-vol input{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:3px;background:rgba(255,255,255,.22)}
  .fs-vol input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;transition:opacity .2s}
  .fs-vol:hover input::-webkit-slider-thumb{opacity:1}

  .fs-ly{width:clamp(260px,30vw,440px);max-height:min(66vh,600px);display:none;flex-direction:column;color:#fff;
    padding:16px 18px 14px;border-radius:22px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
    backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%)}
  .fs-ly.on{display:flex}
  .ly-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.10);flex:none}
  .ly-head b{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ly-off{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;flex:none}
  .ly-off input{width:88px}
  .ly-off i{font-style:normal;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .ly-box{flex:1;overflow-y:auto;padding:8px 4px 8px 2px;scrollbar-width:thin;
    mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent);
    -webkit-mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent)}
  .ly-box::-webkit-scrollbar{width:6px}
  .ly-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  .ly-line{padding:9px 11px;border-radius:12px;cursor:pointer;opacity:.52;transition:background .15s,opacity .25s}
  .ly-line:hover{background:rgba(255,255,255,.07);opacity:.85}
  .ly-line.active{opacity:1;background:rgba(255,255,255,.10)}
  .ly-ja{font-size:16.5px;line-height:1.55;font-weight:600;letter-spacing:.01em}
  .ly-zh{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.60);margin-top:3px}
  .ly-line.active .ly-ja{color:#fff;text-shadow:0 0 26px rgba(255,255,255,.3)}
  .fs-queue{position:relative;z-index:2;display:flex;gap:10px;overflow-x:auto;padding:12px clamp(18px,4vw,56px) 20px;
    scrollbar-width:none}
  .fs-queue::-webkit-scrollbar{display:none}
  .fs-q{display:flex;align-items:center;gap:10px;flex:none;max-width:250px;padding:8px 14px 8px 8px;border-radius:16px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);cursor:pointer;transition:background .18s}
  .fs-q:hover,.fs-q.cur{background:rgba(255,255,255,.14)}
  .fs-q img{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none}
  .fs-q span{color:#fff;font-size:12px;line-height:1.3;overflow:hidden}
  .fs-q small{display:block;color:rgba(255,255,255,.55);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fs-q b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fs-empty{color:rgba(255,255,255,.42);font-size:12px;padding:8px 2px}
  @media (max-width:720px){
    .fs-body{flex-direction:column;gap:18px;padding-top:4px;justify-content:center}
    .fs-art{width:min(56vw,230px)}
    .fs-info{width:100%;max-width:360px;text-align:center}
    .fs-prog,.fs-vol{margin-top:16px}
    .fs-ly{width:100%;max-width:430px;max-height:34vh}
  }

</style>
</head>
<body>
<div class="ambient"><img id="ambientImg" alt="" /></div>
<header class="site-bar">
  <div class="head-left">

    <div class="seek">

<audio id="au" preload="auto"></audio>
<script src="/songs.js?v=6"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const au = $('au');
  const MIRROR = 'https://osu.direct/api';
  const LS_QUEUE = 'mfhry_music_queue';
  const LS_STATE = 'mfhry_music_state';

  let queue = [];        // [{setId,title,artist}]
  let idx = -1;
  let loopMode = 0;      // 0 顺序 1 单曲 2 随机
  const LOOP_TXT = ['顺序', '单曲', '随机'];
  let blobUrl = '';
  let busy = false;
  const bufCache = new Map();   // setId -> objectURL
  let bgUrl = '';

  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mmss = (s) => {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60), x = Math.floor(s % 60);
    return m + ':' + (x < 10 ? '0' + x : x);
  };

  // ---------- 封面 ----------
  const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#141a20"/>' +
    '<text x="150" y="168" font-size="86" fill="#33414d" text-anchor="middle" font-family="sans-serif">♪</text></svg>');
  const coverOf = (id) => 'https://assets.ppy.sh/beatmaps/' + id + '/covers/cover.jpg';
  const theCover = $('cover');
  const fsArt = $('fsArt'), fsBg = $('fsBg');
  function setArt(src) {
    if ($('ambientImg')) $('ambientImg').src = src;
    for (const el of [theCover, fsArt, fsBg]) {
      el.onerror = () => { el.onerror = null; el.src = PLACEHOLDER; };
      el.src = src;
    }
  }
  setArt(PLACEHOLDER);
  const thumbFor = (id) => {
    const im = new Image();
    im.className = 'thumb';
    im.loading = 'lazy';
    im.onerror = () => { im.onerror = null; im.src = PLACEHOLDER; };
    im.src = coverOf(id);
    return im;
  };

  // ---------- 缓存（和音游共用同一个库，下过的谱面包两边都能用） ----------
  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('mfhry_rhythm', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('osz')) r.result.createObjectStore('osz'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function cacheGet(k) {
    try {
      const d = await db();
      return await new Promise((res) => {
        const rq = d.transaction('osz', 'readonly').objectStore('osz').get(k);
        rq.onsuccess = () => res(rq.result || null);
        rq.onerror = () => res(null);
      });
    } catch (e) { return null; }
  }
  async function cachePut(k, v) {
    try {
      const d = await db();
      await new Promise((res) => {
        const tx = d.transaction('osz', 'readwrite');
        tx.objectStore('osz').put(v, k);
        tx.oncomplete = res; tx.onerror = res;
      });
    } catch (e) {}
  }

  // ---------- zip ----------
  function decodeText(bytes) {
    let s = new TextDecoder('utf-8').decode(bytes);
    if (s.indexOf('\uFFFD') < 0) return s;
    for (const enc of ['gbk', 'shift_jis', 'big5', 'euc-kr']) {
      try {
        const t = new TextDecoder(enc).decode(bytes);
        if (t.indexOf('\uFFFD') < 0) return t;
      } catch (e) {}
    }
    return s;
  }
  function readZip(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是 zip');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const files = [];
    for (let i = 0; i < count; i++) {
      if (off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nlen = dv.getUint16(off + 28, true);
      const elen = dv.getUint16(off + 30, true);
      const clen = dv.getUint16(off + 32, true);
      const lho = dv.getUint32(off + 42, true);
      files.push({ name: decodeText(u8.subarray(off + 46, off + 46 + nlen)), method, csize, lho });
      off += 46 + nlen + elen + clen;
    }
    return files;
  }
  async function zipEntry(buf, entry, all) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    const nlen = dv.getUint16(entry.lho + 26, true);
    const elen = dv.getUint16(entry.lho + 28, true);
    const start = entry.lho + 30 + nlen + elen;
    let csize = entry.csize;
    if (!csize) {
      const next = all.map((f) => f.lho).filter((o) => o > entry.lho).sort((a, b) => a - b)[0];
      csize = (next || u8.length) - start - 16;
    }
    const raw = u8.subarray(start, start + csize);
    if (entry.method === 0) return raw;
    const stream = new Response(raw).body.pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  // ---------- 取音频：边下边解析，拿到音频就断开 ----------
  const API = '/api/mirror';
  const DIRECT = 'https://osu.direct/api/d/';
  const MB = 1048576;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const AUDIO_RE = /\.(mp3|ogg|m4a|wav)$/i;
  const IMG_RE = /\.(jpg|jpeg|png)$/i;

  function timed(ms) {
    try { return AbortSignal.timeout(ms); } catch (e) { return undefined; }
  }

  async function fetchSet(id) {
    let last = '连接失败';
    for (let a = 0; a < 2; a++) {
      for (const url of [API + '?id=' + id, DIRECT + id]) {
        try {
          const res = await fetch(url, { signal: timed(a === 0 ? 25000 : 45000) });
          if (res.ok && res.body) return res;
          last = '镜像 ' + res.status;
        } catch (e) { last = /abort/i.test(e.message) ? '超时' : e.message; }
      }
      if (last === '镜像 503') break;
      await sleep(600);
    }
    throw new Error(last);
  }

  // 顺着本地文件头逐条读，只保留谱面文本 + 音频 + 封面，其余数据读掉不存
  async function streamSet(id, onStatus) {
    const res = await fetchSet(id);
    const total = +res.headers.get('content-length') || 0;
    const reader = res.body.getReader();
    let hold = new Uint8Array(0), holdStart = 0;
    let pos = 0, seen = 0;
    let audioName = '', bgName = '';
    let audio = null, bg = null;
    const captured = {};

    const append = (b) => {
      const n = new Uint8Array(hold.length + b.length);
      n.set(hold, 0); n.set(b, hold.length); hold = n;
    };
    const ensure = async (upto) => {
      while (holdStart + hold.length < upto) {
        const { done, value } = await reader.read();
        if (done) return false;
        if (value && value.length) append(value);
      }
      return true;
    };
    const dropTo = (abs) => {
      const cut = abs - holdStart;
      if (cut > 0) { hold = hold.subarray(cut); holdStart = abs; }
    };

    try {
      for (;;) {
        if (!(await ensure(pos + 30))) break;
        const rel = pos - holdStart;
        const dv = new DataView(hold.buffer, hold.byteOffset, hold.byteLength);
        if (dv.getUint32(rel, true) !== 0x04034b50) break;
        const method = dv.getUint16(rel + 8, true);
        const csize = dv.getUint32(rel + 18, true);
        const nlen = dv.getUint16(rel + 26, true);
        const elen = dv.getUint16(rel + 28, true);
        if (!(await ensure(pos + 30 + nlen))) break;
        const name = decodeText(hold.subarray(pos - holdStart + 30, pos - holdStart + 30 + nlen));
        const dataStart = pos + 30 + nlen + elen;
        const dataEnd = dataStart + csize;
        seen++;

        const lower = name.toLowerCase();
        const isOsu = lower.endsWith('.osu');
        const isAudio = AUDIO_RE.test(name);
        const isImg = IMG_RE.test(name);
        const wantAudio = audioName ? lower === audioName : isAudio;
        const wantBg = bgName ? lower === bgName : (isImg && seen > 1);
        const keep = isOsu || (wantAudio && !audio) || (wantBg && !bg);

        if (!keep) {
          // 读掉不存，省内存；到文件尾就结束
          if (!(await ensure(dataEnd))) break;
          dropTo(dataEnd);
          pos = dataEnd;
        } else {
          if (!(await ensure(dataEnd))) break;
          const data = hold.subarray(dataStart - holdStart, dataEnd - holdStart).slice();
          dropTo(dataEnd);
          pos = dataEnd;
          let bytes = data;
          if (method !== 0) {
            try {
              const s = new Response(data).body.pipeThrough(new DecompressionStream('deflate-raw'));
              bytes = new Uint8Array(await new Response(s).arrayBuffer());
            } catch (e) { bytes = null; }
          }
          if (!bytes) continue;
          if (isOsu) {
            const txt = decodeText(bytes);
            const an = ((/AudioFilename\s*:\s*(.+)/i.exec(txt) || [])[1] || '').trim();
            const bn = ((/^\s*0,0,"([^"]+)"/m.exec(txt) || [])[1] || '').trim();
            if (an && !audioName) audioName = an.toLowerCase();
            if (bn && !bgName && IMG_RE.test(bn)) bgName = bn.toLowerCase();
          } else if (wantAudio && !audio) {
            audio = bytes;
            onStatus && onStatus('音频到手 ' + (bytes.length / MB).toFixed(1) + ' MB', 1);
          } else if (wantBg && !bg) {
            bg = { bytes, name: lower };
          }
          if (audio && (bg || !bgName)) break;
        }
        if (audio && seen > 60) break;
      }
    } finally {
      try { await reader.cancel(); } catch (e) {}
    }

    if (!audio) throw new Error('包里没找到音频');
    return { audio, bg, audioName };
  }

  async function loadSetAudio(id, onStatus) {
    const audKey = 'aud:' + id, bgKey = 'bg:' + id;
    const cachedAud = await cacheGet(audKey);
    if (cachedAud) {
      const bgc = await cacheGet(bgKey);
      return {
        url: URL.createObjectURL(new Blob([cachedAud], { type: 'audio/mpeg' })),
        bgUrl: bgc ? URL.createObjectURL(new Blob([bgc])) : '',
      };
    }
    onStatus && onStatus('连接镜像…', 0);
    const got = await streamSet(id, onStatus);
    await cachePut(audKey, got.audio.buffer);
    if (got.bg) await cachePut(bgKey, got.bg.bytes.buffer);
    return {
      url: URL.createObjectURL(new Blob([got.audio], { type: 'audio/mpeg' })),
      bgUrl: got.bg ? URL.createObjectURL(new Blob([got.bg.bytes],
        { type: got.bg.name.endsWith('.png') ? 'image/png' : 'image/jpeg' })) : '',
    };
  }

  async function findAlternatives(s, tried) {
    try {
      const q = ((s.title || '') + ' ' + (s.artist || '')).trim();
      const r = await fetch(MIRROR + '/search?query=' + encodeURIComponent(q) + '&limit=8');
      if (!r.ok) return [];
      const list = rankSets(await r.json(), s.title || '');
      return list.filter((x) => !tried.has(String(x.SetID)))
        .slice(0, 4)
        .map((x) => ({ setId: x.SetID, title: x.Title || s.title, artist: x.Artist || s.artist }));
    } catch (e) { return []; }
  }

  async function loadTrack(s, onStatus) {
    const tried = new Set([String(s.setId)]);
    let cur = s;
    for (let a = 0; a < 4; a++) {
      try {
        const r = await loadSetAudio(cur.setId, onStatus);
        return Object.assign({ item: cur }, r);
      } catch (e) {
        let alts = (cur.alts || []).filter((x) => !tried.has(String(x.setId)));
        if (!alts.length) alts = (await findAlternatives(s, tried)).filter((x) => !tried.has(String(x.setId)));
        if (!alts.length) throw e;
        const next = alts.shift();
        tried.add(String(next.setId));
        onStatus && onStatus('拿不到这个包（' + e.message + '），换同曲的另一个版本…', 0);
        cur = Object.assign({}, cur, next, { alts });
      }
    }
    throw new Error('同曲的几个谱面包都拿不到');
  }

  // ---------- 播放 ----------
  function setStatus(t) { $('status').textContent = t; }

  async function play(i, autoplay = true) {
    if (i < 0 || i >= queue.length) return;
    if (busy) return;
    busy = true;
    idx = i;
    let s = queue[i];
    renderQueue();
    renderFsQueue();
    $('npTitle').innerHTML = esc(s.title || '未知曲目') + '<small>' + esc(s.artist || '') + '</small>';
    setArt(s.cover || (s.r2 ? PLACEHOLDER : coverOf(s.setId)));
    document.title = (s.title || '音乐') + ' · mfhry.store';
    $('bar').classList.add('on');
    $('bari').style.width = '0%';
    setStatus('准备音频…');
    try {
      let url = s.r2 || bufCache.get(String(s.setId));
      if (!url) {
        const got = await loadTrack(s, (msg, frac) => {
          setStatus(msg);
          if (frac != null) $('bari').style.width = Math.round(frac * 100) + '%';
        });
        if (got.item.setId !== s.setId) {
          s = got.item;
          queue[i] = s;
          persist(); renderQueue();
          $('npTitle').innerHTML = esc(s.title || '未知曲目') + '<small>' + esc(s.artist || '') + '</small>';
          setArt(coverOf(s.setId));
        }
        url = got.url;
        bufCache.set(String(s.setId), url);
        if (got.bgUrl && idx === i) { bgUrl = got.bgUrl; setArt(got.bgUrl); }
        setStatus('已存到本机缓存');
      } else if (s.r2) {
        url = s.r2;
        setStatus('R2 直链' + (autoplay ? '，开始播放' : ''));
      }
      if (blobUrl && blobUrl !== url) URL.revokeObjectURL(blobUrl);
      blobUrl = url;
      au.src = url;
      au.load();
      $('bar').classList.remove('on');
      if (!s.r2) setStatus((s.artist ? s.artist + ' · ' : '') + '本地缓存' + (autoplay ? '，开始播放' : ''));
      if (autoplay) await au.play().catch((e) => setStatus('浏览器拦了自动播放，点一下 ▶'));
      setMediaSession(s);
      renderQueue();
      syncFS();
      loadLyrics(s);
    } catch (e) {
      setStatus('没成功：' + e.message);
    } finally {
      busy = false;
    }
  }

  function setMediaSession(s) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.title || '', artist: s.artist || '', album: 'mfhry.store',
      });
      navigator.mediaSession.setActionHandler('play', () => au.play());
      navigator.mediaSession.setActionHandler('pause', () => au.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
      navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
    } catch (e) {}
  }

  function step(dir) {
    if (!queue.length) return;
    if (dir > 0 && loopMode === 2) return play(Math.floor(Math.random() * queue.length));
    const n = idx + dir;
    if (n < 0) return play(queue.length - 1);
    if (n >= queue.length) return play(0);
    play(n);
  }

  // ---------- 列表 ----------
  function renderQueue() {
    const wrap = $('queue');
    wrap.innerHTML = '';
    $('qcount').textContent = queue.length + ' 首';
    if (!queue.length) {
      wrap.innerHTML = '<div class="empty">播放列表是空的。搜歌后点「＋ 加入」。</div>';
      return;
    }
    queue.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'item' + (i === idx ? ' playing' : '');
      const left = document.createElement('span');
      left.style.cssText = 'display:flex;align-items:center;gap:9px;min-width:0;cursor:pointer';
      left.appendChild(thumbFor(s.setId));
      const txt = document.createElement('span');
      txt.innerHTML = (i === idx ? '▶ ' : (i + 1) + '. ') + esc(s.title || '?') +
        '<br><small>' + esc(s.artist || '') + '</small>';
      txt.style.minWidth = '0';
      left.appendChild(txt);
      d.appendChild(left);
      const right = document.createElement('span');
      right.innerHTML = '<span class="act go">播放</span><span class="rm" title="移除">✕</span>';
      d.appendChild(right);
      left.onclick = () => play(i);
      d.querySelector('.go').onclick = () => play(i);
      d.querySelector('.rm').onclick = (e) => {
        e.stopPropagation();
        const wasPlaying = i === idx;
        queue.splice(i, 1);
        if (i < idx) idx--;
        else if (wasPlaying) { au.pause(); idx = Math.min(idx, queue.length - 1); }
        persist(); renderQueue();
        if (wasPlaying && queue.length) play(idx);
        else if (!queue.length) { $('npTitle').innerHTML = '还没选歌<small>搜索或点下面的推荐曲单</small>'; $('cur').textContent = '0:00'; $('dur').textContent = '0:00'; }
      };
      wrap.appendChild(d);
    });
  }

  const SHOW = 3;
  let lastResults = [], resOpen = false;

  function renderResults(list) {
    const wrap = $('results');
    wrap.innerHTML = '';
    if (!list.length) { wrap.innerHTML = '<div class="empty">没搜到，换个关键词（英文 / 罗马音更准）</div>'; return; }
    const show = resOpen ? list : list.slice(0, SHOW);
    for (const s of show) {
      const d = document.createElement('div');
      d.className = 'item';
      const diffs = (s.ChildrenBeatmaps || []).length;
      d.innerHTML = '<span>' + esc(s.Title || '?') + ' — ' + esc(s.Artist || '') +
        '<br><small>' + esc(s.Creator || '') + ' · ' + diffs + ' 个难度 · ♥ ' + (s.Favourites || 0) + '</small></span>' +
        '<span class="act">＋ 加入</span>';
      d.querySelector('.act').onclick = () => addSong({
        setId: s.SetID, title: s.Title || '未知曲目', artist: s.Artist || '',
      });
      wrap.appendChild(d);
    }
    if (list.length > SHOW) {
      const more = document.createElement('div');
      more.className = 'more';
      more.textContent = resOpen ? '收起 ↑' : '展开全部 ' + list.length + ' 个 ↓';
      more.onclick = () => { resOpen = !resOpen; renderResults(lastResults); };
      wrap.appendChild(more);
    }
  }

  function addSong(s) {
    const dup = queue.find((x) => String(x.setId) === String(s.setId));
    if (dup) {
      // 合并新字段（歌词/封面/直链），修复旧版存的条目
      let changed = false;
      for (const k of ['r2', 'lyrics', 'cover', 'artist', 'mv']) {
        if (s[k] && dup[k] !== s[k]) { dup[k] = s[k]; changed = true; }
      }
      if (changed) { persist(); setStatus('《' + s.title + '》已更新（有歌词/封面了）'); }
      else setStatus('《' + s.title + '》已经在列表里了');
      renderQueue();
      return;
    }
    queue.push(s);
    persist();
    renderQueue();
    setStatus('已加入《' + s.title + '》');
    if (idx < 0) play(queue.length - 1);
  }

  function persist() { save(LS_QUEUE, queue); save(LS_STATE, { idx }); }

  // ---------- 搜索 ----------
  function rankSets(list, q) {
    const norm = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const toks = norm(q).split(' ').filter((t) => t.length > 1);
    const bad = /various artists|compilation|favourites|pack|collection|megamix|medley/i;
    return list.map((s) => {
      const title = norm(s.Title), artist = norm(s.Artist);
      let k = 0;
      for (const t of toks) { if (title.includes(t)) k += 6; else if (artist.includes(t)) k += 3; }
      k += Math.min(6, Math.log10(1 + (s.Favourites || 0)) * 2);
      if (bad.test((s.Title || '') + ' ' + (s.Artist || ''))) k -= 5;
      if (/cover|instrumental|off vocal|karaoke|8-bit|chiptune|nightcore|remix/i.test(s.Title || '')) k -= 4;
      if (/cover|instrumental|off vocal|karaoke|8-bit|chiptune|nightcore|remix/i.test(s.Title || '')) k -= 2;
      const lens = (s.ChildrenBeatmaps || []).map((c) => c.TotalLength || 0);
      if (lens.length && Math.max(...lens) > 480) k -= 4;
      return { s, k };
    }).sort((a, b) => b.k - a.k).map((x) => x.s);
  }

  async function search(q) {
    setStatus('搜索中…');
    for (let a = 0; a < 2; a++) {
      try {
        const r = await fetch(MIRROR + '/search?query=' + encodeURIComponent(q) + '&limit=10');
        if (!r.ok) throw new Error('镜像返回 ' + r.status);
        const list = rankSets(await r.json(), q);
        lastResults = list;
        resOpen = false;
        renderResults(list);
        setStatus(list.length ? '找到 ' + list.length + ' 个结果，点「＋ 加入」' : '没搜到，换个词');
        return;
      } catch (e) {
        if (a === 1) setStatus('搜索失败：' + e.message + '（再点一次）');
        else await new Promise((r) => setTimeout(r, 800));
      }
    }
  }

  function renderHot() {
    const wrap = $('hot');
    wrap.innerHTML = '';
    for (const g of (window.MFHRY_SONGS || [])) {
      const t = document.createElement('div');
      t.className = 'gtitle';
      t.textContent = g.title;
      wrap.appendChild(t);
      const row = document.createElement('div');
      row.className = 'row';
      for (const h of g.items) {
        const b = document.createElement('span');
        b.className = 'chip';
        b.textContent = h.label;
        b.onclick = () => {
          if (h.r2) {
            addSong({ setId: 'r2:' + h.label, title: h.label, artist: h.artist || '', r2: h.r2, lyrics: h.lyrics || '', cover: h.cover || '' });
          } else { $('q').value = h.label; search(h.q); }
        };
        row.appendChild(b);
      }
      wrap.appendChild(row);
    }
  }

  // ---------- 事件 ----------
  $('toggle').onclick = () => {
    if (!au.src) { if (queue.length) play(idx < 0 ? 0 : idx); return; }
    if (au.paused) au.play().catch(() => {}); else au.pause();
  };
  au.addEventListener('play', () => { $('toggle').textContent = '⏸'; syncFS(); });
  au.addEventListener('pause', () => { $('toggle').textContent = '▶'; syncFS(); });
  au.addEventListener('ended', () => {
    if (loopMode === 1) { au.currentTime = 0; au.play().catch(() => {}); return; }
    step(1);
  });
  au.addEventListener('timeupdate', () => {
    if (!au.duration || dragging) return;
    $('cur').textContent = mmss(au.currentTime);
    $('dur').textContent = mmss(au.duration);
    $('seek').value = String(Math.round((au.currentTime / au.duration) * 1000));
    if (fsEl.classList.contains('on')) syncFS();
    syncLyrics(au.currentTime);
  });
  au.addEventListener('loadedmetadata', () => { $('dur').textContent = mmss(au.duration); });
  au.addEventListener('error', () => { if (au.src) setStatus('这个音频浏览器放不了，换一首'); });

  let dragging = false;
  $('seek').addEventListener('input', () => { dragging = true; });
  $('seek').addEventListener('change', () => {
    if (au.duration) au.currentTime = (+$('seek').value / 1000) * au.duration;
    dragging = false;
  });
  $('vol').addEventListener('input', () => {
    au.volume = +$('vol').value;
    $('fsVol').value = String(au.volume);
    try { localStorage.setItem('mfhry_music_vol', $('vol').value); } catch (e) {}
  });
  $('loop').onclick = () => { loopMode = (loopMode + 1) % 3; $('loop').textContent = LOOP_TXT[loopMode]; syncFS(); };
  $('prev').onclick = () => step(-1);
  $('next').onclick = () => step(1);
  $('search').onclick = () => { const q = $('q').value.trim(); if (q) search(q); };
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const q = $('q').value.trim(); if (q) search(q); } });
  window.addEventListener('keydown', (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === ' ') { e.preventDefault(); $('toggle').click(); }
    if (e.key === 'ArrowRight' && au.duration) au.currentTime = Math.min(au.duration, au.currentTime + 5);
    if (e.key === 'ArrowLeft' && au.duration) au.currentTime = Math.max(0, au.currentTime - 5);
  });


  // ---------- 全屏播放（仿 macOS 音乐 App） ----------
  const fsEl = $('fs');
  const PLAY_SVG = '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" width="28" height="28"><rect x="6.8" y="5" width="3.6" height="14" rx="1.5" fill="currentColor"/><rect x="13.6" y="5" width="3.6" height="14" rx="1.5" fill="currentColor"/></svg>';

  // ---------- MV 播放（可切换分辨率 / 版本） ----------
  let mvMode = false, mvVers = 0, mvRes = 0;
  const mv = $('mv'), mvBar = $('mvBar'), mvBtn = $('fsMv');

  function buildMvBar() {
    const s = queue[idx] || {};
    if (!mvMode || !s.mv || !s.mv.length) { mvBar.classList.remove('on'); mvBar.innerHTML = ''; return; }
    mvBar.classList.add('on');
    mvBar.innerHTML = '';
    s.mv.forEach((v, i) => {
      const b = document.createElement('button');
      b.textContent = v.title || 'MV';
      b.className = i === mvVers ? 'on' : '';
      b.onclick = () => { mvVers = i; mvRes = 0; loadMv(); buildMvBar(); if (!mv.paused) mv.play().catch(() => {}); syncFS(); };
      mvBar.appendChild(b);
    });
    const v = s.mv[mvVers];
    if (v && v.res && v.res.length > 1) {
      v.res.forEach((r, j) => {
        const b = document.createElement('button');
        b.textContent = r.label;
        b.className = j === mvRes ? 'on' : '';
        b.onclick = () => {
          const keep = mv.currentTime || 0;
          mvRes = j; mv.src = r.url;
          if (keep) mv.currentTime = keep;
          buildMvBar();
          if (!mv.paused) mv.play().catch(() => {});
          syncFS();
        };
        mvBar.appendChild(b);
      });
    }
  }

  function loadMv() {
    const v = (queue[idx] || {}).mv;
    if (!v || !v[mvVers] || !v[mvVers].res[mvRes]) return;
    mv.src = v[mvVers].res[mvRes].url;
  }

  function enterMv() {
    const s = queue[idx] || {};
    if (!s.mv || !s.mv.length) return;
    if (mvVers >= s.mv.length) mvVers = 0;
    if (mvRes >= (s.mv[mvVers].res || []).length) mvRes = 0;
    mvMode = true;
    mvBtn.textContent = '✕ 退出 MV';
    const keep = au.currentTime || 0;
    loadMv();
    if (keep) { try { mv.currentTime = keep; } catch (e) {} }
    fsArt.classList.add('mvhide');
    $('lyricsCard').classList.add('mvhide');
    mv.classList.add('on');
    buildMvBar();
    if (!au.paused) { au.pause(); mv.play().catch(() => {}); }
    syncFS();
  }

  function exitMv() {
    if (!mvMode) return;
    const wasPlaying = !!mv.src && !mv.paused;
    const pos = mv.currentTime || 0;
    mvMode = false;
    mvBtn.textContent = '▶ 播放 MV';
    mv.classList.remove('on');
    mvBar.classList.remove('on');
    fsArt.classList.remove('mvhide');
    $('lyricsCard').classList.remove('mvhide');
    mv.pause();
    if (wasPlaying) {
      if (pos && au.duration && pos < au.duration) { try { au.currentTime = pos; } catch (e) {} }
      au.play().catch(() => {});
    }
    syncFS();
  }

  mvBtn.onclick = () => (mvMode ? exitMv() : enterMv());
  mv.addEventListener('timeupdate', syncFS);
  mv.addEventListener('play', syncFS);
  mv.addEventListener('pause', syncFS);
  mv.addEventListener('ended', () => step(1));

  function syncFS() {
    const s = queue[idx] || {};
    const playing = mvMode ? !!mv.src && !mv.paused : !!au.src && !au.paused;
    $('fsTitle').textContent = s.title || '未在播放';
    $('fsArtist').textContent = s.artist || '';
    $('fsToggle').innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
    const t = mvMode ? mv : au;
    $('fsCur').textContent = mmss(t.currentTime);
    $('fsDur').textContent = mmss(t.duration);
    if (t.duration) { const fp = Math.round((t.currentTime / t.duration) * 1000); $('fsSeek').value = String(fp); $('fsSeek').style.setProperty('--p', (fp/10)+'%'); }
    $('fsVol').value = String(au.volume);
    $('fsShuffle').classList.toggle('on', loopMode === 2);
    $('fsLoop').classList.toggle('on', loopMode !== 0);
    fsArt.classList.toggle('playing', !mvMode && playing);
    const hasMv = !!(s.mv && s.mv.length);
    $('fsMv').hidden = mvMode ? false : !hasMv;
    if (mvMode && !hasMv) exitMv();
  }

  function renderFsQueue() {
    const wrap = $('fsQueue');
    wrap.innerHTML = '';
    const next = queue.slice(idx + 1, idx + 8);
    if (!next.length) {
      wrap.innerHTML = '<div class="fs-empty">列表里没有下一首了</div>';
      return;
    }
    next.forEach((s, k) => {
      const d = document.createElement('div');
      d.className = 'fs-q';
      const im = new Image();
      im.loading = 'lazy';
      im.src = coverOf(s.setId);
      im.onerror = () => { im.onerror = null; im.src = PLACEHOLDER; };
      const t = document.createElement('span');
      t.innerHTML = '<b>' + esc(s.title || '?') + '</b><small>' + esc(s.artist || '') + '</small>';
      d.appendChild(im); d.appendChild(t);
      d.onclick = () => play(idx + 1 + k);
      wrap.appendChild(d);
    });
  }

  function openFS() {
    fsEl.classList.add('on');
    document.body.style.overflow = 'hidden';
    if (!fsArt.src || fsArt.src === PLACEHOLDER) setArt(theCover.src || PLACEHOLDER);
    syncFS();
    renderFsQueue();
  }
  function closeFS() {
    fsEl.classList.remove('on');
    document.body.style.overflow = '';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }

  $('fsOpen').onclick = openFS;
  $('fsClose').onclick = closeFS;
  $('fsReal').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else (fsEl.requestFullscreen ? fsEl.requestFullscreen() : Promise.reject()).catch(() => {});
  };
  $('fsToggle').onclick = () => { if (mvMode) { mv.paused ? mv.play().catch(() => {}) : mv.pause(); } else $('toggle').click(); };
  $('fsPrev').onclick = () => step(-1);
  $('fsNext').onclick = () => step(1);
  $('fsLoop').onclick = () => $('loop').click();
  $('fsShuffle').onclick = () => { loopMode = loopMode === 2 ? 0 : 2; $('loop').textContent = LOOP_TXT[loopMode]; syncFS(); };
  $('fsSeek').addEventListener('input', () => {
    const t = mvMode ? mv : au;
    if (t.duration) t.currentTime = (+$('fsSeek').value / 1000) * t.duration;
  });
  $('fsVol').addEventListener('input', () => {
    au.volume = +$('fsVol').value;
    mv.volume = au.volume;
    $('vol').value = String(au.volume);
    try { localStorage.setItem('mfhry_music_vol', $('vol').value); } catch (e) {}
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && fsEl.classList.contains('on')) { closeFS(); }
  });

  // ---------- 启动 ----------
  queue = Array.isArray(load(LS_QUEUE, [])) ? load(LS_QUEUE, []) : [];
  // 迁移：把旧存的精选条目和 songs.js 对齐（补歌词/封面/直链字段）
  try {
    const feat = {};
    for (const g of (window.MFHRY_SONGS || [])) for (const h of (g.items || [])) if (h.r2) feat['r2:' + h.label] = h;
    let migrated = false;
    for (const q of queue) {
      const h = feat[q.setId];
      if (h) for (const k of ['r2', 'lyrics', 'cover', 'artist', 'mv']) if (h[k] && q[k] !== h[k]) { q[k] = h[k]; migrated = true; }
    }
    if (migrated) persist();
  } catch (e) {}
  const vol = load('mfhry_music_vol', 0.85);
  au.volume = typeof vol === 'string' ? +vol : vol;
  $('vol').value = au.volume;
  $('loop').textContent = LOOP_TXT[loopMode];
  renderHot();
  renderQueue();
  if (queue.length) {
    const st = load(LS_STATE, { idx: 0 });
    const i = Math.max(0, Math.min(queue.length - 1, st.idx | 0));
    play(i, false);   // 恢复上次的歌，但不自动出声（浏览器要手势）
  }


  // ---------- 按钮 / 快捷键 ----------

  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); if (au.paused) au.play().catch(() => {}); else au.pause(); }
    else if (k === 'ArrowRight') { e.preventDefault(); if (au.duration) au.currentTime = Math.min(au.duration - 0.5, au.currentTime + 5); }
    else if (k === 'ArrowLeft') { e.preventDefault(); au.currentTime = Math.max(0, au.currentTime - 5); }
    else if (k === 'ArrowUp') { e.preventDefault(); au.volume = Math.min(1, au.volume + 0.05); $('vol').value = String(au.volume); }
    else if (k === 'ArrowDown') { e.preventDefault(); au.volume = Math.max(0, au.volume - 0.05); $('vol').value = String(au.volume); }
    else if (k === 'f' || k === 'F') { fsEl.classList.contains('on') ? closeFS() : openFS(); }
  });


  // ---------- 歌词 ----------
  let lyrics = null, lyIdx = -1;
  function lyOffset() { return (+$('lyOffset').value || 0) / 1000; }
  $('lyOffset').addEventListener('input', () => {
    $('lyOffVal').textContent = $('lyOffset').value + 'ms';
    try { localStorage.setItem('mfhry_ly_off_' + (queue[idx]?.setId || ''), $('lyOffset').value); } catch(e){}
  });
  async function loadLyrics(s) {
    lyrics = null; lyIdx = -1;
    const card = $('lyricsCard'); if (card) card.classList.remove('on');
    const fsBox = $('fsLy'); if (fsBox) fsBox.innerHTML = '';
    if (!s || !s.lyrics) return;
    try {
      const r = await fetch(s.lyrics, { cache: 'no-store' });
      const d = await r.json();
      lyrics = Array.isArray(d.lines) ? d.lines : [];
      const saved = localStorage.getItem('mfhry_ly_off_' + s.setId);
      $('lyOffset').value = saved != null ? saved : '0';
      $('lyOffVal').textContent = $('lyOffset').value + 'ms';
      $('lyTitle').textContent = (d.artist ? d.artist + ' · ' : '') + (d.song || '');
      renderLyrics();
      $('lyricsCard').classList.add('on');
    } catch(e) { console.warn('lyrics load failed', e); }
  }
  function renderLyrics() {
    if (!lyrics) return;
    const mk = (box) => {
      box.innerHTML = lyrics.map((l, i) =>
        '<div class="ly-line" data-i="' + i + '" data-t="' + l.t + '">' +
        '<div class="ly-ja">' + esc(l.ja || '') + '</div>' +
        (l.zh ? '<div class="ly-zh">' + esc(l.zh) + '</div>' : '') + '</div>'
      ).join('');
      box.onclick = (e) => {
        const line = e.target.closest('.ly-line');
        if (line && au.duration) au.currentTime = Math.max(0, (+line.dataset.t || 0) - lyOffset());
      };
    };
    for (const id of ['lyricsBox', 'fsLy']) {
      const box = $(id);
      if (box) mk(box);
    }
  }
  function syncLyrics(t) {
    if (!lyrics || !lyrics.length) return;
    const ct = t + lyOffset();
    let ni = 0;
    for (let i = 0; i < lyrics.length; i++) { if (lyrics[i].t <= ct) ni = i; else break; }
    if (ni === lyIdx) return;
    lyIdx = ni;
    for (const box of [$('lyricsBox'), $('fsLy')]) {
      if (!box) continue;
      const prev = box.querySelector('.ly-line.active');
      if (prev) prev.classList.remove('active');
      const cur = box.querySelector('.ly-line[data-i="' + ni + '"]');
      if (cur) {
        cur.classList.add('active');
        // 只滚动歌词容器本身，避免 scrollIntoView 连带滚动页面导致卡片下方露出淡色玻璃底
        const br = box.getBoundingClientRect(), cr = cur.getBoundingClientRect();
        const target = box.scrollTop + (cr.top - br.top) - (br.height - cr.height) / 2;
        box.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }
    }
  }

  window.__music = {
    openFS: () => openFS(),
    closeFS: () => closeFS(),
    queue: () => queue.slice(),
    idx: () => idx,
    add: (o) => addSong(o),
    play: (i) => play(i),
    search: (q) => search(q),
    playing: () => !au.paused,
    time: () => au.currentTime,
    dur: () => au.duration,
    src: () => au.src.slice(0, 24),
  };
})();
</script>
<script src="/errlog.js"></script>
</body>
</html>
