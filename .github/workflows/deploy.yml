name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 历史存档的自动提交不再触发新部署，避免循环
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4

      # 版本交给 package.json 的 packageManager 字段，避免 "Multiple versions of pnpm specified"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch GitHub repos
        run: node scripts/pull-github.mjs
        env:
          GH_USER: ${{ vars.GH_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch releases (mirror downloads)
        run: node scripts/pull-releases.mjs
        env:
          GH_USER: ${{ vars.GH_USER }}
          RELEASE_REPOS: ${{ vars.RELEASE_REPOS != '' && vars.RELEASE_REPOS || 'mcai' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Aiven content
        run: node scripts/pull-content.mjs
        env:
          DATABASE_URL: ${{ secrets.AIVEN_PG_URL }}
          PG_CA: ${{ secrets.AIVEN_PG_CA }}

      - name: Mirror Stand with Jensen signers
        run: node scripts/pull-jensen.mjs

      - name: Mirror Stand with Jensen site
        run: node scripts/pull-jensen-site.mjs

      - name: Record jensen history
        run: node scripts/jensen-history.mjs

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name=${{ vars.PAGES_PROJECT != '' && vars.PAGES_PROJECT || 'mfhry-site' }} --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 把历史存档提交回仓库，页面才能「看以前」
      - name: Save jensen history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/jensen-history.json public/standwithjensen/archive
          if git diff --cached --quiet; then
            echo "没有历史变化"
            exit 0
          fi
          git commit -m "chore: jensen history [skip ci]"
          git push
